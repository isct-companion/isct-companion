[package]
name = "isct-ocr"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "Optional matrix-card OCR for IsctCompanion"

[features]
default = ["onnx"]
onnx = ["dep:base64", "dep:image", "dep:imageproc", "dep:ort", "dep:serde_json"]
training-tools = ["onnx"]

[[example]]
name = "alphabet_prepare"
required-features = ["training-tools"]

[[example]]
name = "matrix_dataset"
required-features = ["training-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# The pinned ONNX distribution has no Intel macOS, Intel iOS simulator or
# Android x86_64 binary. Excluding the whole backend leaves unsupported targets
# free of image/ORT.
[target.'cfg(not(any(all(any(target_os = "macos", target_os = "ios"), target_arch = "x86_64"), all(target_os = "android", not(target_arch = "aarch64")))))'.dependencies]
base64 = { version = "0.22", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"], optional = true }
imageproc = { version = "0.27", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Replay tools still emit reports when the native model backend is disabled.
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# The replay profiler composes the actual scheduler with OCR; no production edge.
isct-core = { path = "../isct-core" }
