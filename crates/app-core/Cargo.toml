[package]
name = "app-core"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "Shared IsctCompanion domain logic and state"

[features]
default = []
# Desktop assignment workspaces, including attachments and ZIP packing.
desktop-workspaces = []
# Phone notification scheduling through the native SDK.
mobile-reminders = []
# The tools of the local MCP server; only the desktop serves one.
agent = ["dep:schemars", "desktop-workspaces"]
ts = ["dep:ts-rs", "adpt-isct/ts"]
# The fictional workspace and fixed clock of the website screenshots; only
# `yarn desktop:demo` (app.isctcompanion.demo, a debug build) turns it on.
demo = []
# The campus printer: the desktops, and Android through its print service
# (app-ffi turns it on for that target only). iOS never prints to it.
campus-printer = ["dep:adpt-printer", "dep:ipp", "tokio/net"]
# The campus map: its Isct-Data file, room matching and floor read models;
# the iOS and Android bindings switch it on, desktop does not. `hmac` signs
# floor photo uploads.
campus-map = ["dep:flate2", "dep:hmac"]

[dependencies]
adpt-isct = { path = "../adpt-isct" }
adpt-printer = { path = "../adpt-printer", optional = true }
vpn-protocol = { path = "../vpn-protocol" }
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
ipnet = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rrule = "0.14"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
ts-rs = { version = "12", features = ["serde-compat"], optional = true }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "fallible_uint", "backup"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# rustls with ring, not 0.13's default aws-lc-rs: ring is what the tree
# already builds for every target, and aws-lc-rs needs a C/CMake toolchain per
# target. `net::client_builder` installs ring as the process provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "system-proxy", "json", "form", "query", "stream", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
bytes = "1"
encoding_rs = "0.8"
md-5 = "0.11"
sha2 = "0.11"
hmac = { version = "0.13", optional = true }
regex = "1"
unicode-normalization = "0.1"
strsim = "0.11"
scraper = "0.29"
ego-tree = "0.11"
ring = "0.17"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pdf-writer = "0.15"
percent-encoding = "2"
base64 = "0.23"
# Core's own school cookie jars (`school_session`): domain, path and expiry
# rules, and saving session cookies with the jar.
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
prost = "0.14"
data-encoding = "2"
# The campus map file is gzip (`campus_map::export`).
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
futures-util = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
schemars = { version = "1.2", optional = true, features = ["chrono04"] }
semver = "1"
# Settings shows the OTP setup as a QR code for other authenticators.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The OAuth loopback listener; iOS returns through its URL scheme instead.
[target.'cfg(not(target_os = "ios"))'.dependencies]
httparse = "1"
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(windows)'.dependencies]
ipp = { version = "8", default-features = false, optional = true }

[[example]]
name = "export-types"
required-features = ["ts"]
