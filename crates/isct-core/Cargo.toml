[package]
name = "isct-core"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "Shared IsctCompanion domain logic and state"

[features]
default = []
desktop-workspaces = ["dep:zip"]
ts = ["dep:ts-rs"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rrule = "0.14"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
ts-rs = { version = "11", features = ["serde-compat"], optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
scraper = "0.24"
ring = "0.17"
percent-encoding = "2"
base64 = "0.22"
prost = "0.14"
data-encoding = "2"
futures-util = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
semver = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[[example]]
name = "export-types"
required-features = ["ts"]
