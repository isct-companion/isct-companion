[package]
name = "app-ocr"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "Optional matrix-card OCR for IsctCompanion"
# build.rs hands dependents the Windows LiteRT DLL it fetched (DEP_LITERT_DLL).
links = "litert"

[features]
default = ["engine"]
engine = [
    "dep:block2",
    "dep:fast_image_resize",
    "dep:image",
    "dep:imageproc",
    "dep:libloading",
    "dep:nalgebra",
    "dep:objc2",
    "dep:objc2-core-ml",
    "dep:objc2-foundation",
    "dep:optical-flow-lk",
]
training-tools = ["engine"]

[[example]]
name = "alphabet_prepare"
required-features = ["training-tools"]

[[example]]
name = "matrix_dataset"
required-features = ["training-tools"]

[[example]]
name = "matrix_track_replay"
required-features = ["training-tools"]

[dependencies]
# Core's Matrix capability trait is implemented here (src/vision.rs).
app-core = { path = "../app-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# The targets with a letter runtime. Android x86 has none packaged (the app
# ships arm64 only), and a Linux host only runs the binding generator: excluding
# the whole backend leaves them free of image and model dependencies.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "windows", all(target_os = "android", target_arch = "aarch64")))'.dependencies]
# SIMD (SSE4.1/AVX2/NEON) resampling of the camera planes on every frame.
fast_image_resize = { version = "=6.1.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"], optional = true }
imageproc = { version = "0.27", default-features = false, optional = true }
# Same version and features imageproc already pulls in: no new crate.
nalgebra = { version = "0.35", default-features = false, features = ["std"], optional = true }
# Pyramidal Lucas-Kanade and Shi-Tomasi corners (MIT); depends only on `image`.
optical-flow-lk = { version = "=0.6.0", optional = true }

# macOS and iOS run the letter model (`engine/letters`) on the system's Core ML (Apple silicon and Intel), so
# the Apple apps link no inference library of their own. Same objc2 releases
# as tauri and wry already use.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSValue"], optional = true }
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "block2", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelAsset", "MLModelConfiguration", "MLMultiArray"], optional = true }

# Android and Windows open the LiteRT library packaged beside the app.
[target.'cfg(any(all(target_os = "android", target_arch = "aarch64"), target_os = "windows"))'.dependencies]
libloading = { version = "=0.9.0", optional = true }

[build-dependencies]
# Fetch and check the pinned Windows LiteRT DLL.
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Replay tools still emit reports when the native model backend is disabled.
serde_json = "1"
