[package]
name = "adpt-printer"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "The campus Kyocera printer for IsctCompanion Core: student IDs, LPD, PJL and the CUPS queue"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# RFC 1179 clients send from a port below 1024; std cannot bind before connecting.
socket2 = "0.6"

# The root CUPS helper. build.rs compiles the same file with rustc for the
# target and the library embeds it (`cups::HELPER`); this target exists so
# that clippy and the workspace build check it like any other code.
[[bin]]
name = "institute-printer-helper"
path = "src/cups/helper.rs"
test = false

[dev-dependencies]
serde_json = "1"
