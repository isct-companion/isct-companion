[package]
name = "adpt-printer"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "The campus Kyocera printer for IsctCompanion Core: student IDs, and LPD and PJL for Windows and Android"
publish = false

# RFC 1179 clients send from a port below 1024; std cannot bind before
# connecting. Android gives an app no such port, so only Windows binds one.
[target.'cfg(windows)'.dependencies]
socket2 = "0.6"

[target.'cfg(target_os = "android")'.dev-dependencies]
socket2 = "0.6"
