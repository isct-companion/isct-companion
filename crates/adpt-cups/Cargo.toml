[package]
name = "adpt-cups"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "The campus printer's CUPS queue for IsctCompanion on macOS: the titech-lpd backend and its installer"
publish = false

# Its programs (`programs/`) are not Cargo targets: build.rs compiles them
# for macOS only, and every other build has none of them.
[dependencies]
adpt-printer = { path = "../adpt-printer" }
