name: Bug report / 不具合の報告
description: Something in the app does not work as expected. / アプリが期待どおりに動かない。
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Issues may be written in Japanese, English or Chinese. / 日本語・英語・中国語のどれで書いてもかまいません。

        Wrong or missing calendar, exam or department data goes to [Isct-Data issues](https://github.com/isct-companion/Isct-Data/issues). / 校暦・試験・学系などのデータの誤りは [Isct-Data の issue](https://github.com/isct-companion/Isct-Data/issues) へ。

        AI assistance is not forbidden, but read what it wrote before submitting. See [CONTRIBUTING.md](https://github.com/isct-companion/isct-companion/blob/main/CONTRIBUTING.md#before-you-contribute). / AI の利用は禁止していませんが、送信前に内容を必ず読んでください。
  - type: input
    id: version
    attributes:
      label: App version / アプリのバージョン
      description: The release you installed, for example from GitHub Releases or the App Store. / インストールしたリリースのバージョン（GitHub Releases、App Store など）。
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / プラットフォーム
      multiple: true
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - iPhone
        - iPad
        - Android
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature / 対象機能
      description: Choose the closest match if you know it. / 当てはまる機能がわかる場合に選んでください。
      options:
        - Today and timetable / 今日・時間割
        - Course search and planning / 科目検索・履修計画
        - Exam dates and rooms / 試験日程・教室
        - Past exam library / 過去問ライブラリ
        - Assignment lists and deadlines / 課題一覧・締切
        - Assignment submission / 課題提出
        - Course files and workspaces / 授業資料・ワークスペース
        - File preview / ファイルプレビュー
        - School sign-in and OTP / 学内ログイン・OTP
        - School websites / 学内ウェブサイト
        - Cloud sync / クラウド同期
        - Backup and restore / バックアップ・復元
        - Campus VPN / 学内 VPN
        - Campus printing / 学内プリンター
        - Campus map / キャンパスマップ
        - Matrix card scanning / マトリクスカードの読み取り
        - Notifications and reminders / 通知・リマインダー
        - Home Screen widgets / ホーム画面ウィジェット
        - MCP and agent access / MCP・エージェント連携
        - Translations and language / 翻訳・言語
        - Installation and updates / インストール・更新
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour / 期待した動作と実際の動作
      value: |
        Expected / 期待した動作:

        Actual / 実際の動作:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs / スクリーンショット・ログ
      description: Hide your student ID, name, account details and credentials first. / 学籍番号・氏名・アカウント情報・パスワードは隠してから添付してください。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 確認
      options:
        - label: I searched the existing issues and this is not a duplicate. / 既存の issue を検索し、重複していないことを確認しました。
          required: true
        - label: If AI helped write this, I read it and it matches what happened. / AI に手伝ってもらった場合、内容を読み、実際に起きたことと一致していることを確認しました。
          required: true
