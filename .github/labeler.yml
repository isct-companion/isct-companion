# Pull request labels. Match paths that provide evidence of the affected area.
# Use all-globs-to-all-files for labels that describe the whole change.

area:desktop:
  - changed-files:
      - any-glob-to-any-file: apps/desktop/**

area:ios:
  - changed-files:
      - any-glob-to-any-file: apps/ios/**

area:android:
  - changed-files:
      - any-glob-to-any-file: apps/android/**

platform:macos:
