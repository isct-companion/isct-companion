name: Workspace Rust compiler cache
description: Cache workspace compilation by content while rust-cache retains external dependencies
inputs:
  save-if:
    description: Whether this job may populate the shared compiler cache
    default: 'true'
runs:
  using: composite
  steps:
    - uses: Mozilla-Actions/sccache-action@v0.0.11
      with:
        version: v0.16.0
    - name: Cache workspace crates by compiler input
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.save-if == 'true' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        # External dependencies already live in rust-cache. Only workspace
        # libraries need the content cache to survive a fresh checkout's mtimes.
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=$CACHE_MODE" >> "$GITHUB_ENV"
        echo "RUSTC_WORKSPACE_WRAPPER=sccache" >> "$GITHUB_ENV"
