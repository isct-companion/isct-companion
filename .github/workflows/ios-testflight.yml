name: iOS TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: ios-aarch64
      - run: yarn install --immutable
      - name: Generate platform-isolated iOS project
        run: yarn tauri ios init --ci
      - name: Validate signing and App Store Connect secrets
        shell: bash
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
      - name: Build signed IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: yarn tauri ios build --ci --export-method app-store-connect --build-number "${{ github.run_number }}"
      - name: Verify platform isolation
        shell: bash
        run: |
          set -euo pipefail
          ipa=$(find backend/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -n "$ipa"
          work="$RUNNER_TEMP/ios-bundle"
          mkdir "$work"
          ditto -x -k "$ipa" "$work"
          app=$(find "$work/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          node scripts/verify-platform-bundle.mjs ios "$app"
          codesign --verify --deep --strict "$app"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"
      - name: Upload to TestFlight
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: warn
          retention-days: 14
