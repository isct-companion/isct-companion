name: Desktop release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish desktop installers to this source repository
        type: boolean
        default: false
      replace_existing:
        description: Replace assets for an already published version
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize both Mac installers (requires Apple secrets)
        type: boolean
        default: false
      sign_windows:
        description: Sign the Windows app and installer with Azure Artifact Signing (requires Azure secrets)
        type: boolean
        default: false
      source_run_id:
        description: Successful Desktop release run to publish without rebuilding (leave blank to build)
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    if: github.event_name == 'push' || inputs.source_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The manual-acceptance table test dates each check against git
          # history; a shallow clone marks verified checks as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: yarn install --immutable
      - run: node scripts/desktop/desktop-release.mjs validate
      - run: yarn test
      - run: yarn test:types
      - run: cargo test -p isct-core --locked

  build:
    name: Build (${{ matrix.target }})
    needs: [verify]
    if: inputs.source_run_id == '' || github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      SIGN_MACOS: ${{ inputs.sign_macos || vars.MACOS_SIGNING_ENABLED == 'true' }}
      SIGN_WINDOWS: ${{ inputs.sign_windows || vars.WINDOWS_SIGNING_ENABLED == 'true' }}
      ISCT_UPDATER_PUBLIC_KEY: ${{ vars.ISCT_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - name: Set up Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: desktop-${{ matrix.target }}
      - run: yarn install --immutable
      - name: Validate frontend and release version
        shell: bash
        run: |
          yarn build
          node scripts/desktop/desktop-release.mjs validate
      - name: Apply optional OAuth overrides
        shell: bash
        env:
          CI_GOOGLE_CLIENT_ID: ${{ secrets.ISCTCOMPANION_GOOGLE_CLIENT_ID }}
          CI_GOOGLE_CLIENT_SECRET: ${{ secrets.ISCTCOMPANION_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [[ -n "$CI_GOOGLE_CLIENT_ID" ]]; then
            echo "ISCT_GOOGLE_DESKTOP_CLIENT_ID=$CI_GOOGLE_CLIENT_ID" >> "$GITHUB_ENV"
          fi
          if [[ -n "$CI_GOOGLE_CLIENT_SECRET" ]]; then
            echo "ISCT_GOOGLE_DESKTOP_CLIENT_SECRET=$CI_GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi
      - name: Install Windows signing tool
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked
      - name: Build desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_MACOS_PROVISIONING_PROFILE: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_MACOS_PROVISIONING_PROFILE || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_PRIVATE_KEY: ${{ runner.os == 'macOS' && env.SIGN_MACOS == 'true' && secrets.APPLE_API_PRIVATE_KEY || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && env.SIGN_WINDOWS == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && env.SIGN_WINDOWS == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && env.SIGN_WINDOWS == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ runner.os == 'Windows' && env.SIGN_WINDOWS == 'true' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT || '' }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && env.SIGN_WINDOWS == 'true' && vars.AZURE_ARTIFACT_SIGNING_ACCOUNT || '' }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ runner.os == 'Windows' && env.SIGN_WINDOWS == 'true' && vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS && "$SIGN_MACOS" == true ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_MACOS_PROVISIONING_PROFILE APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
              test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
            done
            [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application:"* ]] || { echo 'Use a Developer ID Application signing identity.'; exit 1; }
            key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_file"
            chmod 600 "$key_file"
            export APPLE_API_KEY="$APPLE_API_KEY_ID"
            export APPLE_API_KEY_PATH="$key_file"
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_MACOS_PROVISIONING_PROFILE APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY
          fi
          if [[ "$RUNNER_OS" == Windows && "$SIGN_WINDOWS" == true ]]; then
            for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
              test -n "${!name}" || { echo "Missing GitHub secret or variable: $name"; exit 1; }
            done
          else
            unset AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
          fi
          updater_args=()
          if [[ -n "$ISCT_UPDATER_PUBLIC_KEY" ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing secret'; exit 1; }
            node --input-type=module - <<'UPDATERCONFIG'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/updater-config.json`, JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.ISCT_UPDATER_PUBLIC_KEY,requireSignedVersion:true}}}));
          UPDATERCONFIG
            updater_args=(--config "$RUNNER_TEMP/updater-config.json")
          fi
          yarn desktop:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${updater_args[@]}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            node scripts/checks/verify-platform-bundle.mjs desktop "target/${{ matrix.target }}/release/bundle/macos/IsctCompanion.app"
          fi
          if [[ "$RUNNER_OS" == macOS && "$SIGN_MACOS" == true ]]; then
            app="target/${{ matrix.target }}/release/bundle/macos/IsctCompanion.app"
            codesign --verify --deep --strict "$app"
            for dmg in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
              report="$RUNNER_TEMP/notarization-${{ matrix.target }}.json"
              xcrun notarytool submit "$dmg" --key "$key_file" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$report"
              jq -e '.status == "Accepted"' "$report" > /dev/null
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
            done
          fi
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item "target/${{ matrix.target }}/release/bundle/nsis/*.exe") + @(Get-Item "target/${{ matrix.target }}/release/*.exe")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status)" }
            Write-Output "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
      - name: Collect only public distribution files
        run: node scripts/desktop/desktop-release.mjs collect ${{ matrix.target }}
      - name: Record Windows signing status
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ "$SIGN_WINDOWS" == true ]]; then
            echo signed > artifacts/desktop/${{ matrix.target }}/WINDOWS_SIGNING_STATUS
          else
            echo unsigned > artifacts/desktop/${{ matrix.target }}/WINDOWS_SIGNING_STATUS
          fi
      - name: Record Mac signing status
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$SIGN_MACOS" == true ]]; then
            echo signed-notarized > artifacts/desktop/${{ matrix.target }}/MACOS_SIGNING_STATUS
          else
            echo unsigned > artifacts/desktop/${{ matrix.target }}/MACOS_SIGNING_STATUS
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/desktop/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish public release
    needs: [build]
    if: >-
      always() && !cancelled() &&
      ((needs.build.result == 'success') ||
       (needs.build.result == 'skipped' && inputs.source_run_id != '')) &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      REPLACE_EXISTING: ${{ inputs.replace_existing == true }}
    steps:
      - name: Check cross-repository credentials
        run: |
          test -n "$GH_TOKEN" || { echo 'A token with release write access is required.'; exit 1; }
      - name: Verify source build
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRIVATE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid source run ID'; exit 1; }
          gh api "repos/$PRIVATE_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e '.name == "Desktop release" and .status == "completed" and .conclusion == "success"' source-run.json > /dev/null
          echo "SOURCE_SHA=$(jq -r .head_sha source-run.json)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: installers
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble public documents and installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-files release-assets
          cp installers/desktop-aarch64-apple-darwin/{README.md,LICENSE,NOTICE.md,NOTICE.ja.md} public-files/
          version=$(cat installers/desktop-aarch64-apple-darwin/VERSION)
          mac_status=$(cat installers/desktop-aarch64-apple-darwin/MACOS_SIGNING_STATUS 2>/dev/null || echo unsigned)
          intel_status=$(cat installers/desktop-x86_64-apple-darwin/MACOS_SIGNING_STATUS 2>/dev/null || echo unsigned)
          test "$mac_status" = "$intel_status"
          echo "MACOS_SIGNING_STATUS=$mac_status" >> "$GITHUB_ENV"
          windows_status=$(cat installers/desktop-x86_64-pc-windows-msvc/WINDOWS_SIGNING_STATUS 2>/dev/null || echo unsigned)
          echo "WINDOWS_SIGNING_STATUS=$windows_status" >> "$GITHUB_ENV"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            dir="installers/desktop-$target"
            test "$(cat "$dir/VERSION")" = "$version"
            diff --strip-trailing-cr public-files/LICENSE "$dir/LICENSE"
            diff --strip-trailing-cr public-files/NOTICE.md "$dir/NOTICE.md"
            diff --strip-trailing-cr public-files/NOTICE.ja.md "$dir/NOTICE.ja.md"
            if [[ "$target" == *apple* ]]; then
              cp "$dir"/*.dmg release-assets/
            else
              cp "$dir"/*.exe release-assets/
            fi
          done
          # Only publish a manifest when every desktop target has a signed update.
          signed_count=$(find installers -name '*.sig' | wc -l)
          if [[ "$signed_count" != 0 ]]; then
            test "$signed_count" = 3 || { echo 'Incomplete signed update set'; exit 1; }
            python3 - <<'PYUPDATE'
          import json, pathlib, datetime, os
          platforms = {}
          for target, platform in [('aarch64-apple-darwin','darwin-aarch64'),('x86_64-apple-darwin','darwin-x86_64'),('x86_64-pc-windows-msvc','windows-x86_64')]:
              directory = pathlib.Path('installers') / ('desktop-' + target)
              signature, = directory.glob('*.sig')
              bundle = signature.with_suffix('')
              version = (directory / 'VERSION').read_text().strip()
              import shutil
              for source in (signature, bundle):
                  shutil.copy2(source, pathlib.Path('release-assets') / source.name)
              platforms[platform] = {'signature':signature.read_text().strip(), 'url':f'https://github.com/{os.environ["GH_REPO"]}/releases/download/v{version}/{bundle.name}'}
          manifest = {'version':version, 'notes':'IsctCompanion desktop update', 'pub_date':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'platforms':platforms}
          pathlib.Path('release-assets/latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYUPDATE
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/v$version" || { echo 'Release tag must match artifact version'; exit 1; }
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Verify release destination and source tag
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO" --jq '{full_name,permissions}'
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state.txt 2>/dev/null; then
            if [[ "$(cat draft-state.txt)" != true && "$REPLACE_EXISTING" != true ]]; then
              echo 'A published release exists; explicitly enable replace_existing to refresh it.'
              exit 1
            fi
          fi
      - name: Upload complete release as a draft
        shell: bash
        run: |
          set -euo pipefail
          printf 'IsctCompanion %s desktop release for macOS 14+ (Apple Silicon / Intel) and Windows 10/11 x64.\n\n' "${RELEASE_TAG#v}" > release-notes.md
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes" ]]; then
            cat "$notes" >> release-notes.md
          fi
          printf '\nThe Android APK is attached by the Android release workflow when its build finishes. iPhone and iPad builds are distributed through TestFlight.\n\n' >> release-notes.md
          echo 'Desktop MCP uses the local HTTP server. Optional backups use your own cloud account. Intel Mac builds currently omit campus-card OCR.' >> release-notes.md
          echo 'Read the license documents bundled with the app before installing. Third-party notices are included in the app.' >> release-notes.md
          echo "Source build: https://github.com/$BUILD_REPO/commit/$SOURCE_SHA" >> release-notes.md
          if [[ "$MACOS_SIGNING_STATUS" == signed-notarized ]]; then
            echo 'Mac installers are signed with Developer ID and notarized by Apple.' >> release-notes.md
          else
            echo 'Mac installers are unsigned and not notarized. macOS security prompts may appear.' >> release-notes.md
          fi
          if [[ "$WINDOWS_SIGNING_STATUS" == signed ]]; then
            echo 'The Windows installer is signed with Azure Artifact Signing.' >> release-notes.md
          else
            echo 'The Windows installer is unsigned. Smart App Control may block it, and Controlled folder access may block saving course files to Documents.' >> release-notes.md
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--prerelease=false --latest=true)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state.txt 2>/dev/null; then
            [[ "$(cat draft-state.txt)" == true || "$REPLACE_EXISTING" == true ]] || { echo 'A published release exists; enable replace_existing or use a new version.'; exit 1; }
          else
            # An existing tag needs no target_commitish; older workflow commits
            # without a branch ref otherwise require workflows:write permission.
            tag_args=(--verify-tag)
            if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
              tag_args=(--target "$SOURCE_SHA")
            fi
            gh release create "$RELEASE_TAG" "${tag_args[@]}" --title "IsctCompanion $RELEASE_TAG" --notes-file release-notes.md --draft "${release_flags[0]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
