name: iOS release

# Archives the iPhone/iPad app for a version tag and uploads it to TestFlight.
# Uploading is opt-in: set the repository variable IOS_TESTFLIGHT_ENABLED to
# true once the secrets in docs/mobile-release.md are in place. Until then the
# job only checks that the app compiles for a device.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Build and upload IPA
    runs-on: macos-15
    timeout-minutes: 120
    env:
      UPLOAD: ${{ vars.IOS_TESTFLIGHT_ENABLED == 'true' }}
      TEAM_ID: FB7AL944GK
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ios-release
      - name: Use the newest Xcode
        run: |
          # The app adopts iOS 26 APIs behind availability checks, so it needs
          # the iOS 26 SDK.
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Install and validate existing iOS signing materials
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$APPLE_API_KEY_ID".p8
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PYTHON'
          import datetime, hashlib, os, pathlib, plistlib
          profile = plistlib.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "profile.plist").read_bytes())
          entitlements = profile["Entitlements"]
          team = os.environ["TEAM_ID"]
          if profile["TeamIdentifier"] != [team] or entitlements["application-identifier"] != f"{team}.app.isctcompanion":
              raise SystemExit("Provisioning profile must belong to the app and release team")
          if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit("Provisioning profile has expired")
          if not entitlements.get("beta-reports-active") or entitlements.get("get-task-allow") or profile.get("ProvisionedDevices") or profile.get("ProvisionsAllDevices"):
              raise SystemExit("Use an App Store distribution profile for TestFlight")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print(f"PROFILE_UUID={profile['UUID']}", file=output)
              print("PROFILE_CERTIFICATES=" + " ".join(hashlib.sha1(cert).hexdigest().upper() for cert in profile["DeveloperCertificates"]), file=output)
          PYTHON
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"
      - name: Select the distribution identity and install the profile
        if: env.UPLOAD == 'true'
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | awk '/"Apple Distribution:/ {print $2; exit}')
          test -n "$identity" || { echo 'No valid Apple Distribution identity in IOS_CERTIFICATE'; exit 1; }
          [[ " $PROFILE_CERTIFICATES " == *" $identity "* ]] || { echo 'IOS_CERTIFICATE does not match IOS_MOBILE_PROVISION'; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Xcode 16+ uses UserData; retain the legacy path for older Xcode tools.
          for directory in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$directory"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$directory/$PROFILE_UUID.mobileprovision"
          done
      - name: Build the Core XCFramework (release profile)
        run: node scripts/bindings/build-ios.mjs
      - name: Read the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/v$version" || { echo 'Tag must match package.json version'; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # App Store Connect needs a build number that only grows.
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          if [[ "$UPLOAD" == 'true' ]]; then
            # Profile settings belong only to the app, never Swift package resource bundles.
            ruby -ryaml -rjson -e '
              spec = YAML.load_file("project.yml")
              settings = spec.fetch("targets").fetch("IsctCompanion").fetch("settings").fetch("base")
              settings.merge!("DEVELOPMENT_TEAM" => ENV.fetch("TEAM_ID"),
                "CODE_SIGN_STYLE" => "Manual", "CODE_SIGN_IDENTITY" => ENV.fetch("SIGNING_IDENTITY"),
                "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("PROFILE_UUID"))
              File.write("project-ci.json", JSON.pretty_generate(spec))
            '
            xcodegen generate --spec project-ci.json
          else
            xcodegen generate
          fi
      - name: Check that the app compiles for a device
        if: env.UPLOAD != 'true'
        working-directory: apps/ios
        run: |
          xcodebuild -project IsctCompanion.xcodeproj -scheme IsctCompanion -configuration Release \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build
      - name: Archive and export the IPA
        if: env.UPLOAD == 'true'
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -project IsctCompanion.xcodeproj -scheme IsctCompanion -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/IsctCompanion.xcarchive" \
            archive \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key><dict>
              <key>app.isctcompanion</key><string>$PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/IsctCompanion.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          mv "$RUNNER_TEMP"/ipa/*.ipa "$RUNNER_TEMP/ipa/IsctCompanion_${VERSION}_${BUILD_NUMBER}.ipa"
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD == 'true'
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/ipa/*.ipa \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - name: Remove signing materials
        if: ${{ always() && env.UPLOAD == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
