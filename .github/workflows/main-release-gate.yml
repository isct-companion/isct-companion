name: Main release gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: main-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    if: github.event.action != 'closed'
    name: Main release gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the disposable dev branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_REF" != "main" || "$HEAD_REF" != "dev" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "Only the repository's dev branch may be released into main." >&2
            exit 1
          fi

      - name: Require successful full-platform CI for this exact dev commit
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.HEAD_SHA;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'platform-checks.yml',
              branch: 'dev',
              event: 'push',
              head_sha: headSha,
              per_page: 100,
            });

            const run = data.workflow_runs.find((candidate) =>
              candidate.head_branch === 'dev' &&
              candidate.head_sha === headSha &&
              candidate.event === 'push' &&
              candidate.conclusion === 'success'
            );

            if (!run) {
              core.setFailed(
                `Platform checks have not passed for dev commit ${headSha}. ` +
                'Push the final candidate to dev and wait for the full workflow to succeed.'
              );
              return;
            }

            core.info(`Using successful Platform checks run ${run.html_url}`);

      - name: Check the release diff for whitespace errors
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  delete-dev:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Delete released dev branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete dev after its release is merged
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/dev' });
              core.info('Deleted the released dev branch.');
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.warning(`dev was already absent or could not be deleted: ${error.message}`);
                return;
              }
              throw error;
            }
