name: Native Core SDK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ios:
        required: true
        type: boolean
      android:
        required: true
        type: boolean

permissions:
  contents: read

env:
  ISCT_SDK_PROFILE: dev

jobs:
  ios:
    name: Swift SDK and iOS Simulator
    # A direct dispatch runs both platforms. The caller also dispatches both.
    if: github.event_name == 'workflow_dispatch' || inputs.ios
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-sdk-ios
          # Platform checks warms the shared caches on main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install host Kotlin compiler
        run: |
          if ! command -v kotlinc >/dev/null; then brew install kotlin; fi
      - name: Rust contracts and lint
        run: |
          cargo test -p app-core -p app-ffi --locked -j 2
          cargo test -p app-ffi --features ocr --locked -j 2
          # The map's geometry tests; its rules over the published export run
          # in campus-map.yml.
          cargo test -p app-core --features campus-map --locked -j 2 campus_map
          # The campus map is compiled into the phone SDKs only; its lint runs
          # with the feature. Its data is checked in the map's own repository.
          cargo clippy -p app-core -p app-ffi --all-targets --locked -j 2 -- -D warnings
          cargo clippy -p app-core -p app-ffi --features campus-map --all-targets --locked -j 2 -- -D warnings
      - name: Swift 6 and Kotlin host clients with OCR
        run: node scripts/bindings/host-smoke.mjs --ocr
      - name: Build device and simulator XCFramework
        run: node scripts/bindings/build-ios.mjs
      - name: Run real SDK and OCR on iOS Simulator
        run: node scripts/bindings/ios-smoke.mjs
      # The same check as iOS release, which otherwise first compiles the app
      # on a version tag. Last, as the smoke run uses the runner's default Xcode.
      - name: Compile the app against this SDK
        working-directory: apps/ios
        run: |
          # The app adopts iOS 26 APIs behind availability checks, so it needs
          # the iOS 26 SDK.
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -project IsctCompanion.xcodeproj -scheme IsctCompanion -configuration Debug \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: app-core-swift-sdk-dev-ci
          path: bindings/swift/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android AAR and emulator
    if: github.event_name == 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: ./.github/actions/android-build-tools
        with:
          emulator: 'true'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-sdk-android
          # Platform checks warms the shared caches on main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JavaScript build dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build AAR and both native ABIs
        # x86_64 only so the SDK can load on the runner's emulator; the app
        # packages arm64 alone.
        run: node scripts/bindings/build-android.mjs --with-emulator
      # Android release otherwise first compiles the app on a version tag, which
      # is where the Kotlin errors of 1.1.9 and 1.3.0 surfaced.
      - name: Compile the app against this AAR
        working-directory: apps/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load AAR on Android ART
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        timeout-minutes: 12
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: node scripts/bindings/android-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: app-core-android-sdk-dev-ci
          path: bindings/kotlin/
          if-no-files-found: error
          retention-days: 7
