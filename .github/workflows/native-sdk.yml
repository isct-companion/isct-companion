name: Native Core SDK

on:
  workflow_dispatch:
  push:
    branches: [refactor/rust-core]
    paths:
      - crates/isct-core/**
      - crates/isct-ffi/**
      - crates/isct-ocr/**
      - bindings/**
      - scripts/bindings/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native-sdk.yml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - bindings/**
      - scripts/bindings/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native-sdk.yml

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  ISCT_SDK_PROFILE: dev

jobs:
  ios:
    name: Swift SDK and iOS Simulator
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-sdk-ios
      - name: Install host Kotlin compiler
        run: |
          if ! command -v kotlinc >/dev/null; then brew install kotlin; fi
      - name: Rust contracts and lint
        run: |
          cargo test -p isct-core -p isct-ffi --locked -j 2
          cargo clippy -p isct-core -p isct-ffi --all-targets --locked -j 2 -- -D warnings
      - name: Swift 6 and Kotlin host clients with OCR
        run: node scripts/bindings/host-smoke.mjs --ocr
      - name: Build device and simulator XCFramework
        run: node scripts/bindings/build-ios.mjs
      - name: Run real SDK and OCR on iOS Simulator
        run: node scripts/bindings/ios-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: isct-core-swift-sdk
          path: bindings/swift/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android AAR and emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NDK_VERSION: 28.2.13676358
      ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK and host Kotlin compiler
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-34" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$NDK_VERSION" "system-images;android-34;google_apis;x86_64"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          if ! command -v kotlinc >/dev/null; then
            curl -fL https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip -o "$RUNNER_TEMP/kotlin.zip"
            unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
            echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          fi
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-sdk-android
      - name: Build AAR and both native ABIs
        run: node scripts/bindings/build-android.mjs
      - name: Boot Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo no | avdmanager create avd --name isct-sdk --package "system-images;android-34;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd isct-sdk -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
      - name: Load AAR on Android ART
        run: node scripts/bindings/android-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: isct-core-android-sdk
          path: bindings/kotlin/
          if-no-files-found: error
          retention-days: 7
