name: Platform checks

on:
  workflow_dispatch:
  # Every push to a working branch gets the full suite. A merge into main does
  # not: the branch had to be up to date and pass, so main holds a tree that
  # already passed.
  push:
    branches-ignore: [main]
  # A fork's pushes happen outside this repository, so only this trigger sees
  # them. The pull request's run is the one main requires.
  pull_request:
    branches: [main]
  # Branches can read only their own caches and the default branch's, and one
  # set nearly fills the repository's 10 GB, so only main saves them. This run
  # exists to save them: it gates nothing, and a failure needs no fix on main.
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 in Japan

permissions:
  contents: read

# A newer commit supersedes the run still in progress.
concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      # A push to a branch with an open pull request also starts that pull
      # request's run, so the suite would run twice for every fix.
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [[ "$EVENT" == push ]]; then
            open=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)
            [[ "$open" == 0 ]] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  app-store-tools:
    name: App Store tooling
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: scripts/app-store
      - name: Load the release lane without App Store credentials
        working-directory: scripts/app-store
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane lanes

  frontend:
    name: Frontend
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The manual-acceptance table test dates each check against git
          # history; a shallow clone marks verified checks as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - name: Set up Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: yarn test:types

  windows:
    name: Windows backend
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The same lint as the Mac job: each OS compiles code the other never sees.
      - name: Desktop lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # GitHub's Windows Server image cannot start the Tauri GUI test host
      # (STATUS_ENTRYPOINT_NOT_FOUND), so the shell's tests only compile and link.
      - run: cargo test -p isct-companion --locked --no-run
      # Everything else runs: Unix accepts what Windows refuses, so a compile
      # alone misses it (1.3.0 could not open its data folder on Windows). The
      # features are the shell's, which leaving it out would otherwise turn off.
      # app-ffi only serves the phones; Native Core SDK runs its tests.
      - name: Core and adapter tests
        run: >-
          cargo test --workspace --exclude isct-companion --exclude app-ffi --locked --no-fail-fast
          --features app-core/ts,app-core/workspace-archives,app-core/agent,app-core/campus-printer

  apple:
    name: Apple Rust (${{ matrix.target }})
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check desktop shell or portable Core
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == *ios* ]]; then
            cargo check -p app-core --locked --target ${{ matrix.target }}
          else
            cargo check -p isct-companion --locked --target ${{ matrix.target }}
          fi
      - name: Desktop Rust contracts
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked
      - name: OCR disabled-backend contracts
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p app-ocr --no-default-features --locked
      - name: Desktop lint
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  android:
    name: Android Core (arm64)
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: aarch64-linux-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Configure Android toolchain
        run: |
          toolchain="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/bin/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/bin/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check -p app-core --locked --target aarch64-linux-android

  # The one check main's ruleset requires. Only a pull request's run reports
  # under that name: GitHub counts a skipped job as passed, so a skipped branch
  # push must not be able to satisfy it.
  result:
    name: ${{ github.event_name == 'pull_request' && 'Platform checks' || 'Platform checks (branch)' }}
    if: always()
    needs: [route, app-store-tools, frontend, windows, apple, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ROUTE: ${{ needs.route.result }}
          RUN: ${{ needs.route.outputs.run }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ "$ROUTE" == success && "$RUN" == false ]]; then
            echo "The open pull request's run covers this commit."
            exit 0
          fi
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "Job results: $RESULTS" >&2
              exit 1
            fi
          done
