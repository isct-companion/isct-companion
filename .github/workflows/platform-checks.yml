name: Platform checks

on:
  workflow_dispatch:
  # Merges to main are not rechecked here: the PR already ran these checks and
  # the Desktop release workflow verifies and rebuilds every platform on version tags.
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the run still in progress.
concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-store-tools:
    name: App Store tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: scripts/app-store
      - name: Load the release lane without App Store credentials
        working-directory: scripts/app-store
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane lanes

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The manual-acceptance table test dates each check against git
          # history; a shallow clone marks verified checks as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - name: Set up Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: yarn test:types

  windows:
    name: Windows backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # GitHub's Windows Server image cannot start the Tauri GUI test host
      # (STATUS_ENTRYPOINT_NOT_FOUND), but this still compiles and links every
      # unit and integration test target for Windows.
      - run: cargo test --workspace --locked --no-run

  apple:
    name: Apple Rust (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
      - name: Check desktop shell or portable Core
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == *ios* ]]; then
            cargo check -p app-core --locked --target ${{ matrix.target }}
          else
            cargo check -p isct-companion --locked --target ${{ matrix.target }}
          fi
      - name: Desktop Rust contracts
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked
      - name: OCR disabled-backend contracts
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p app-ocr --no-default-features --locked
      - name: Desktop lint
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  android:
    name: Android Core (arm64)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: aarch64-linux-android
      - name: Configure Android toolchain
        run: |
          toolchain="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/bin/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/bin/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check -p app-core --locked --target aarch64-linux-android
