name: Platform checks

on:
  workflow_dispatch:
  # Work branches and PRs check changed areas. Main warms caches weekly.
  push:
    branches-ignore: [main]
  # A fork's pushes happen outside this repository, so only this trigger sees
  # them. The pull request's run is the one main requires.
  pull_request:
    branches: [main]
  # Branches can read only their own caches and the default branch's, and one
  # set nearly fills the repository's 10 GB, so only main saves them. This run
  # exists to save them: it gates nothing, and a failure needs no fix on main.
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 in Japan

permissions:
  contents: read

# A newer commit supersedes the run still in progress.
concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.route.outputs.frontend }}
      apple: ${{ steps.route.outputs.apple }}
      windows: ${{ steps.route.outputs.windows }}
      ios: ${{ steps.route.outputs.ios }}
      android: ${{ steps.route.outputs.android }}
      campus-map: ${{ steps.route.outputs.campus-map }}
      app-store-tools: ${{ steps.route.outputs.app-store-tools }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          sparse-checkout: scripts/checks
          persist-credentials: false
      - id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          route=scripts/checks/route-platform-checks.sh
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Jobs build this same merge commit. Its first parent is the base.
              range=(HEAD^1 HEAD)
              ;;
            push)
              open=$(gh api "repos/$GH_REPO/pulls" --method GET -f head="$OWNER:$BRANCH" -f base=main -f state=open --jq length)
              if [[ "$open" != 0 ]]; then
                echo "The open pull request's run covers this commit."
                bash "$route" </dev/null | tee -a "$GITHUB_OUTPUT"
                exit 0
              fi
              range=(origin/main...HEAD)
              ;;
            *)
              bash "$route" --all | tee -a "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          paths="$RUNNER_TEMP/ci-changes"
          if git diff --name-only --no-renames -z "${range[@]}" > "$paths"; then
            bash "$route" < "$paths" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Could not compare changes. Running all checks."
            bash "$route" --all | tee -a "$GITHUB_OUTPUT"
          fi

  app-store-tools:
    name: App Store tooling
    needs: route
    if: needs.route.outputs.app-store-tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: scripts/app-store
      - name: Load the release lane without App Store credentials
        working-directory: scripts/app-store
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane lanes

  frontend:
    name: Frontend
    needs: route
    if: needs.route.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The manual-acceptance table test dates each check against git
          # history; a shallow clone marks verified checks as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - name: Set up Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: yarn test:types

  windows:
    name: Windows backend
    needs: route
    if: needs.route.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The same lint as the Mac job: each OS compiles code the other never sees.
      - name: Desktop lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # GitHub's Windows Server image cannot start the Tauri GUI test host
      # (STATUS_ENTRYPOINT_NOT_FOUND), so the shell's tests only compile and link.
      - run: cargo test -p isct-companion --locked --no-run
      # Everything else runs: Unix accepts what Windows refuses, so a compile
      # alone misses it (1.3.0 could not open its data folder on Windows). The
      # features are the shell's, which leaving it out would otherwise turn off.
      # app-ffi only serves the phones; Native Core SDK runs its tests.
      - name: Core and adapter tests
        run: >-
          cargo test --workspace --exclude isct-companion --exclude app-ffi --locked --no-fail-fast
          --features app-core/ts,app-core/workspace-archives,app-core/agent,app-core/campus-printer

  apple:
    name: macOS Rust (${{ matrix.target }})
    needs: route
    if: needs.route.outputs.apple == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo check -p isct-companion --locked --target ${{ matrix.target }}
      - name: Desktop Rust contracts
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked
      - name: OCR disabled-backend contracts
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p app-ocr --no-default-features --locked
      - name: Desktop lint
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native-sdk:
    name: Native Core SDK
    needs: route
    if: needs.route.outputs.ios == 'true' || needs.route.outputs.android == 'true'
    uses: ./.github/workflows/native-sdk.yml
    with:
      ios: ${{ needs.route.outputs.ios == 'true' }}
      android: ${{ needs.route.outputs.android == 'true' }}

  campus-map:
    needs: route
    if: needs.route.outputs.campus-map == 'true'
    uses: ./.github/workflows/campus-map.yml

  # Match the branch ruleset's check name only for PRs.
  result:
    name: ${{ github.event_name == 'pull_request' && 'Platform checks' || 'Platform checks (branch)' }}
    if: always()
    needs: [route, app-store-tools, frontend, windows, apple, native-sdk, campus-map]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .route as $route |
            $route.result == "success" and
            (del(.route) | to_entries | all(
              . as $job |
              (if $job.key == "native-sdk" then
                [$route.outputs.ios, $route.outputs.android]
              else
                [$route.outputs[$job.key]]
              end) as $selected |
              ($selected | all(. == "true" or . == "false")) and
              $job.value.result == (if $selected | any(. == "true") then "success" else "skipped" end)
            ))
          ' <<< "$CHECKS" || {
            jq 'map_values(.result)' <<< "$CHECKS" >&2
            exit 1
          }
