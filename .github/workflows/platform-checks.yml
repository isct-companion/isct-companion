name: Platform checks

on:
  # Warm caches dispatches both suites on main, the only branch that saves
  # caches.
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  # Work branches and PRs run the quick checks.
  push:
    branches-ignore: [main]
  # A fork's pushes happen outside this repository, so only this trigger sees
  # them. The pull request's run is the one main requires.
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

# A newer commit supersedes the run still in progress.
concurrency:
  group: platform-checks-${{ inputs.full && 'full' || 'quick' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # One output per job below; the route script folds in the suite mode, so
    # each job and the result gate read only these.
    outputs:
      frontend: ${{ steps.route.outputs.frontend }}
      apple: ${{ steps.route.outputs.apple }}
      windows: ${{ steps.route.outputs.windows }}
      app-store-tools: ${{ steps.route.outputs.app-store-tools }}
      rust: ${{ steps.route.outputs.rust }}
      ios-syntax: ${{ steps.route.outputs.ios-syntax }}
      android-config: ${{ steps.route.outputs.android-config }}
      native-sdk: ${{ steps.route.outputs.native-sdk }}
      native-ios: ${{ steps.route.outputs.native-ios }}
      native-android: ${{ steps.route.outputs.native-android }}
      campus-map: ${{ steps.route.outputs.campus-map }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          sparse-checkout: |
            scripts/checks
            scripts/release
          persist-credentials: false
      - id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full }}
        run: |
          route=scripts/checks/route-platform-checks.sh
          mode=()
          if [[ "$FULL" == true ]]; then mode=(--full); fi
          for branch in "$BRANCH" "$PR_HEAD" "$PR_BASE"; do
            if [[ "$branch" == release/* ]]; then
              bash scripts/release/verify-candidate.sh version "$branch"
            fi
          done
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [[ "$PR_BASE" == main && "$PR_HEAD" == release/* ]]; then
                test "$PR_HEAD_REPO" = "$GH_REPO" || { echo "Open release PRs from this repository." >&2; exit 1; }
                bash scripts/release/verify-candidate.sh candidate "$PR_HEAD" "$PR_HEAD_SHA" "$GITHUB_SHA"
              fi
              # Jobs build this same merge commit. Its first parent is the base.
              range=(HEAD^1 HEAD)
              ;;
            push)
              open=$(gh api "repos/$GH_REPO/pulls" --method GET -f head="$OWNER:$BRANCH" -f state=open \
                --jq '[.[] | select(.base.ref == "main" or (.base.ref | startswith("release/")))] | length')
              if [[ "$open" != 0 ]]; then
                echo "The open pull request's run covers this commit."
                bash "$route" "${mode[@]}" </dev/null | tee -a "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$BRANCH" == release/* ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range=("$BEFORE" HEAD)
              else
                range=(origin/main...HEAD)
              fi
              ;;
            *)
              bash "$route" "${mode[@]}" --all | tee -a "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          paths="$RUNNER_TEMP/ci-changes"
          if git diff --name-only --no-renames -z "${range[@]}" > "$paths"; then
            bash "$route" "${mode[@]}" < "$paths" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Could not compare changes. Running all checks."
            bash "$route" "${mode[@]}" --all | tee -a "$GITHUB_OUTPUT"
          fi

  app-store-tools:
    name: App Store tooling
    needs: route
    if: needs.route.outputs.app-store-tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: scripts/app-store
      - name: Load the release lane without App Store credentials
        working-directory: scripts/app-store
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane lanes

  frontend:
    name: Frontend
    needs: route
    if: needs.route.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The manual-acceptance table test dates each check against git
          # history; a shallow clone marks verified checks as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - name: Set up Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: yarn test:types

  windows:
    name: Windows backend
    needs: route
    if: needs.route.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      # The release suite lints and tests instead of checking: its own key.
      - uses: ./.github/actions/rust-caches
        with:
          key: ${{ inputs.full && 'full' || '' }}
          cache-on-failure: true
          compiler-cache: true
      # The same lint as the Mac job: each OS compiles code the other never sees.
      - name: Check desktop
        if: '!inputs.full'
        run: cargo check -p isct-companion --locked
      - name: Desktop lint
        if: inputs.full
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # GitHub's Windows Server image cannot start the Tauri GUI test host
      # (STATUS_ENTRYPOINT_NOT_FOUND), so the shell's tests only compile and link.
      - if: inputs.full
        run: cargo test -p isct-companion --locked --no-run
      # Everything else runs: Unix accepts what Windows refuses, so a compile
      # alone misses it (1.3.0 could not open its data folder on Windows). The
      # features are the shell's, which leaving it out would otherwise turn off.
      # app-ffi only serves the phones; Native Core SDK runs its tests.
      - name: Core and adapter tests
        if: inputs.full
        run: >-
          cargo test --workspace --exclude isct-companion --exclude app-ffi --locked --no-fail-fast
          --features app-core/ts,app-core/workspace-archives,app-core/agent,app-core/campus-printer

  apple:
    name: macOS Rust (${{ matrix.target }})
    needs: route
    if: needs.route.outputs.apple == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.full && '["aarch64-apple-darwin","x86_64-apple-darwin"]' || '["aarch64-apple-darwin"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-caches
        with:
          key: ${{ matrix.target }}${{ inputs.full && '-full' || '' }}
          cache-on-failure: true
          compiler-cache: true
      - run: cargo check -p isct-companion --locked --target ${{ matrix.target }}
      - name: Desktop Rust contracts
        if: inputs.full && matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked
      - name: OCR disabled-backend contracts
        if: inputs.full && matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo test -p app-ocr --no-default-features --locked
          cargo test -p app-ocr-adapter --no-default-features --locked
      - name: Desktop lint
        if: inputs.full && matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust:
    name: Portable Rust and FFI
    needs: route
    if: needs.route.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/rust-caches
      - run: cargo check -p app-ffi --features campus-map --locked

  ios-syntax:
    name: Swift syntax
    needs: route
    if: needs.route.outputs.ios-syntax == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Parse Swift sources
        run: git ls-files -z -- 'apps/ios/*.swift' 'apps/apple-widgets/*.swift' | xargs -0 swiftc -frontend -parse

  android-config:
    name: Android Gradle configuration
    needs: route
    if: needs.route.outputs.android-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew :app:help --no-daemon
        working-directory: apps/android

  native-sdk:
    name: Native Core SDK
    needs: route
    if: needs.route.outputs.native-sdk == 'true'
    uses: ./.github/workflows/native-sdk.yml
    with:
      ios: ${{ needs.route.outputs.native-ios == 'true' }}
      android: ${{ needs.route.outputs.native-android == 'true' }}

  campus-map:
    needs: route
    if: needs.route.outputs.campus-map == 'true'
    uses: ./.github/workflows/campus-map.yml

  # Match the branch ruleset's check name only for PRs.
  result:
    name: ${{ github.event_name == 'pull_request' && 'Platform checks' || 'Platform checks (branch)' }}
    if: always()
    needs: [route, app-store-tools, frontend, windows, apple, rust, ios-syntax, android-config, native-sdk, campus-map]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ toJSON(needs) }}
        run: |
          # Route names every job: a selected job must succeed and any other
          # must skip. A job route does not name fails the gate.
          jq -e '
            .route as $route |
            $route.result == "success" and
            (del(.route) | to_entries | all(
              . as $job | $route.outputs[$job.key] as $selected |
              ($selected == "true" or $selected == "false") and
              $job.value.result == (if $selected == "true" then "success" else "skipped" end)
            ))
          ' <<< "$CHECKS" || {
            jq 'map_values(.result)' <<< "$CHECKS" >&2
            exit 1
          }
