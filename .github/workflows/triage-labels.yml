name: Triage labels

on:
  # pull_request_target gives a fork's pull request a token that can write
  # labels. The PR job reads rules from the trusted base and never checks out
  # or runs the pull request's code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/triage-labels.yml]
  workflow_dispatch:

permissions: {}

jobs:
  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0

  sync-catalog:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: triage-label-catalog
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: EndBug/label-sync@2f0dca846207aa9095344c7aa7d3574d81ab0833 # Node.js 24
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
