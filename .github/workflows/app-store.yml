name: App Store release

on:
  workflow_run:
    workflows: ["iOS release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version already uploaded to TestFlight (for example 1.2.1)
        type: string
        required: true
      mode:
        description: Inspect status, prepare screenshots/build, or submit for review
        type: choice
        options: [inspect, prepare, submit]
        default: inspect
      build_number:
        description: Optional exact build number (otherwise newest valid build of this version)
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  app-store:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.IOS_APP_STORE_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
      CI: 'true'
    steps:
      # Always run the trusted default-branch release tooling. Only the version
      # comes from the completed tag build; no artifact can supply executable code.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Resolve version and verify publish eligibility
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IOS_RUN_ID: ${{ github.event.workflow_run.id }}
          IOS_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode || 'submit' }}
        shell: bash
        run: |
          version="$REQUESTED_VERSION"
          if [[ -n "$IOS_RUN_ID" ]]; then
            jobs=$(gh api "repos/$GH_REPO/actions/runs/$IOS_RUN_ID/jobs")
            if ! jq -e '.jobs | any(.name == "Upload IPA to TestFlight" and .conclusion == "success")' <<< "$jobs" >/dev/null; then
              echo "The iOS run did not upload a build to TestFlight."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$(gh api "repos/$GH_REPO/contents/package.json?ref=$IOS_RUN_SHA" \
              -H 'Accept: application/vnd.github.raw+json' | jq -er .version)
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable release version'; exit 1; }
          if [[ "$MODE" == submit ]]; then
            tag="v$version"
            sha="${IOS_RUN_SHA:-$(bash scripts/release/verify-candidate.sh tag-commit "$tag")}"
            bash scripts/release/verify-candidate.sh tag "$tag" "$sha"
          fi
          echo "APP_STORE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: scripts/app-store
      - name: Prepare or submit the existing build
        if: steps.gate.outputs.skip != 'true'
        working-directory: scripts/app-store
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APP_STORE_MODE: ${{ inputs.mode || 'submit' }}
          APP_STORE_BUILD: ${{ inputs.build_number }}
          APP_STORE_REPORT: ${{ runner.temp }}/app-store-status.json
        run: bundle exec fastlane ios release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-store-status
          path: ${{ runner.temp }}/app-store-status.json
          if-no-files-found: ignore
          retention-days: 14
