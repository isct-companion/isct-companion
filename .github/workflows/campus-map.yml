name: Campus map rules

# The map page's rules (focus, taps, search, selection) checked against the
# published export, by fixed real places. They need the file, which this
# repository does not hold (they compile only when ISCT_CAMPUS_MAP_EXPORT names
# it), so they run only when the map's code changes, against one pinned export
# (slotledger `approach/campus-map-tests`).
on:
  workflow_call:

permissions:
  contents: read

env:
  # The host the app downloads the map from, at one commit: the bytes never
  # change, and the hash proves it. Move both together, on purpose.
  EXPORT_URL: https://raw.githubusercontent.com/isct-companion/Isct-Data/41be452f36121344f5b9c001d51d469c88bce935/campus-map/v2/campus-map.json.gz
  EXPORT_SHA256: 568dc5445e5ce191445c8455e0b2923c9f2210f4a5912252590650eb43fb3a86

jobs:
  rules:
    name: Map rules over the pinned export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/rust-caches
        with:
          key: campus-map
      - name: Download the pinned export
        run: |
          curl -fsSL --retry 3 --retry-all-errors "$EXPORT_URL" -o "$RUNNER_TEMP/campus-map.json.gz"
          echo "$EXPORT_SHA256  $RUNNER_TEMP/campus-map.json.gz" | sha256sum -c -
      - name: Run the rules
        env:
          ISCT_CAMPUS_MAP_EXPORT: ${{ runner.temp }}/campus-map.json.gz
        run: cargo test -p app-core --features campus-map --locked campus_map
