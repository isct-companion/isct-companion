name: Warm caches

# A quick Platform checks run on main saves caches that work branches can read.
# Warm again when Rust build inputs change, and weekly before unused caches expire.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/platform-checks.yml
      - .github/actions/rust-compiler-cache/**
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 in Japan

permissions:
  contents: read

jobs:
  warm:
    name: Run Platform checks on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run platform-checks.yml --ref main
