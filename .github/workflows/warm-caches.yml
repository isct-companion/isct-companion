name: Warm caches

# Only main saves caches (see the rust-caches action). The quick suite's caches
# serve every work branch and PR, so main warms them again whenever Rust build
# inputs change. The release suite's caches serve Release checks; they warm
# weekly, and a release in between restores the closest older entry. The weekly
# run also keeps both sets from expiring after 7 days unused.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/platform-checks.yml
      - .github/actions/rust-caches/**
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 in Japan

permissions:
  contents: read

jobs:
  warm:
    name: Run Platform checks on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Quick suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run platform-checks.yml --ref main
      - name: Release suite
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run platform-checks.yml --ref main -f full=true
