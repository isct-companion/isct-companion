name: Warm caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - .cargo/**
      - yarn.lock
      - .yarnrc.yml
      - package.json
      - apps/desktop/package.json
      - apps/android/**/*.gradle*
      - apps/android/gradle.properties
      - apps/android/gradle/**
      - apps/android/gradlew*
      - .github/actions/android-build-tools/**
      - .github/workflows/platform-checks.yml
      - .github/workflows/native-sdk.yml
      - .github/workflows/warm-caches.yml
      - .github/actions/rust-caches/**
      - scripts/checks/route-platform-checks.sh
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 in Japan

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  quick:
    name: Warm quick caches
    uses: ./.github/workflows/platform-checks.yml
    with:
      warm: true

  release:
    name: Warm release caches
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/platform-checks.yml
    with:
      full: true

  # Unused dependencies, weekly only: cargo-udeps needs nightly and a full
  # build of its own, too slow for every change. macOS, since the desktop
  # crate does not build on Linux.
  udeps:
    name: Unused dependencies
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --locked
