name: Android release

# Builds the Android APK for a version tag and attaches it to the GitHub
# release the Desktop release workflow opens as a draft for the same tag. Signing
# secrets are optional: without them the APK is debug-signed (installable,
# but each CI run signs with a different key, so it cannot update an earlier
# install). See docs/mobile-release.md for the secrets.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the APK to this version's draft or published release (e.g. v1.1.9); blank builds only
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.build.outputs.signed }}
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: ./.github/actions/android-build-tools
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: android-release
      - name: Install JavaScript build dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build the Core AAR (release profile)
        # The floor photo upload key, compiled into Core masked
        # (crates/app-core/src/campus_map/photos.rs). Unset, the build offers
        # no upload.
        env:
          ISCT_FLOOR_PHOTO_KEY: ${{ secrets.ISCT_FLOOR_PHOTO_KEY }}
          ISCT_FLOOR_PHOTO_KID: ${{ vars.ISCT_FLOOR_PHOTO_KID }}
        run: node scripts/bindings/build-android.mjs
      - name: Read the version
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF#refs/tags/}}"
          if [[ "$GITHUB_REF" == refs/tags/* || -n "$RELEASE_TAG_INPUT" ]]; then
            test "$tag" = "v$version" || { echo 'Tag must match package.json version'; exit 1; }
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          # versionCode must grow with every release: 1.1.8 → 10108.
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Decode the release keystore
        if: env.SIGNED == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        id: build
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          task=assembleDebug
          if [[ "$SIGNED" == true ]]; then task=assembleRelease; fi
          ./gradlew ":app:$task" --no-daemon -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
          mkdir -p "$RUNNER_TEMP/apk"
          if [[ "$SIGNED" == true ]]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/IsctCompanion_${VERSION}_android.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/IsctCompanion_${VERSION}_android-debug.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 14
      # R8's mapping for this signed build, to deobfuscate its crash stacks
      # (`retrace mapping.txt stack.txt`). Run artifacts expire and are pruned,
      # so a tagged build also attaches it to its GitHub release below.
      - uses: actions/upload-artifact@v7
        if: env.SIGNED == 'true'
        with:
          name: android-r8-mapping-${{ env.VERSION }}
          path: apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach APK to GitHub release
    needs: apk
    if: needs.apk.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk
      - uses: actions/download-artifact@v8
        if: needs.apk.outputs.signed == 'true'
        with:
          name: android-r8-mapping-${{ needs.apk.outputs.version }}
          path: ${{ runner.temp }}/mapping
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.apk.outputs.tag }}
          VERSION: ${{ needs.apk.outputs.version }}
          SIGNED: ${{ needs.apk.outputs.signed }}
        run: |
          assets=("$RUNNER_TEMP"/apk/*.apk)
          if [[ "$SIGNED" == true ]]; then
            mapping="$RUNNER_TEMP/IsctCompanion_${VERSION}_android-r8-mapping.txt"
            cp "$RUNNER_TEMP/mapping/mapping.txt" "$mapping"
            assets+=("$mapping")
          fi
          bash scripts/release/attach-mobile-assets.sh "$RELEASE_TAG" "${assets[@]}"
