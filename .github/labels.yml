# Kinds
- name: bug
  color: "d73a4a"
  description: Something does not work as expected
- name: enhancement
  color: "a2eeef"
  description: A new feature or improvement
- name: documentation
  color: "0075ca"
  description: Documentation work
- name: dependencies
  color: "0366d6"
  description: Dependency updates
- name: kind:refactor
  color: "bfdadc"
  description: Internal restructuring for existing behaviour
- name: kind:tests
  color: "bfdadc"
  description: Changes limited to tests or their fixtures
- name: kind:release
  color: "bfdadc"
  description: A release or release promotion PR

# Impact
- name: regression
  color: "e99695"
  description: Previously working behaviour broke after an identifiable change or release
- name: crash
  color: "e99695"
  description: The app exits unexpectedly
- name: data-loss
  color: "e99695"
  description: User data is lost, overwritten or becomes inaccessible
- name: performance
  color: "e99695"
  description: Slow, stalled or resource-heavy behaviour or work to improve it
- name: accessibility
  color: "f143ab"
  description: A barrier affecting people with disabilities
- name: release-blocker
  color: "b60205"
  description: Must be resolved before the affected release can ship

# Triage and contribution
- name: needs-triage
  color: "fbca04"
  description: Awaiting an initial maintainer review
- name: needs-info
  color: "d4c5f9"
  description: Waiting for specific information from the reporter
- name: needs-repro
  color: "d4c5f9"
  description: Needs a reproducible case or confirmation on an affected platform
- name: blocked
  color: "b60205"
  description: Progress depends on an identified external action or prerequisite
- name: good first issue
  color: "7057ff"
  description: A scoped task with enough guidance for a first contribution
- name: help wanted
  color: "008672"
  description: Extra help is welcome on this work
