# Issue labels read the dropdown answers under the exact form headings.
# Keep the options in step with both issue forms. GitHub renders platform
# selections on one comma-separated line. An edited iPhone answer may include
# an installation note, such as "iPhone (sideloaded)".

platform:macos: '(?:^|\n)#{2,3} Platform / プラットフォーム[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:[^,\r\n]+,[ \t]*)*(?:macOS \(Apple silicon\)|macOS \(Intel\))[ \t]*(?:,|\r?\n|$)'
platform:windows: '(?:^|\n)#{2,3} Platform / プラットフォーム[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:[^,\r\n]+,[ \t]*)*Windows[ \t]*(?:,|\r?\n|$)'
platform:ios: '(?:^|\n)#{2,3} Platform / プラットフォーム[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:[^,\r\n]+,[ \t]*)*iPhone(?:[ \t]+\([^,\r\n()]+\))?[ \t]*(?:,|\r?\n|$)'
platform:ipados: '(?:^|\n)#{2,3} Platform / プラットフォーム[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:[^,\r\n]+,[ \t]*)*iPad[ \t]*(?:,|\r?\n|$)'
platform:android: '(?:^|\n)#{2,3} Platform / プラットフォーム[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*(?:[^,\r\n]+,[ \t]*)*Android[ \t]*(?:,|\r?\n|$)'

