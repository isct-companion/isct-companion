# XcodeGen spec for the SwiftUI shell. Generate the project with
#   cd apps/ios && xcodegen generate
# The Core SDK package (bindings/swift) must be built first: `yarn sdk:ios`.
name: IsctCompanion
options:
  bundleIdPrefix: app.isctcompanion
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  IsctCore:
    path: ../../bindings/swift
  # Celebratory effects the platform lacks; everything else uses SwiftUI's own
  # animation APIs (docs/ux/mobile.md, Look).
  Pow:
    url: https://github.com/EmergeTools/Pow
    exactVersion: 1.0.6
targets:
  IsctCompanion:
    type: application
    platform: iOS
    sources:
      - path: IsctCompanion
      # The desktop's UI catalogs, read by `Localizer` (ja.json, zh.json).
      - path: ../../resources/locales
        buildPhase: resources
    dependencies:
      - package: IsctCore
      - package: Pow
    info:
      path: IsctCompanion/Info.plist
      properties:
        CFBundleDisplayName: IsctCompanion
        CFBundleDevelopmentRegion: en
        # System UI (share sheet, photo picker) follows these; the app's own
        # text follows settings.locale.
        CFBundleLocalizations: [en, ja, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Background refresh (AppModel.backgroundRefresh): Core reads what a
        # token reaches while the app is out of front.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.isctcompanion.refresh]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 認証アプリの QR コードやマトリクス表を読み取るためにカメラを使います。
        NSPhotoLibraryUsageDescription: QR コードやマトリクス表の写真を読み込むために使います。
    entitlements:
      path: IsctCompanion/IsctCompanion.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.isctcompanion
        # The Mac app's CloudKit container (Core's `cloudkitRecord`).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.isctcompanion
        com.apple.developer.icloud-services:
          - CloudKit
        # Development-signed builds would otherwise use CloudKit's separate
        # Development database and never see what the released Mac app wrote.
        com.apple.developer.icloud-container-environment: Production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isctcompanion
        PRODUCT_NAME: IsctCompanion
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
