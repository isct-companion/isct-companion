# XcodeGen spec for the SwiftUI shell. Generate the project with
#   cd apps/ios && xcodegen generate
# The Core SDK package (bindings/swift) must be built first: `yarn sdk:ios`.
name: IsctCompanion
options:
  bundleIdPrefix: app.isctcompanion
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # The website screenshot scene (docs/screenshots/README.md): a debug build
  # of the separate app app.isctcompanion.demo over an SDK built with
  # `build-ios.mjs --demo`. Its own bundle ids, keychain group, URL scheme
  # and data; no iCloud and no App Group.
  Demo: debug
# Every identifier the app and its extensions own derives from ISCT_APP_ID,
# so one setting moves them all (a Personal Team build passes its own).
settings:
  base:
    ISCT_APP_ID: app.isctcompanion
    ISCT_APP_GROUP: group.$(ISCT_APP_ID)
    ISCT_DISPLAY_NAME: IsctCompanion
    ISCT_URL_SCHEME: isctcompanion
  configs:
    Demo:
      ISCT_APP_ID: app.isctcompanion.demo
      ISCT_DISPLAY_NAME: IsctCompanion Demo
      ISCT_URL_SCHEME: isctcompanion-demo
packages:
  IsctWidgets:
    path: ../../bindings/apple-widgets
  IsctCore:
    path: ../../bindings/swift
  # Celebratory effects the platform lacks; everything else uses SwiftUI's own
  # animation APIs (slotledger `approach/mobile-moment-first`).
  Pow:
    url: https://github.com/EmergeTools/Pow
    exactVersion: 1.0.6
targets:
  IsctCompanion:
    type: application
    platform: iOS
    sources:
      - path: IsctCompanion
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The desktop's UI catalogs, read by `Localizer` (ja.json, zh.json).
      - path: ../../resources/locales
        buildPhase: resources
      # The OTP setup guides' screenshots and step list, shared with the desktop.
      - path: ../../resources/otp-guide
        buildPhase: resources
      # The read-only Markdown page (`MarkdownView`), built by `yarn markdown-viewer`.
      - path: ../../resources/markdown-viewer
        buildPhase: resources
    dependencies:
      - package: IsctWidgets
      - package: IsctCore
      - package: Pow
      # The share sheet's entries (slotledger `approach/share-entry-points`): the app-row
      # sheet, the "Hand in assignment" action and the "Print via campus
      # printer" action.
      - target: IsctShare
      - target: IsctOpen
      - target: IsctPrint
      - target: IsctWidgetsExtension
    info:
      path: IsctCompanion/Info.plist
      properties:
        CFBundleDisplayName: $(ISCT_DISPLAY_NAME)
        # The app's one App Group: widget data and the share inbox.
        IsctWidgetGroup: $(ISCT_APP_GROUP)
        CFBundleDevelopmentRegion: en
        # System UI (share sheet, photo picker) follows these; the app's own
        # text follows settings.locale.
        CFBundleLocalizations: [en, ja, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only the system's HTTPS: exempt, so App Store Connect does not hold
        # each upload for an export compliance answer.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Core's existing network and local opportunities, including
        # publication renewal while the host is in the background.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - app.isctcompanion.refresh
          - app.isctcompanion.maintenance
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # "Open in IsctCompanion" in another app's share sheet: the system
        # starts the app with a copy of the file, which goes to the hand-in
        # inbox (slotledger `approach/share-entry-points`).
        # The share extension's "open the app" link.
        CFBundleURLTypes:
          - CFBundleURLName: $(ISCT_APP_ID).inbox
            CFBundleURLSchemes: [$(ISCT_URL_SCHEME)]
        CFBundleDocumentTypes:
          - CFBundleTypeName: File
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content]
        LSSupportsOpeningDocumentsInPlace: false
        NSCameraUsageDescription: 認証アプリの QR コードやマトリクス表の読み取り、過去問の用紙のスキャン、キャンパスマップを補うための建物のフロアの撮影にカメラを使います。
        NSPhotoLibraryUsageDescription: QR コードやマトリクス表の写真を読み込むために使います。
        # The campus map's blue dot (CampusMapLocation); never in the background.
        NSLocationWhenInUseUsageDescription: キャンパスマップに現在地を表示するために使います。
        # The campus printer is on the campus network (172.20.83.212): the
        # print screen checks it and sends to it over LPD.
        NSLocalNetworkUsageDescription: 学内プリンタに接続して印刷するために使います。
        # Google sign-in: the iOS client registered in
        # config/oauth-clients.yaml. Client IDs are public; a tooling test keeps
        # this in step with that file.
        IsctGoogleClientID: $(ISCT_GOOGLE_IOS_CLIENT_ID)
    # The demo scene, the Demo configuration and the demo identifier come
    # only together, as on the desktop (src-tauri/build.rs): the scene never
    # ships under the real app, and the Demo configuration never installs
    # over it. The SDK's mode is the marker build-ios.mjs writes after the
    # library (it deletes the marker first, so a half-done build has none).
    preBuildScripts:
      - name: Check the SDK's demo scene against the configuration and bundle id
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../bindings/swift/artifacts/sdk-build.json
        script: |
          demo=$(plutil -extract demo raw -o - "$SCRIPT_INPUT_FILE_0") || {
            echo "error: no SDK build marker; run build-ios.mjs again"
            exit 1
          }
          if [ "$CONFIGURATION" = Demo ]; then wanted=true; else wanted=false; fi
          case "$PRODUCT_BUNDLE_IDENTIFIER" in *.demo) named=true ;; *) named=false ;; esac
          if [ "$demo" != "$wanted" ] || [ "$named" != "$wanted" ]; then
            echo "error: $CONFIGURATION ($PRODUCT_BUNDLE_IDENTIFIER) needs demo=$wanted for both the SDK (now $demo) and a .demo bundle id (now $named); build-ios.mjs --demo builds the Demo configuration's SDK"
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCT_APP_ID)
        PRODUCT_NAME: IsctCompanion
        # Kept as files, one per configuration: the keychain group, the Mac
        # app's CloudKit container (Core's `cloudkitRecord`, in CloudKit's
        # Production database even for development builds, which would
        # otherwise never see what the released Mac app wrote) and the App
        # Group of the share inbox (SharedInbox.swift).
        CODE_SIGN_ENTITLEMENTS: IsctCompanion/IsctCompanion.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        ISCT_GOOGLE_IOS_CLIENT_ID: 681098185092-eksknsk0j37gt4vnvq843m1f3tbmfjmv.apps.googleusercontent.com
      configs:
        # Only its keychain group: no iCloud container, as the demo workspace
        # never reaches a cloud, and no App Group (see the extensions).
        Demo:
          CODE_SIGN_ENTITLEMENTS: IsctCompanion/IsctCompanion.demo.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ISCT_NO_ICLOUD
  IsctWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../apple-widgets/Extension
        createIntermediateGroups: false
      - path: ../../resources/locales
        buildPhase: resources
      - path: ../apple-widgets/Privacy/PrivacyInfo.xcprivacy
        createIntermediateGroups: false
        buildPhase: resources
    dependencies:
      - package: IsctWidgets
    info:
      path: build/IsctWidgetsExtension/Info.plist
      properties:
        CFBundleDisplayName: $(ISCT_DISPLAY_NAME)
        CFBundleLocalizations: [en, ja, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IsctWidgetGroup: $(ISCT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCT_APP_ID).widgetkit
        CODE_SIGN_ENTITLEMENTS: IsctWidgetsExtension/IsctWidgets.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # The demo app has no App Group (a Personal Team cannot provision
        # one): its inbox and widget data stay empty.
        Demo:
          CODE_SIGN_ENTITLEMENTS: ""
  # Share extension: what is shared from another app goes to the app's inbox
  # in the App Group, optionally for an assignment picked in the sheet. It
  # never loads Core; the app hands the files in.
  IsctShare:
    type: app-extension
    platform: iOS
    sources:
      - path: IsctShare
      - path: Privacy/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ExtensionShared
      - path: IsctCompanion/Shared
        excludes:
          - QuickLookView.swift
          - ShareSheet.swift
          - SystemCamera.swift
      - path: IsctCompanion/Design/Localization.swift
      - path: ../../resources/locales
        buildPhase: resources
    dependencies:
      - package: IsctWidgets
    info:
      path: IsctShare/Info.plist
      properties:
        CFBundleDisplayName: $(ISCT_DISPLAY_NAME)
        IsctWidgetGroup: $(ISCT_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Core's draft upload takes at most 32 files.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 32
              NSExtensionActivationSupportsImageWithMaxCount: 32
              NSExtensionActivationSupportsMovieWithMaxCount: 32
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCT_APP_ID).share
        CODE_SIGN_ENTITLEMENTS: IsctShare/IsctShare.entitlements
        PRODUCT_NAME: IsctShare
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # The demo app has no App Group (a Personal Team cannot provision
        # one): its inbox and widget data stay empty.
        Demo:
          CODE_SIGN_ENTITLEMENTS: ""
  # Action extension: "Hand in assignment" in the share sheet's actions.
  # Hands a selection to the app's assignment picker.
  IsctOpen:
    type: app-extension
    platform: iOS
    sources:
      - path: IsctOpen
      - path: Privacy/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ExtensionShared
      - path: IsctCompanion/Shared/SharedInbox.swift
    info:
      path: IsctOpen/Info.plist
      properties:
        CFBundleDisplayName: Hand in assignment
        IsctWidgetGroup: $(ISCT_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).OpenViewController
          NSExtensionAttributes:
            NSExtensionActionWantsFullScreenPresentation: false
            # Core's draft upload takes at most 32 files.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 32
              NSExtensionActivationSupportsImageWithMaxCount: 32
              NSExtensionActivationSupportsMovieWithMaxCount: 32
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCT_APP_ID).open
        CODE_SIGN_ENTITLEMENTS: IsctOpen/IsctOpen.entitlements
        PRODUCT_NAME: IsctOpen
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # The demo app has no App Group (a Personal Team cannot provision
        # one): its inbox and widget data stay empty.
        Demo:
          CODE_SIGN_ENTITLEMENTS: ""
  # Action extension: "Print via campus printer" in the share sheet's
  # actions. Hands one PDF or picture to the app's own print screen, which
  # Core sends to the campus printer.
  IsctPrint:
    type: app-extension
    platform: iOS
    sources:
      - path: IsctPrint
      - path: Privacy/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ExtensionShared
      - path: IsctCompanion/Shared/SharedInbox.swift
    info:
      path: IsctPrint/Info.plist
      properties:
        CFBundleDisplayName: Print via campus printer
        IsctWidgetGroup: $(ISCT_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrintViewController
          NSExtensionAttributes:
            NSExtensionActionWantsFullScreenPresentation: false
            # One PDF or one picture: what the print screen prints.
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count == 1).@count == 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCT_APP_ID).print
        CODE_SIGN_ENTITLEMENTS: IsctPrint/IsctPrint.entitlements
        PRODUCT_NAME: IsctPrint
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # The demo app has no App Group (a Personal Team cannot provision
        # one): nothing is handed over.
        Demo:
          CODE_SIGN_ENTITLEMENTS: ""
