# XcodeGen spec for the SwiftUI shell. Generate the project with
#   cd apps/ios && xcodegen generate
# The Core SDK package (bindings/swift) must be built first: `yarn sdk:ios`.
name: IsctCompanion
options:
  bundleIdPrefix: app.isctcompanion
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
packages:
  IsctCore:
    path: ../../bindings/swift
targets:
  IsctCompanion:
    type: application
    platform: iOS
    sources:
      - path: IsctCompanion
    dependencies:
      - package: IsctCore
    info:
      path: IsctCompanion/Info.plist
      properties:
        CFBundleDisplayName: IsctCompanion
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 認証アプリの QR コードやマトリクス表を読み取るためにカメラを使います。
        NSPhotoLibraryUsageDescription: QR コードやマトリクス表の写真を読み込むために使います。
    entitlements:
      path: IsctCompanion/IsctCompanion.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.isctcompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isctcompanion
        PRODUCT_NAME: IsctCompanion
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
