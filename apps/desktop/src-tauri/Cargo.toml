[package]
name = "isct-companion"
version = "1.0.0-rc.3"
description = "IsctCompanion desktop shell"
authors = ["IsctCompanion contributors"]
edition = "2021"
rust-version = "1.90"
default-run = "isct-companion"

[lib]
name = "isct_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
isct-core = { path = "../../../crates/isct-core", features = ["ts"] }
isct-ocr = { path = "../../../crates/isct-ocr" }
tokio = { version = "1", features = ["time", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["unstable", "protocol-asset"] }
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
sha2 = "0.10"
url = "2.5"
percent-encoding = "2"
scraper = "0.24"
tauri-plugin-secure-storage = "1.5.0"
tauri-plugin-clipboard-manager = "2"

# Desktop workspace archives and the embedded MCP HTTP transport.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
isct-core = { path = "../../../crates/isct-core", features = ["desktop-workspaces"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
subtle = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["net"] }

[target.'cfg(target_os = "ios")'.dependencies]
wry = "0.57"
security-framework = "3.7"
objc2 = "0.6.4"
block2 = "0.6"
objc2-cloud-kit = { version = "0.3.2", default-features = false, features = ["CKAsset", "CKContainer", "CKDatabase", "CKRecord", "CKRecordID", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIView", "UIWindow", "UIScreen"] }
tauri-plugin-google-drive-auth = { path = "../../../deprecated/tauri-mobile/plugins/google-drive-auth" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-google-drive-auth = { path = "../../../deprecated/tauri-mobile/plugins/google-drive-auth" }
tauri-plugin-school-web = { path = "../../../deprecated/tauri-mobile/plugins/school-web" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
block2 = "0.6"
objc2-cloud-kit = { version = "0.3.2", default-features = false, features = ["CKAsset", "CKContainer", "CKDatabase", "CKRecord", "CKRecordID", "block2"] }
# Campus Wi-Fi (campus_wifi.rs): Wi-Fi interface, its address, and DNS bound to it.
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWWiFiClient", "CWInterface"] }
if-addrs = "0.14"
ipnet = "2"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView"] }
# School view WebKit hooks (school_webkit.rs). Same versions wry already uses.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSString", "NSURL", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKNavigationDelegate", "WKNavigationResponse", "WKUIDelegate", "WKWebView"] }
