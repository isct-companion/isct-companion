[package]
name = "isct-companion"
version = "1.1.8"
description = "IsctCompanion desktop shell"
authors = ["IsctCompanion contributors"]
edition = "2021"
rust-version = "1.90"
default-run = "isct-companion"

[lib]
name = "isct_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
log = "0.4"
isct-core = { path = "../../../crates/isct-core", features = ["ts", "desktop-workspaces"] }
isct-ocr = { path = "../../../crates/isct-ocr" }
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["unstable", "protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
rand = "0.9"
# TLS comes from Core: build clients with `isct_core::net::client_builder()`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "json", "form", "stream", "cookies"] }
sha2 = "0.10"
url = "2.5"
percent-encoding = "2"
scraper = "0.24"
tauri-plugin-secure-storage = "1.5.0"
tauri-plugin-clipboard-manager = "2"

# The embedded MCP HTTP transport.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
subtle = "2"
tokio-util = { version = "0.7", features = ["rt"] }
# Native v2 EXE and macOS tar.gz updates; legacy v1 ZIP installers are unused.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
block2 = "0.6"
objc2-cloud-kit = { version = "0.3.2", default-features = false, features = ["CKAsset", "CKContainer", "CKDatabase", "CKRecord", "CKRecordID", "block2"] }
# Campus Wi-Fi (campus_wifi.rs): Wi-Fi interface, its address, and DNS bound to it.
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWWiFiClient", "CWInterface"] }
if-addrs = "0.14"
ipnet = "2"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSView"] }
# Native notifications (notifications_macos.rs).
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# School view WebKit hooks (school_webkit.rs). Same versions wry already uses.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSData", "NSError", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKDownload", "WKDownloadDelegate", "WKNavigation", "WKNavigationDelegate", "WKNavigationResponse", "WKUIDelegate", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native Windows toast delivery returns the WinRT result synchronously so test
# notifications and reminder claims reflect the native result.
tauri-winrt-notification = "0.7.3"
