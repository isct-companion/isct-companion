[package]
name = "science-tokyo-workstation"
version = "0.1.0"
description = "Science Tokyo Workstation desktop shell"
authors = ["Science Tokyo Workstation contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "science_tokyo_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-store = "2.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
url = "2.5"
regex = "1"
scraper = "0.24"
ring = "0.17"
tauri-plugin-secure-storage = "1.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
