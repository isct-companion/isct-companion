[package]
name = "science-tokyo-workstation"
version = "0.1.0"
description = "Science Tokyo Workstation desktop shell"
authors = ["Science Tokyo Workstation contributors"]
edition = "2021"
rust-version = "1.90"
default-run = "science-tokyo-workstation"

[lib]
name = "science_tokyo_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["unstable", "protocol-asset"] }
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
rrule = "0.14"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10"
url = "2.5"
regex = "1"
scraper = "0.24"
ring = "0.17"
tauri-plugin-secure-storage = "1.5.0"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView"] }
# School view PDF save hook (school_pdf_save.rs). Same versions wry already uses.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKUIDelegate", "WKWebView"] }

# Matrix OCR: ort ships no prebuilt ONNX Runtime for Intel macOS, so the scanner
# is compiled out there. Keep this condition in sync with build.rs (`matrix_ocr`).
# Windows loads the runtime on first use so a bad/missing ONNX Runtime DLL cannot
# prevent the application (or its non-OCR tests) from starting.
[target.'cfg(not(any(all(target_os = "macos", target_arch = "x86_64"), target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24", "load-dynamic", "copy-dylibs"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
