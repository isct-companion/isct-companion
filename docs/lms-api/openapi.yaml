          - mod_quiz_get_user_attempts
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        quizid:
          type: integer
          format: int64
          description: Quiz.id，不能传 cmid。
          minimum: 1
        status:
          type: string
          enum:
          - all
          - finished
          - unfinished
          default: finished
        includepreviews:
          type: integer
          format: int64
          enum:
          - 0
          - 1
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - quizid
      description: 只读；开始或保存作答的函数不在范围内。
    GetQuizAccessInformationRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - mod_quiz_get_quiz_access_information
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        quizid:
          type: integer
          format: int64
          description: Quiz.id，不能传 cmid。
          minimum: 1
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - quizid
      description: 判断口令、Safe Exam Browser 和计时规则的唯一途径。
    SaveSubmissionRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - mod_assign_save_submission
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        assignmentid:
          type: integer
          format: int64
          description: Assignment.id（assignid），不能传 cmid。
          minimum: 1
        plugindata[files_filemanager]:
          type: integer
          format: int64
          description: 草稿区 itemid。草稿区整体替换文件区：没有放进草稿区的旧文件被删除；超出数量或大小的文件被静默跳过；类型限制在这条路径上不检查。缺省或 0 时不动文件区。
        plugindata[onlinetext_editor][text]:
          type: string
          description: 在线文本 HTML。作业启用在线文本时每次都要发送，文本不变时回填当前文本；缺省时上游会写入 NULL，预计整次保存失败。
        plugindata[onlinetext_editor][format]:
          type: integer
          format: int64
          description: 文本格式；1 为 HTML。
        plugindata[onlinetext_editor][itemid]:
          type: integer
          format: int64
          description: 嵌入文件的草稿区；没有嵌入文件时为 0。
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - assignmentid
      description: 候选，2026-10-31 在只有文件的作业上实测一次（在线文本未测）。未开放时返回 couldnotsavesubmission；内容全空时返回 submissionempty；用户被锁定时抛出 submissionslocked。草稿关闭时保存即为 submitted。
    SubmitForGradingRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - mod_assign_submit_for_grading
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        assignmentid:
          type: integer
          format: int64
          minimum: 1
        acceptsubmissionstatement:
          type: integer
          format: int64
          enum:
          - 0
          - 1
          description: 用户本人接受提交声明后才可为 1。
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - assignmentid
      - acceptsubmissionstatement
      description: 候选，未实测。只用于 submissiondrafts=1 且状态为 draft 的作业：上游不检查草稿开关和内容是否为空。之后不能再改，除非教师退回草稿。
    RemoveSubmissionRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - mod_assign_remove_submission
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        userid:
          type: integer
          format: int64
          description: 本人 userid，取自 core_webservice_get_site_info。
          minimum: 1
        assignid:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - userid
      - assignid
      description: 候选，2026-10-31 实测一次。删除本次提交的文件和在线文本，状态回到 new（以后的尝试回到 reopened）；只在 canedit 时可用。内容无法恢复。
    StartSubmissionRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - mod_assign_start_submission
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        assignid:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - assignid
      description: 候选，未实测。只用于计时作业；写入 timestarted，计时无法撤销。warning 为 submissionnotopen、timelimitnotenabled 或 opensubmissionexists。
    GetUnusedDraftItemidRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - core_files_get_unused_draft_itemid
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      description: 候选，未实测。上游只生成一个未用的编号，不写库；upload.php 的 itemid=0 也会新建草稿区。
    DeleteDraftFilesRequest:
      type: object
      properties:
        wstoken:
          type: string
          description: 移动端 Web Service token；不使用 sesskey、Cookie 或 Bearer header。
          format: password
          writeOnly: true
        wsfunction:
          type: string
          enum:
          - core_files_delete_draft_files
        moodlewsrestformat:
          type: string
          enum:
          - json
          default: json
        draftitemid:
          type: integer
          format: int64
        files[0][filepath]:
          type: string
        files[0][filename]:
          type: string
      additionalProperties: true
      required:
      - wstoken
      - wsfunction
      - moodlewsrestformat
      - draftitemid
      description: 候选，未实测。每次用新的草稿区时不需要。
    RpcRequest:
      oneOf:
      - $ref: '#/components/schemas/GetSiteInfoRequest'
      - $ref: '#/components/schemas/GetDashboardBlocksRequest'
      - $ref: '#/components/schemas/GetEnrolledCoursesRequest'
      - $ref: '#/components/schemas/GetCourseContentsRequest'
      - $ref: '#/components/schemas/GetAssignmentsRequest'
      - $ref: '#/components/schemas/GetSubmissionStatusRequest'
      - $ref: '#/components/schemas/GetForumDiscussionsRequest'
      - $ref: '#/components/schemas/GetActionEventsRequest'
      - $ref: '#/components/schemas/GetMobileConfigRequest'
      - $ref: '#/components/schemas/GetQuizzesRequest'
      - $ref: '#/components/schemas/GetUserAttemptsRequest'
      - $ref: '#/components/schemas/GetQuizAccessInformationRequest'
      discriminator:
        propertyName: wsfunction
        mapping:
          core_webservice_get_site_info: '#/components/schemas/GetSiteInfoRequest'
          core_block_get_dashboard_blocks: '#/components/schemas/GetDashboardBlocksRequest'
          core_enrol_get_users_courses: '#/components/schemas/GetEnrolledCoursesRequest'
          core_course_get_contents: '#/components/schemas/GetCourseContentsRequest'
          mod_assign_get_assignments: '#/components/schemas/GetAssignmentsRequest'
          mod_assign_get_submission_status: '#/components/schemas/GetSubmissionStatusRequest'
          mod_forum_get_forum_discussions: '#/components/schemas/GetForumDiscussionsRequest'
          core_calendar_get_action_events_by_timesort: '#/components/schemas/GetActionEventsRequest'
          tool_mobile_get_config: '#/components/schemas/GetMobileConfigRequest'
          mod_quiz_get_quizzes_by_courses: '#/components/schemas/GetQuizzesRequest'
          mod_quiz_get_user_attempts: '#/components/schemas/GetUserAttemptsRequest'
          mod_quiz_get_quiz_access_information: '#/components/schemas/GetQuizAccessInformationRequest'
    PublicConfig:
      type: object
      properties:
        wwwroot:
          type: string
        enablewebservices:
          type: integer
          format: int64
        enablemobilewebservice:
          type: integer
          format: int64
        typeoflogin:
          type: integer
          format: int64
        launchurl:
          type: string
        tool_mobile_qrcodetype:
          type: integer
          format: int64
      additionalProperties: true
      required:
      - wwwroot
      - enablewebservices
      - enablemobilewebservice
      - typeoflogin
    PublicEnvelope:
      type: array
      items:
        type: object
        properties:
          error:
            type: boolean
          data:
            $ref: '#/components/schemas/PublicConfig'
          exception:
            $ref: '#/components/schemas/MoodleError'
        additionalProperties: true
        required:
        - error
  securitySchemes:
    FileToken:
      type: apiKey
      in: query
      name: token
      description: 仅向返回 URL 的受信任学校源添加；日志必须去掉 token。
x-moodle-functions:
- name: core_block_get_dashboard_blocks
  summary: 默认课表区块
  requestSchema: GetDashboardBlocksRequest
  responseSchema: DashboardBlocks
  verified: cookie-free native POST and Core sync, 2026-10-22
  description: 返回 tttimetable 的内部 HTML；本次 2026-3Q 课时和未安排课程与手机逐项一致。其他季度的筛选字段被拒绝。
- name: core_webservice_get_site_info
  summary: 认证与能力列表
  requestSchema: GetSiteInfoRequest
  responseSchema: SiteInfo
  verified: native POST, 2026-10-20
  description: 先取得当前 userid 和 functions；检查所需函数是否被该 token 的服务提供。
- name: core_enrol_get_users_courses
  summary: 本人课程
  requestSchema: GetEnrolledCoursesRequest
  responseSchema: EnrolledCourses
  verified: native POST, 2026-10-20
  description: 返回课程数组；本次实测 62 门。
- name: core_course_get_contents
  summary: 课程章节、活动和文件清单
  requestSchema: GetCourseContentsRequest
  responseSchema: CourseContents
  verified: native POST, 2026-10-20
  description: 直接返回章节数组，不是 core_courseformat_get_state 的 JSON 字符串。summary 和 description 是不可信 HTML，应经过应用的内容处理。
- name: mod_assign_get_assignments
  summary: 作业元数据
  requestSchema: GetAssignmentsRequest
  responseSchema: Assignments
  verified: native POST, 2026-10-20
  description: 省略 courseids 时会读取已选课程中的作业；建议显式按课程限制范围。duedate 与 cutoffdate 的语义不同。
- name: mod_assign_get_submission_status
  summary: 本人提交与评分反馈
  requestSchema: GetSubmissionStatusRequest
  responseSchema: SubmissionStatus
  verified: native POST, 2026-10-20
  description: 省略 userid 以读取当前用户。lastattempt、submission 和 feedback 均可能缺失，不能把缺失解释为已提交。
- name: mod_forum_get_forum_discussions
  summary: 论坛讨论和公告正文
  requestSchema: GetForumDiscussionsRequest
  responseSchema: Discussions
  verified: native POST, 2026-10-20
  description: message 为讨论首帖 HTML；discussion 是讨论 ID，id 是首帖 ID。逐页读取，权限限制可能使结果不完整。
- name: core_calendar_get_action_events_by_timesort
  summary: 待办时间线
  requestSchema: GetActionEventsRequest
  responseSchema: ActionEvents
  verified: native POST, 2026-10-20
  description: 仅表示行动事件，不是完整作业历史。已提交作业可能不再出现；使用 submission status 判断实际状态。
- name: tool_mobile_get_config
  summary: 移动端策略
  requestSchema: GetMobileConfigRequest
  responseSchema: MobileConfig
  verified: native POST, 2026-10-20
  description: 自动登出策略不是 token 的到期时间。本次 forcelogout=0、autologout=0、autologouttime=86400；最后一项在自动登出关闭时不生效。
- name: mod_quiz_get_quizzes_by_courses
  summary: 小测设置
  requestSchema: GetQuizzesRequest
  responseSchema: Quizzes
  verified: native POST through Core TokenTransport, 2026-10-31
  description: 5 个小测均已关闭，attempts=1、timelimit=0、grademethod=1；关闭后不返回 overduehandling、browsersecurity 等作答设置，password 只返回给管理者。
- name: mod_quiz_get_user_attempts
  summary: 本人的小测尝试
  requestSchema: GetUserAttemptsRequest
  responseSchema: UserAttempts
  verified: native POST through Core TokenTransport, 2026-10-31
  description: 本季和上季的两个小测各有 1 次 finished 尝试。
- name: mod_quiz_get_quiz_access_information
  summary: 小测访问规则
  requestSchema: GetQuizAccessInformationRequest
  responseSchema: QuizAccessInformation
  verified: native POST through Core TokenTransport, 2026-10-31
  description: activerulenames 只有 quizaccess_numattempts 和 quizaccess_openclosedate，没有口令或 Safe Exam Browser。为此加入 Core 的只读 MoodleFunction 枚举。
x-moodle-write-candidates:
- name: webservice/upload.php
  path: /webservice/upload.php
  summary: 上传文件到本人草稿区
  requestSchema: UploadDraftRequest
  responseSchema: UploadedDraftFile
  offered: uploadfiles=1 in site info; tokenless GET answered missingparam, 2026-10-31
  verified: one write round trip, 2026-10-31 (small files only)
  needed: true
  source: webservice/upload.php
  description: 写入枚举第一步。第一个文件用 itemid=0 并取回 itemid，其余文件用同一 itemid；逐文件检查 errortype。实测同名文件返回 filenameexist 且不覆盖；网关大小上限未测。
- name: mod_assign_save_submission
  summary: 保存提交（草稿关闭时即为提交）
  requestSchema: SaveSubmissionRequest
  responseSchema: WriteWarnings
  offered: site info functions, 2026-10-31
  verified: one write round trip on a file-only assignment, 2026-10-31
  needed: true
  source: mod/assign/externallib.php save_submission; mod/assign/locallib.php save_submission; mod/assign/submission/*/locallib.php save
  description: 草稿区必须是最终的完整文件集合；每个已启用插件都要带数据。开放期内可以反复保存，过 cutoffdate 后不能再改。实测：成功返回 []，状态 submitted；新草稿区整体替换文件区；filetypeslist 不检查。在线文本未测。
- name: mod_assign_remove_submission
  summary: 撤回提交（删除内容）
  requestSchema: RemoveSubmissionRequest
  responseSchema: RemoveSubmissionResult
  offered: site info functions, 2026-10-31
  verified: one write round trip, 2026-10-31
  needed: true
  source: mod/assign/classes/external/remove_submission.php; mod/assign/locallib.php remove_submission
  description: 只在 canedit 时可用，内容无法恢复；只在用户明确确认后执行。实测：status=true，状态回到 new、文件清空、timemodified 不变；再撤回返回 submissionnotfoundtoremove。
- name: mod_assign_submit_for_grading
  summary: 草稿改为已提交
  requestSchema: SubmitForGradingRequest
  responseSchema: WriteWarnings
  offered: site info functions, 2026-10-31
  verified: false
  needed: only for submissiondrafts=1, none observed
  source: mod/assign/externallib.php submit_for_grading; mod/assign/locallib.php submit_for_grading
  description: 上游不检查草稿开关和内容是否为空，warning 不带原因；之后不能再改。
- name: mod_assign_start_submission
  summary: 开始计时作业
  requestSchema: StartSubmissionRequest
  responseSchema: StartSubmissionResult
  offered: site info functions, 2026-10-31
  verified: false
  needed: only for timed assignments, none observed
  source: mod/assign/classes/external/start_submission.php
  description: 计时开始后无法撤销，撤回提交也不清除 timestarted。
- name: core_files_get_unused_draft_itemid
  summary: 取未用的草稿 itemid
  requestSchema: GetUnusedDraftItemidRequest
  responseSchema: UnusedDraftItemid
  offered: site info functions, 2026-10-31
  verified: false
  needed: false
  source: files/classes/external/get/unused_draft.php
  description: upload.php 的 itemid=0 已能新建草稿区。
- name: core_files_delete_draft_files
  summary: 删除草稿区中的文件
  requestSchema: DeleteDraftFilesRequest
  responseSchema: DeleteDraftFilesResult
  offered: site info functions, 2026-10-31
  verified: false
  needed: false
  source: files/classes/external/delete/draft.php
  description: 每次用新的草稿区时不需要；cron 清除 4 天前的草稿区。
