openapi: 3.0.3
info:
  title: Science Tokyo LMS · Read API
  version: 2026.10.31
  description: '已在 Science Tokyo LMS /2025 实测的应用接入协议。包含 12 个读取函数、官方浏览器授权入口和资源下载；不是全部 470 个 Moodle 服务函数的镜像。


    写入候选（tag「Write candidates」、/webservice/upload.php 和 x-moodle-write-candidates）确认了函数由此服务开放，参数和行为读自 Moodle v4.5.10 源码；其中上传、保存、撤回在一个只有文件的作业上实测过一次，其余未实测。它们不属于 RpcRequest：读取路径不能表达写操作。


    REST 是单一 RPC 路径，通过 wsfunction 选择函数；这里保留真实路径，以 oneOf 描述不同请求，未虚构 /courses 等路由。响应模型只列接入相关字段，允许额外字段，不保证所有课程和权限组合都返回同样字段。


    原生客户端使用项目现有 User-Agent：Mozilla/5.0 (compatible; IsctCompanion/0.1)。实测 curl 默认标识收到网关 403，该标识和 reqwest
    0.12.28/rustls 可以成功。无需 Cookie，保持 TLS 证书校验，禁用自动跨站重定向。


    HTTP 200 可能包含 errorcode；令牌不是 JWT，也没有已验证的 refresh_token 流程。当前账户具体 token 到期时间未知，不能由 Moodle 上游默认值推算。'
  contact:
    name: IsctCompanion integration notes
servers:
- url: https://lms.s.isct.ac.jp/2025
  description: Science Tokyo LMS（2025 路径也承载 2026 课程）
tags:
- name: Discovery
- name: Browser authorization
- name: Read RPC
- name: Files
- name: Write candidates
  description: 2026-10-31 确认服务开放这些入口；参数和行为来自上游 v4.5.10 源码，上传、保存、撤回另实测过一次。
paths:
  /webservice/rest/server.php:
    post:
      tags:
      - Read RPC
      operationId: callReadFunction
      summary: 调用已验证的读取函数
      description: Content-Type 必须为 application/x-www-form-urlencoded。通过 Request body 的 oneOf 选择函数；参阅
        Examples 的各函数样例。PHP 数组必须使用 courseids[0]=… 这样的键，不发送 JSON 请求体。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RpcRequest'
            examples:
              core_webservice_get_site_info:
                summary: 认证与能力列表（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: core_webservice_get_site_info
                  moodlewsrestformat: json
              core_block_get_dashboard_blocks:
                summary: 默认课表区块（不需要 Cookie）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: core_block_get_dashboard_blocks
                  moodlewsrestformat: json
                  returncontents: 1
              core_enrol_get_users_courses:
                summary: 本人课程（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: core_enrol_get_users_courses
                  moodlewsrestformat: json
                  userid: 10001
              core_course_get_contents:
                summary: 课程章节、活动和文件清单（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: core_course_get_contents
                  moodlewsrestformat: json
                  courseid: 1001
              mod_assign_get_assignments:
                summary: 作业元数据（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: mod_assign_get_assignments
                  moodlewsrestformat: json
                  courseids[0]: 1001
              mod_assign_get_submission_status:
                summary: 本人提交与评分反馈（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: mod_assign_get_submission_status
                  moodlewsrestformat: json
                  assignid: 2001
              mod_forum_get_forum_discussions:
                summary: 论坛讨论和公告正文（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: mod_forum_get_forum_discussions
                  moodlewsrestformat: json
                  forumid: 3001
                  page: 0
                  perpage: 25
              core_calendar_get_action_events_by_timesort:
                summary: 待办时间线（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: core_calendar_get_action_events_by_timesort
                  moodlewsrestformat: json
                  timesortfrom: 0
                  limitnum: 50
              tool_mobile_get_config:
                summary: 移动端策略（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: tool_mobile_get_config
                  moodlewsrestformat: json
                  section: mobileapp
              mod_quiz_get_quizzes_by_courses:
                summary: 小测设置（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: mod_quiz_get_quizzes_by_courses
                  moodlewsrestformat: json
                  courseids[0]: 1001
              mod_quiz_get_user_attempts:
                summary: 本人的小测尝试（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: mod_quiz_get_user_attempts
                  moodlewsrestformat: json
                  quizid: 4001
                  status: all
                  includepreviews: 0
              mod_quiz_get_quiz_access_information:
                summary: 小测访问规则（合成示例）
                value:
                  wstoken: REPLACE_WITH_TOKEN
                  wsfunction: mod_quiz_get_quiz_access_information
                  moodlewsrestformat: json
                  quizid: 4001
      responses:
        '200':
          description: 函数对应成功数据，或 MoodleError。响应形状由请求 wsfunction 决定；详见 x-moodle-functions 中的 responseSchema。
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SiteInfo'
                - $ref: '#/components/schemas/DashboardBlocks'
                - $ref: '#/components/schemas/EnrolledCourses'
                - $ref: '#/components/schemas/CourseContents'
                - $ref: '#/components/schemas/Assignments'
                - $ref: '#/components/schemas/SubmissionStatus'
                - $ref: '#/components/schemas/Discussions'
                - $ref: '#/components/schemas/ActionEvents'
                - $ref: '#/components/schemas/MobileConfig'
                - $ref: '#/components/schemas/Quizzes'
                - $ref: '#/components/schemas/UserAttempts'
                - $ref: '#/components/schemas/QuizAccessInformation'
                - $ref: '#/components/schemas/MoodleError'
              examples:
                invalidtoken:
                  summary: 错误令牌仍是 HTTP 200（实测）
                  value:
                    exception: core\exception\moodle_exception
                    errorcode: invalidtoken
                    message: Invalid token - token not found
        '403': &id001
          description: 网关或 HTTP 层失败，可能返回 HTML 而非 Moodle JSON；不要直接作为业务响应解析。
        default: *id001
  /lib/ajax/service-nologin.php:
    get:
      tags:
      - Discovery
      operationId: getPublicMobileConfig
      summary: 获取公开的移动端服务开关
      security: []
      parameters:
      - name: info
        in: query
        schema:
          type: string
          enum:
          - tool_mobile_get_public_config
        required: true
      - name: args
        in: query
        required: true
        schema:
          type: string
        example: '[{"index":0,"methodname":"tool_mobile_get_public_config","args":{}}]'
        description: JSON 字符串，经 URL 编码后发送；这里只调用这个公开只读函数。
      responses:
        '200':
          description: AJAX envelope，与 REST 成功响应的形状不同。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEnvelope'
        default: *id001
  /admin/tool/mobile/launch.php:
    get:
      tags:
      - Browser authorization
      operationId: launchMobileAuthorization
      summary: 在网页登录上下文获取移动端 token
      description: 可能复用既有 token 或创建凭证，不是只读数据查询。由原生应用发起并接管自有注册 URL scheme 的回调；用户在学校 SSO 页面完成认证。回调格式为 scheme://token=base64(md5(wwwroot
        + passport):::wstoken[:::privatetoken])。验证 passport 对应摘要、来源和一次性关联后再接收 token；不要在日志或普通页面中展示回调。privatetoken
        可能不返回，不是 refresh_token。
      security: []
      parameters:
      - name: service
        in: query
        required: true
        schema:
          type: string
          enum:
          - moodle_mobile_app
      - name: passport
        in: query
        required: true
        schema:
          type: string
        description: 每次授权生成新的不可预测值，并绑定当前待完成的授权；不要使用本次探测的固定值。
      - name: urlscheme
        in: query
        schema:
          type: string
          default: moodlemobile
        description: 客户端实际注册并能拦截的 scheme；学校可以覆盖。
      responses:
        '302':
          description: 进入登录或跳转到自定义 scheme；Location 可能含凭证，不应直接记录。
          headers:
            Location:
              schema:
                type: string
        '200':
          description: 学校授权/启动页面；此页面的应用链接可能含凭证。
          content:
            text/html:
              schema:
                type: string
        default: *id001
  /webservice/pluginfile.php/{contextid}/mod_resource/content/{revision}/{filename}:
    get:
      tags:
      - Files
      operationId: downloadResourceFile
      summary: 下载 API 返回的资源文件（含 Range）
      description: 此模板只表示已验证的 mod_resource 文件路径；其他 filearea/模块应直接使用 API 给出的 fileurl，不能按此模板猜测路径。filename
        各路径段正确编码；保留原 URL 的参数并添加 token。实测 PDF 完整下载和 Range 成功。不要只根据 HTTP 200 就认定成功：无效 token 的文件请求也返回了 200，需检查类型和内容。
      security:
      - FileToken: []
      parameters:
      - name: contextid
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: filename
        in: path
        required: true
        schema:
          type: string
      - name: Range
        in: header
        schema:
          type: string
        example: bytes=0-1023
        description: 已实测单一前缀范围；206 响应必须校验 Content-Range。
      responses:
        '200':
          description: 完整文件，或错误响应（可能为 text/html）；样本为 45,268 字节的 PDF。
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/MoodleError'
        '206':
          description: 部分文件。实测 bytes 0-1023/45268，对应 1,024 字节，并与完整文件前缀一致。
          headers:
            Content-Range:
              schema:
                type: string
              example: bytes 0-1023/45268
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403': *id001
        '416':
          description: 范围不可满足；本次未实测。
        default: *id001
  /webservice/upload.php:
    post:
      tags:
      - Write candidates
      operationId: uploadDraftFiles
      summary: 上传文件到本人草稿区（候选，实测一次）
      description: 不是 REST 函数，token 字段名是 token 而不是 wstoken。站点信息 uploadfiles=1；2026-10-31 不带 token 和文件的 GET 返回 HTTP 200、errorcode=missingparam，说明网关放行此路径；同日一次实测上传了 193 字节和 24 字节的文件。上游：itemid 为 0 时新建草稿区并在每条结果中返回
        itemid；同一草稿区内同名文件返回 filenameexist，单个文件超过站点上限返回 fileoversized，两者都是 HTTP 200 中的逐文件条目；总大小超过用户上限时抛出 userquotalimit。cron 清除
        4 天前的草稿区。
      security: []
      x-verified: one write round trip with small files, 2026-10-31
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDraftRequest'
      responses:
        '200':
          description: 每个文件一条结果；认证或配额失败时为 MoodleError。
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/UploadedDraftFile'
                - $ref: '#/components/schemas/MoodleError'
              examples:
                missingparam:
                  summary: 不带 token 的 GET（实测）
                  value:
                    errorcode: missingparam
        '403': *id001
        default: *id001
components:
  schemas:
    MoodleError:
      type: object
      properties:
        exception:
          type: string
        errorcode:
          type: string
        message:
          type: string
        debuginfo:
          type: string
          nullable: true
      additionalProperties: true
      required:
      - errorcode
      description: 业务错误可能仍返回 HTTP 200。先识别 errorcode，再解析成功响应；不要向日志直接复制 message 或 debuginfo。
    Warning:
      type: object
      properties:
        item:
          type: string
        itemid:
          type: integer
          format: int64
        warningcode:
          type: string
        message:
          type: string
      additionalProperties: true
      required:
      - warningcode
      - message
    FileEntry:
      type: object
      properties:
        type:
          type: string
          description: file、url 或 content；只有 file 是可下载文件。
        filename:
          type: string
        filepath:
          type: string
          nullable: true
        filesize:
          type: integer
          format: int64
          description: 字节数。
        fileurl:
          type: string
          description: 使用 API 返回的原始 URL；下载时仅向受信任 LMS 主机添加 token。
          format: uri
        mimetype:
          type: string
        timemodified:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        content:
          type: string
          description: 内联内容；按 type 和模块类型解释。
      additionalProperties: true
      required:
      - type
      - filename
    Course:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: LMS course ID，不等于官方教学班编号。
        shortname:
          type: string
        fullname:
          type: string
          description: 可能包含日英双语标题。
        idnumber:
          type: string
          description: 可能是 syllabus offering ID；不要假设始终存在或唯一。
        category:
          type: integer
          format: int64
        visible:
          type: integer
          format: int64
        hidden:
          type: boolean
        summary:
          type: string
          description: HTML。
        startdate:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        enddate:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        timemodified:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        overviewfiles:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              fileurl:
                type: string
                format: uri
              filesize:
                type: integer
                format: int64
              mimetype:
                type: string
            additionalProperties: true
      additionalProperties: true
      required:
      - id
      - shortname
      - fullname
    Module:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: cmid：课程模块 ID，用于 mod/*/view.php?id=…；不是 assignid/forumid。
        instance:
          type: integer
          format: int64
          description: 该模块实例 ID；assign 模块是 assignid，forum 模块是 forumid。
        modname:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        uservisible:
          type: boolean
        description:
          type: string
          description: 可选 HTML，不保证每个模块都返回。
        contents:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'
        dates:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              timestamp:
                type: integer
                format: int64
                description: Unix 时间戳，单位为秒；0 通常表示未设置。
            additionalProperties: true
      additionalProperties: true
      required:
      - id
      - instance
      - modname
      - name
    Section:
      type: object
      properties:
        id:
          type: integer
          format: int64
        section:
          type: integer
          format: int64
          description: 章节序号。
        name:
          type: string
        summary:
          type: string
          description: 章节 HTML。
        summaryformat:
          type: integer
          format: int64
        uservisible:
          type: boolean
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
      additionalProperties: true
      required:
      - id
      - name
      - modules
    Assignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: assignid：mod_assign 实例 ID。
        cmid:
          type: integer
          format: int64
          description: 课程模块 ID。
        course:
          type: integer
          format: int64
          description: LMS course ID。
        name:
          type: string
        duedate:
          type: integer
          format: int64
          description: 提交截止时间；0 表示没有设置。
        allowsubmissionsfromdate:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        cutoffdate:
          type: integer
          format: int64
          description: 停止接收提交的时间；不要与 duedate 混淆。
        timemodified:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        intro:
          type: string
          description: 说明 HTML；本次样本为空，不代表所有作业都为空。
        introformat:
          type: integer
          format: int64
        introfiles:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              fileurl:
                type: string
                format: uri
              filesize:
                type: integer
                format: int64
              mimetype:
                type: string
            additionalProperties: true
        nosubmissions:
          type: integer
          format: int64
          description: 1 表示线下作业，不接受在线提交。
        submissiondrafts:
          type: integer
          format: int64
          description: 1 表示先存草稿、再 submit_for_grading；0 表示保存即为 submitted。2026-10-31 的 83 个作业全为 0。
        requiresubmissionstatement:
          type: integer
          format: int64
          description: 1 表示提交前须接受提交声明；2026-10-31 全为 0。
        submissionstatement:
          type: string
          description: 格式化后的声明 HTML；只在需要声明时返回。
        timelimit:
          type: integer
          format: int64
          description: 计时作业的秒数；0 表示不计时。站点还需开启 enabletimelimit。
        attemptreopenmethod:
          type: string
          description: untilpass、manual 或 automatic；none 自上游 4.4 起弃用。实测只有 untilpass 和 manual。
        maxattempts:
          type: integer
          format: int64
          description: 最多尝试次数；-1 表示不限。新尝试只由教师评分或重开产生。
        teamsubmission:
          type: integer
          format: int64
        requireallteammemberssubmit:
          type: integer
          format: int64
        teamsubmissiongroupingid:
          type: integer
          format: int64
        preventsubmissionnotingroup:
          type: integer
          format: int64
          description: 团队作业中不在组里的学生不能提交。
        blindmarking:
          type: integer
          format: int64
        markingworkflow:
          type: integer
          format: int64
        sendnotifications:
          type: integer
          format: int64
          description: 每次提交是否通知教师；实测全为 0。
        configs:
          type: array
          items:
            $ref: '#/components/schemas/AssignConfig'
      additionalProperties: true
      required:
      - id
      - cmid
      - name
      - duedate
    AssignConfig:
      type: object
      properties:
        plugin:
          type: string
          description: file、onlinetext、comments 或反馈插件名。
        subtype:
          type: string
          description: assignsubmission 是提交插件，assignfeedback 是反馈插件。
        name:
          type: string
          description: 例如 enabled、maxfilesubmissions、maxsubmissionsizebytes、filetypeslist、wordlimit、wordlimitenabled。
        value:
          type: string
          description: 字符串原值；filetypeslist 为空表示不限类型。
      additionalProperties: true
      required:
      - plugin
      - subtype
      - name
      - value
    Submission:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: Moodle 提交状态原值；已实测 new 和 submitted，不把未知新值映射为 submitted。
        attemptnumber:
          type: integer
          format: int64
        latest:
          type: integer
          format: int64
          description: 1 表示最新一次尝试。
        timecreated:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。
        timemodified:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒；0 通常表示未设置。撤回提交不更新它。
        timestarted:
          type: integer
          format: int64
          description: 计时作业开始计时的时间；撤回提交不清除它。
        plugins:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: file、onlinetext 或 comments。
              name:
                type: string
              fileareas:
                type: array
                items:
                  type: object
                  properties:
                    area:
                      type: string
                      description: 文件提交为 submission_files，在线文本的嵌入文件为 submissions_onlinetext。
