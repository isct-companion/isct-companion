  - id: DESKTOP-SCHOOL-LOAD-FAILURE
    area: desktop
    title: A campus-only page opens on VPN and explains itself without it
    persona: undergraduate-senior
    preconditions: |
      macOS desktop build of this commit, signed in to the Tokyo Tech
      Portal; the campus VPN available to switch on and off; once, a campus
      Wi-Fi that gives the Mac no IPv4 address (System Settings › Wi-Fi ›
      Details › TCP/IP shows only IPv6 and an IPv4 of 192.0.0.2).
    steps:
      - action: |
          With the VPN off, open 「Education Computer Systems」 from the
          Portal's resource list.
        reason: |
          The host resolves only inside the campus network. WebKit shows
          nothing when a load fails and stays on the old page, so without a
          reported failure the link looks broken.
      - action: |
          Switch the VPN on and press Retry in the notice.
        reason: |
          Retry must load the same address; the page opening proves the
          notice kept it.
      - action: |
          On the IPv6-only campus Wi-Fi with no VPN, open the same link.
        reason: |
          Its only address is a private IPv4 one, which macOS's IPv6-only
          translation does not carry, and WebKit reports "not connected"
          though the network works. The host reads the system's network path
          to tell this from being offline; 「没有网络连接」 here means it
          did not.
    observe: |
      The line under the address after each click, and the web pane.
    expected: |
      Off VPN, a notice says the server was not found or could not be
      reached, naming off-campus without VPN and IPv6-only Wi-Fi, with Retry
      and Open in browser. On VPN, Retry opens the page and the notice goes.
      On the IPv6-only Wi-Fi the popup shows the could-not-be-reached
      notice, never the offline one.
    why_manual: |
      Needs the campus network and a real failed load inside WebKit; the
      notice is a glance. Which failures are shown is Core's and tested there.
    covers:
      - apps/desktop/src-tauri/src/school_webkit.rs
      - apps/desktop/src/pages/web/WebPage.tsx
    verified: null

