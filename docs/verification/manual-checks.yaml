    steps:
      - action: |
          Click the course finder once, then keep typing a course name
          (e.g. ウェルネス, then more words) for about a minute without
          touching the mouse, so several 教務Web searches run in between.
        reason: |
          Every search loads 教務Web pages in a hidden view, and those pages
