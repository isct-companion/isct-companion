  - id: IOS-ICLOUD-BACKUP
    area: cloud
    title: iPhone and Mac load each other's data through one iCloud record
    persona: careless-multidevice
    preconditions: |
      The released (Developer ID) Mac app and the iPhone app, both signed with
      the team that owns `iCloud.app.isctcompanion`, on one Apple Account. Both
      builds carry the Production container environment, so both read the same
      CloudKit database; `codesign -d --entitlements - <app>` on each shows it.
    steps:
      - action: |
          On the Mac, Settings → Backup: turn on iCloud and Upload. On the
          iPhone, 設定 › バックアップ: turn on iCloud and Pull.
        reason: |
          The phone must load the Mac's weekly events, notes and hidden assignments.
          Nothing arriving usually means the two builds use different CloudKit
          environments or containers, not a merge bug.
      - action: |
          On the iPhone hide an assignment and Upload; on the Mac Pull.
        reason: |
          The reverse direction goes through the phone's CloudKitStore write;
          a refused or partial write shows as an iCloud error on the phone.
      - action: |
          Without pulling first, edit a different record on each device, then
          Upload on both.
        reason: |
          The second upload must lose CloudKit's conditional save, re-read and
          merge. Losing either edit means a write replaced a record it had not
          read.
      - action: |
          Turn on Sync automatically on both. Add a weekly event on the Mac and Upload,
          then force-quit the iPhone app and open it again without pressing
          Pull.
        reason: |
          Automatic mode pulls at launch and when the app comes to the front; a
          phone that is only read never uploads, so this is the only way it
          sees the Mac's edits. The weekly event missing after the relaunch means the
          launch pull did not run or read another database.
      - action: |
          Sign out of iCloud on the iPhone (Settings › Apple Account), reopen
          バックアップ, then sign back in.
        reason: |
          The provider line must name the reason under the generic failure
          text. Only the generic text means the error is being hidden again,
          which is what made sync failures impossible to tell apart.
      - action: |
          On the iPhone, open 以前のバージョン and restore one. Before the Mac
          pulls, add a weekly event on the Mac. Then export a backup file on the
          Mac and import it on the phone with 読み込む….
        reason: |
          Restore and import are written as the newest edit and uploaded at
          once. The Mac must show the restored records after its next Pull and
          keep the weekly event it added meanwhile; losing that event means the
          restore replaced the Mac's data wholesale.
    observe: |
      The Backup pages on both devices (provider line, versions) and the
      records themselves on each.
    expected: |
      Each device shows the other's changes after a Pull, and the phone after a
      relaunch in automatic mode; both concurrent edits survive, a failure names
      its reason, the version list names both devices, and a restore or import
      on the phone reaches the Mac without removing the Mac's own new event.
    why_manual: |
      CloudKit needs a signed build, an iCloud account and a device; the
      merge, tag-conditional write and journal behind it are covered by
      `sessions_sharing_one_cloud_record_load_each_others_data` and
      `tagged_writes_carry_the_tag_read_with_the_expected_revision`.
    covers:
      - apps/ios/IsctCompanion/Core/CloudKitStore.swift
      - apps/ios/IsctCompanion/Features/Settings/BackupScreen.swift
      - apps/desktop/src-tauri/src/icloud.rs
      - apps/desktop/src-tauri/Entitlements.plist
      - apps/desktop/src/pages/settings/BackupSettings.tsx
    verified: null

