  - id: ANDROID-TIMETABLE-WEEK-AND-MARKS
    area: native
    title: Android timetable fits Core's axis, picks weeks, marks sessions and exports the quarter
    persona: undergraduate-first-term
    preconditions: |
      The Android app with the current quarter pulled, opened on a weekday
      between the first period's start and the last period's end (Tokyo time).
    steps:
      - action: |
          Open 時間割 and look at the grid without scrolling.
        reason: |
          Rows come from Core's timetable axis and share the height the screen
          leaves, so the whole week fits; the lunch band is shaded and half a
          row. A grid that scrolls or a full-height lunch row means the shell
          still uses its own period table.
      - action: |
          Tap the week chip, step a year back and forward, tap a quarter chip,
          then a week row.
        reason: |
          The sheet lists Core's TimetableYear weeks under their months with
          each week's quarter label; a quarter chip jumps to that quarter's
          first week. A week that lands elsewhere means the jump target is
          wrong.
      - action: |
          Long press a class and choose 試験にする, then 休講にする, then
          通常の授業に戻す, reopening the menu each time.
        reason: |
          Each choice is Core's MarkSession and must redraw at once: a warn
          border with 試験 before the room, then a faded struck-through title
          with 休講, then the plain block; the tick follows the state. Planned
          blocks offer no menu.
      - action: Look at today's column during a teaching hour.
        reason: |
