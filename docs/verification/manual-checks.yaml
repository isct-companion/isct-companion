  - id: SETTINGS-RESET
    area: desktop
    title: Clear school caches and resync, and Full reset, from Settings → Backup
    persona: careless-multidevice
    preconditions: |
      The desktop app signed in to Science Tokyo with saved credentials, school
      data synced (Today, assignments, 教務Web grades, course search all
