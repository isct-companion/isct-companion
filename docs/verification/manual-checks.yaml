      - apps/ios/IsctCompanion/Core/SchoolBrowserHost.swift
      - apps/android/app/src/main/java/app/isctcompanion/core/SchoolBrowserHost.kt
    verified: null

  - id: SCHOOL-WEB-SIGN-OUT-ONE-ACCOUNT
    area: school
    title: Signing one account out clears every school web sign-in, and the other account signs in again
    persona: careless-multidevice
    preconditions: |
      A macOS desktop build, an Android build and an iPhone build from this
      source, and a Windows build when one is at hand, each with both school
      accounts connected and the LMS and 教務Web each opened once in the Web
      page.
    steps:
      - action: |
          On the desktop, visit the LMS inside the syllabus view before deleting
          the Science Tokyo credentials. Check that this view also closes, then
          open the LMS and 教務Web again from the Web page.
        reason: |
          A public view shares the school cookie store and can display private
          course content. It must close during sign-out. The LMS must
          show its sign-in page. 教務Web must open signed in without a
          password prompt, because Core writes the Tokyo Tech identity into
          its new view before the first page; a 教務Web sign-in page means
          the remaining account's identity was not written back after the
          clear.
      - action: |
          On the Windows build, do the same.
        reason: |
          Windows clears the school views' own WebView2 profile whole, not
          only its cookies: the LMS shows its sign-in page, and 教務Web opens
          signed in again without a prompt. An error under the account card
          saying the sign-out did not finish means WebView2 refused the
          clear.
      - action: |
          On the iPhone, delete the Science Tokyo credentials in Settings,
          then open the LMS and 教務Web in the Web tab.
        reason: |
          iOS used to clear one account's sites only; it must now behave as
          the desktop does: the LMS signed out, 教務Web signed in again
          without a prompt.
      - action: |
          On Android, delete the Science Tokyo credentials, read Settings ›
          School accounts, then open the LMS and 教務Web in the Web tab.
        reason: |
          The sign-out is the clear: no card offering to clear every school
          web sign-in may remain. The LMS shows its sign-in page and 教務Web
          opens signed in again without a prompt.
      - action: |
          Quit the Android app (swipe it away), reopen it and open the LMS.
        reason: |
          The LMS still shows its sign-in page: the clear reached the
          WebView's store on disk, not only its memory.
    observe: |
      The LMS and 教務Web views on each device, and Settings › School
      accounts on Android.
    expected: |
      On every device the LMS is signed out after the sign-out and stays so
      after a relaunch, 教務Web opens signed in without a password prompt,
      and Android's Settings shows no separate clear button.
    why_manual: |
      Needs each platform's real website data store and the real school
      cookies' domains. The Core suites cover the order (views stopped, one
      clear of every school site) and that the remaining account's identity
      is written again on its next page; the platform stores are not
      reachable from them.
    covers:
      - crates/app-core/src/school_session/web.rs
      - apps/desktop/src-tauri/src/school_cookies.rs
      - apps/android/app/src/main/java/app/isctcompanion/core/WebCookieSeed.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/settings/SettingsScreen.kt
      - apps/ios/IsctCompanion/Core/WebCookieSeed.swift
    verified: null

  - id: DESKTOP-SCHOOL-COOKIES-WINDOWS
    area: desktop
    title: Windows school views receive Core's identity cookies
    persona: windows-snap-user
    preconditions: |
      A Windows build from this source with both school accounts signed in
      from Settings, and no school page opened since launch.
    steps:
      - action: |
          Open 教務Web from the site list.
        reason: |
          `AUTH_SESSION_ID` is a `Domain=.titech.ac.jp` cookie. WebView2's
          `CreateCookie` takes the domain without its leading dot as
          host-only; the writer restores the dot. The agreement page or the
          portal's resource menu means the cookie stayed host-only.
      - action: |
          Open the LMS from the site list.
        reason: |
          The Extic identity is host-only on `isct.ex-tic.com`; the LMS must
          finish its SAML hand-off from it without the sign-in page.
      - action: |
          With the LMS shown (教務Web opened before it and now hidden), click
          into the LMS search field, type a word and press Tab.
        reason: |
          A hidden WebView2 must neither take keyboard focus nor swallow
          keys; typing that lands nowhere, or focus jumping to an invisible
          page, means the earlier view still holds focus.
      - action: |
          Copy the log in Settings → Diagnostics.
        reason: |
          A failed write is logged as `web cookies not written`; a write that
          landed and still did not sign in points at cookie scope instead.
    observe: |
      The two school pages and the copied log.
    expected: |
      Both pages open signed in, typing reaches the LMS field, and the log has
      no `web cookies not written` for the opened views.
    why_manual: |
      Needs WebView2's cookie manager on a real Windows PC and live school
      sessions; no headless WebView2 runs here, and the macOS proof does not
      carry over to another engine.
    covers:
      - apps/desktop/src-tauri/src/school_cookies.rs
      - apps/desktop/src-tauri/src/school_windows.rs
    verified: null


  - id: IOS-CREDENTIAL-SOURCE-TILES
    area: native
    title: iPhone second-factor sources are one row of equal tiles
    persona: undergraduate-first-term
    preconditions: |
      The iPhone app on a physical iPhone (camera and Matrix OCR available),
      with 設定 → 一般 → 画面表示と明るさ → テキストサイズ at the largest
      non-accessibility step.
    steps:
      - action: |
          Open 設定 → 学校アカウント → Tokyo Tech (旧) and look at the マトリクス表
          row: 自動認識, 画像をアップロード, 貼り付け, 入力.
        reason: |
          Four sources is the widest row. The old bordered buttons sized to
          their labels, so large text wrapped them vertically and left the
          paste button a different shape from the rest.
      - action: |
          Open Science Tokyo with no OTP saved. The ワンタイムパスワード section
          is a two-way choice: 認証アプリから shows QR を読み取る and 写真から,
          設定リンク・秘密鍵 shows the field and 貼り付け. With an OTP saved it
          is one line with a tick and 変更, then a row of 認証アプリに追加 and
          設定をコピー.
        reason: |
          The longest label lives under 認証アプリから; it must shrink on one
          line rather than widen its tile. The saved line replaces a field
          people mistook for a place to type the six-digit code.
      - action: |
          Copy any text, tap 貼り付け in either row and answer the system paste
          prompt.
        reason: |
          The tile reads the clipboard itself instead of using PasteButton, so
          iOS asks once per paste unless the app is allowed in Settings.
      - action: |
          Tap 画像をアップロード: the system menu offers 撮影 and ライブラリから選択.
          Take a photo of the card with 撮影; then copy a card photo in Photos
          and tap the Matrix row's 貼り付け.
        reason: |
          撮影 is the system camera, not ours; a pasted image is read like a
          photo, pasted text must be the 70 letters.
      - action: |
          Tap 自動認識, hold the card in the guide about 10 cm from the lens,
          then tap the card where it looks soft.
        reason: |
          The preview fills the screen and is the live camera, not the analysed
          frames, so it never stutters or shows black bars, and the red outline
          lands on the card despite the crop. On a multi-camera iPhone the
          device leaves the wide camera for the ultra wide when the card is too
          close to focus, as the system camera does; the tap shows the yellow
