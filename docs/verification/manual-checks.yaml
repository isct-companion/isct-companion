      - apps/desktop/src-tauri/src/commands/matrix_camera.rs
      - apps/desktop/src-tauri/Info.plist
      - apps/desktop/src-tauri/Entitlements.plist
    verified:
      version: 1.0.0-rc.1
      date: 2026-10-14
      commit: 7fdf1b6
      by: human
      result: pass
      notes: 67 expected cells recognised, no wrong accepted cells; private image not
        committed.
      evidence: docs/verification/core-consolidation.md#automated-acceptance

  - id: OCR-CAMERA-GEOMETRY
    area: ocr
    title: Camera outline follows the card on the frame it was fitted on
    persona: undergraduate-first-term
    preconditions: |
      A debug or optimized desktop build with OCR on an Apple Silicon Mac or a
      supported Windows PC, a built-in or USB camera, and a disposable or own
      Matrix card. For the recording step, a new empty local directory.
    steps:
      - action: |
          Open Scan with camera and bring the card into view, then move it
          steadily across the frame, tilt it about 30 degrees and turn it
          upside down. Watch the red outline against the printed grid.
        reason: |
          The picture shown is the analysed frame and the outline is fitted on
          that same frame. A lag here would show the outline trailing the card;
          an indexing error would put it one row or column off the A-J / 1-7
          labels, or outline a mirrored grid after the card is turned.
      - action: |
          Hold the card still, then move it away until it is lost and bring it
          back. Also cover the J column with a finger and partly shadow it.
        reason: |
          Tracking must hand over to detection when the grid is lost and pick
          it up again within about half a second; a partly covered edge must
          not produce an outline squeezed onto the visible columns.
      - action: |
          Close the session and open matrix-scan/latest.json. Check that
          core.frames lists every analysed frame (located or not), that
          capture.timeline pairs each frameId with boundsFrameId equal to it
          and paintedMediaMs equal to mediaMs, and that core.keyframes is
          several per second of steady framing.
        reason: |
          The report separates processing rate (frames per second analysed),
          localisation rate (located / analysed) and draw latency (painted -
          captured); a mismatch between boundsFrameId and frameId would mean an
          old outline was drawn over a newer picture.
      - action: |
          Launch a debug build with ISCT_MATRIX_RECORD_DIR set to the empty
          directory, scan once, then run
          `cargo run -p app-ocr --release --features training-tools --example matrix_track_replay -- DIR/SESSION`
          and `python scripts/ocr/matrix_track_report.py --frames DIR/SESSION --trace app=trace.jsonl --live LATEST_JSON --out REPORT`.
        reason: |
          The recorded planes replay through the same tracker offline, so a
          live problem can be reproduced, overlaid stage by stage and compared
          with the in-app timeline.
    observe: |
      The camera dialog's picture and red outline, matrix-scan/latest.json
      under the app cache, and the replay report's summary.json and overlays.
    expected: |
      The outline sits on the grid edges of the card in the picture it is drawn
      on, with the A1 corner at the A/1 labels in every orientation; it follows
      motion at the camera's frame rate without trailing, disappears when the
      grid is lost and returns within about half a second. latest.json shows
      every timeline entry's boundsFrameId equal to its frameId when located,
      and the replay reproduces the session's located frames.
    why_manual: |
      Camera latency, WebView canvas compositing and how the outline looks on a
      moving physical card need a camera and the native app; the geometry and
      tracker themselves are covered by the app-ocr tests and replays.
    covers:
      - crates/app-ocr/src/engine/grid/**
      - crates/app-ocr/src/engine/vendor/**
      - apps/desktop/src/platform/matrix-camera.ts
      - apps/desktop/src/components/MatrixCamera.tsx
      - apps/desktop/src-tauri/src/commands/matrix_camera.rs

  - id: DESKTOP-SCHOOL-WEBVIEW
    area: desktop
    title: School WebView browsing, history and download hand-off
    persona: undergraduate-senior
    preconditions: |
      A Signed in account; at least one course with downloadable material.
    steps:
      - action: |
          Open each school site from the site list and follow an in-page link,
          then a link on the Tokyo Tech Portal's resource menu to a service
          that is not one of the app's sites.
        reason: |
          The person may browse any HTTPS page; only hidden work is kept to
          the adapter sites. A link that does nothing, or a site opening in
          another site's view, means the rule table or the site mapping is
          wrong.
      - action: |
          On Science Tokyo Portal, open Password Change, then click Science
          Tokyo Portal in the site list again. Repeat on 教務Web and LMS.
        reason: |
          Choosing the site already shown must load its start page, not only
          rewrite the address bar while the view stays on the old page.
      - action: |
          Go Back and Forward with the app's buttons across a page reached by
          a 教務Web postback (a 学期 or page switch on the 成績 list).
        reason: |
          Back and Forward are WebKit's own history now. A page served from
          the cache must come back as it was; one WebKit would fetch again
          with its form must be skipped, not resent.
      - action: |
          Download a material and choose Show in Finder / Show in Explorer.
        reason: |
          The file lands in Downloads through the native layer; only the OS
          reveal proves the hand-off, not the download counter.
      - action: |
          On macOS, open an LMS assignment's file draft area and drag a small
          local file from Finder into it, without submitting the assignment.
          Do the same on the edit page opened in a popup (⌘-click its Add
          submission or Edit submission button). Switch between the Web page
          and the Lectures reader, let a background school read finish,
          resize the window, then repeat both drags and remove the draft
          files. Do not restart between attempts.
        reason: |
          The main Tauri view and hidden school views must leave native file
          drag events to the visible WKWebView. A popup used to be a subview
          of the LMS view, and WKWebView answers AppKit's drag hit test with
          itself without looking at its subviews, so a file dropped on the
          popup went to the page underneath. Popups are siblings of their
          view now, kept at its frame and visibility by the host; switching
          surfaces and resizing move and hide them, and the application log
          shows "drag entered site=ScienceLms popup" when the popup gets the
          drag. Repeating after view changes also exercises the intermittent
          loss of drag delivery reported on macOS.
      - action: |
          On macOS, quit and start the app, open 教務Web first, then the LMS,
          and drag a small file into the assignment's draft area. Remove the
          draft file afterwards.
        reason: |
          School views are created when first opened, so one opened later
          sits above the earlier ones. A hidden WKWebView still answers the
          drag hit test with itself; the hidden 教務Web view used to take the
          file and the log showed `denied site=Kyomu reason=Scheme
          url=file://`. Hidden views and popups now answer that they are not
          the target.
      - action: |
          On macOS, in the same draft area, press the file picker's upload
          button (Moodle: Add → Upload a file → Choose File) and choose one
          small file; open it again and press Cancel. If a page's file input
          takes several files, select two there.
        reason: |
          The app's own WebKit delegate now answers every file input; wry's
          is no longer reached. One file, several, and Cancel are the three
          answers WebKit can get, and each must reach the page exactly once:
          a lost answer leaves the input dead until the page reloads.
      - action: |
          Open the assignment's edit page in a popup (⌘-click its Add
          submission or Edit submission button; or open a page with a file
          input from a link that opens a new window) and Choose File there.
        reason: |
          A popup is a WKWebView of the app's own with no wry delegate under
          it, so before this change macOS WebKit treated its file input as
          Cancel and nothing happened. The popup must open the same panel as
          the main view.
      - action: |
          Open the file panel again and, with it open, quit the app with ⌘Q.
          Start the app again and open the same page.
        reason: |
          When the view goes away the host must end the panel and answer
          Cancel itself; WebKit requires the answer, and a panel left
          waiting would block quitting or crash on a page that no longer
          exists.
    observe: |
      The WebView address and page body, the 成績 list after Back and
      Forward, the download list, the OS file manager, the file panel as a
      sheet on the app window, and the draft area's file list.
    expected: |
      Every link opens in the site's own view, choosing the shown site again
      loads its start page, Back and Forward move through
      the pages without the 教務Web error page or a resent form, and the OS
      reveals the saved file. On macOS the LMS draft area accepts Finder
      files, in the main view and in a popup, before and after switching
      surfaces and resizing the window, without restarting the app; the
      popup stays exactly over the page and hides with it. The
      file panel opens as a sheet in the main view and in a popup; a chosen
      file (or two, where allowed) appears in the input, Cancel leaves it
      empty and the input works again, and quitting with the panel open
      quits cleanly, after which the page opens normally.
    why_manual: |
      Depends on the platform WebView, its history, the OS file manager and
      the system file panel. The rule table is Core's and tested there;
      jsdom cannot produce native navigation, history, a reveal or an
      NSOpenPanel. The panel's teardown when a page closes its own popup
      while the panel is open cannot be triggered by hand; it rests on the
      answer-once guard, which answers Cancel when dropped.
    covers:
      - crates/app-core/src/school_browser/engine.rs
      - apps/desktop/src-tauri/src/school_web.rs
      - apps/desktop/src-tauri/src/school_webkit.rs
      - apps/desktop/src-tauri/src/school_browser_native.rs
