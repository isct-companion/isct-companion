  - id: OCR-CAMPUS-CARD
    area: ocr
    title: Campus-card OCR on a physical card
    persona: undergraduate-first-term
    preconditions: |
      The desktop app, a physical campus card, and a camera or a photo of the
      card. For the phone steps: a TestFlight build
      on an iPhone and a CI-built APK on an arm64 Android phone.
    steps:
      - action: |
          Open the matrix OCR flow and supply a photo of a real card.
        reason: |
          Synthetic tensors and the frozen filter fixture cover the pipeline
          stage by stage; a real card is what exposes lighting, angle and
          printing variation that no fixture reproduces.
      - action: |
          Open Scan with camera in a packaged desktop app, allow camera access,
          and bring the real card toward the camera. Check that one red outline
          follows the Matrix, with no cell boxes or letter overlays. Move the
          card, introduce glare, then briefly hold it steady with labels visible.
          Observe per-cell recognition progress while the camera remains live.
          Recognition and acquisition must overlap. The camera stops after all
          cells pass a fresh confirmation sweep, or ten seconds after starting
          the session, including time without a detected Matrix. Confirmed cells
          must reopen when a clear new observation contradicts them.
          On completion the dialog closes and the camera indicator turns off;
          insufficient votes must be highlighted for review.
          Repeat with the card rotated 90, 180 and 270 degrees. Each orientation
          must keep the same cell order. If processing produces no readable
          letters, it must show a retryable error without reopening the stopped
          camera or returning to a 70/70 capture loop.
          Inspect matrix-scan/latest.json under the app cache for elapsed session
          time and overlapping OCR busy time, per-cell candidate and qualified-vote
          counts. Use an optimized build and move the framed card continuously:
          the red outline must update at least 15 times per second (30 preferred).
          Check frameMs and frames/elapsedMs alongside the visible tracking;
          a smoothly interpolated stale outline does not count as a new detection.
          Compare all 70 letters with the real card, including Q tails near row
          boundaries. Repeat under warm and cool lighting and with faint row
          colors; weak color contrast must still allow luminance localization.
        reason: |
          OS camera permissions, native WebView video capture, optical focus,
          and the alignment of recognition boxes over a physical card require
          real hardware. Scripted frames cannot validate these surfaces.
      - action: |
          Start fresh camera sessions with a readable card under backlighting,
          uneven shadow and a moving reflection. Confirm the first red outline
          appears and acquisition starts. Move the card slightly so the reflection
          leaves each cell; unobscured cells must retain their progress. Hold a
          bright reflection over the same letters until the deadline and check
          that erased strokes remain marked for review rather than accepted.
          Include a white card background and modest hand movement, then shake
          the card for two seconds before holding it steady; the session must
          still finish within ten seconds of starting.
          After closing each session, inspect core.keyframes,
          core.admissionRejections, core.blurRejections and core.glareRejections
          in matrix-scan/latest.json (blurRejections must count the shaken
          frames), then compare all accepted letters with the card.
        reason: |
          Real camera exposure, sensor noise, motion blur and specular
          reflections can differ from synthetic lighting and recordings.
          Hardware is needed to check initial admission, that smeared frames are
          dropped rather than read, false glare on white paper and recovery as a
          reflection moves.
      - action: |
          Cancel and reopen the camera, then background the app during capture.
          Repeat and background it during processing: acquisition stops in the
          former case, but the latter may finish without reopening the camera.
          Cancel processing and confirm late results do not overwrite the editor.
          Deny permission on a fresh permission state and retry after granting it.
        reason: |
          Verify the camera indicator switches off and permissions can recover
          in the signed native app; headless tests cannot observe OS resource
          release or the native privacy prompt.
      - action: |
          On the iPhone, open Settings → school account → Matrix card, choose
          Auto scan and allow camera access. The live preview fills the screen
          with a card-shaped guide; hold the real card in it. The red outline
          must sit on the card (it may follow a moving card slightly, as it is
          fitted on the last analysed frame), a tap focuses where tapped, and
          the 7×10 grid at the bottom must fill in while the camera is still
          live. On completion the screen closes, the camera indicator turns off
          and the editor shows every cell tinted by confidence. Repeat with the
          phone in landscape and with the card upside down: the cell order
          must not change. Then import a photo of the same card with Upload
          image and compare both grids cell by cell. Repeat all of this on the
          Android phone.
        reason: |
          AVFoundation and CameraX capture, sensor rotation, the phone's optics
          and the camera privacy indicator only exist on a signed app on real
          hardware. Core tests drive the same session with scripted and decoded
          frames (photo and YUV agree on one image); the native camera hand-off
          and the drawn outline need a phone.
      - action: |
          On each phone, background the app during a camera scan and return;
          the scan must have stopped with a message and Auto scan must
          start a fresh one. Revoke camera permission in system settings, then
          choose Auto scan: the denial message shows, and Upload image and
          Paste still work.
        reason: |
          The OS permission prompt, lifecycle interruption and camera release
          cannot be produced in headless tests.
      - action: |
          Review the recognised cells and compare them with the card.
        reason: |
          The contract is "no wrong accepted cell", not "most cells right". A
          misread cell that is accepted is worse than a rejected one, so the
          comparison has to be cell by cell.
      - action: |
          Correct a cell and save.
        reason: |
          Confirms the manual correction path, which the fixtures never take.
    observe: |
      The recognised cell grid beside the physical card, and the saved values.
    expected: |
      Every expected cell is recognised, no wrong cell is accepted, and the
      corrected values are what get saved.
    why_manual: |
      Needs a physical card and a camera. The phone steps need signed iOS and
      Android builds with camera hardware.
    covers:
      - crates/app-ffi/src/matrix.rs
      - crates/app-ffi/src/services.rs
      - apps/ios/IsctCompanion/Features/Settings/MatrixCamera.swift
      - apps/ios/IsctCompanion/Features/Settings/CredentialImport.swift
      - apps/android/app/src/main/java/app/isctcompanion/features/settings/MatrixCamera.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/settings/CredentialImport.kt
      - apps/android/app/src/main/AndroidManifest.xml
      - apps/desktop/src-tauri/src/commands/platform.rs
      - crates/app-ocr/**
      - apps/desktop/src/lib/matrix-ocr.ts
      - crates/app-core/src/matrix_scan.rs
      - crates/app-core/src/matrix_scan/**
      - apps/desktop/src/platform/matrix-camera.ts
      - apps/desktop/src/components/MatrixCamera.tsx
      - apps/desktop/src/components/matrix-camera.css
      - apps/desktop/src/pages/settings/SchoolAccounts.tsx
