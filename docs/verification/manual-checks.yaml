  - id: DESKTOP-SIGNED-UPDATES
    area: desktop
    title: Signed macOS updates preserve the existing workspace
    persona: undergraduate-senior
    preconditions: |
      An installed Developer-ID-signed macOS update-enabled bundle, a newer
      version signed with the configured updater key, and a rollback copy of
      the app and its data. A debug build may use the strictly loopback fixture
      origin; release builds always use the source repository.
    steps:
      - action: Detect an update, download a tampered copy, then retry with the valid
          signed bundle.
        reason: The real native updater must reject modified bytes before permitting
          installation; fixtures alone do not exercise the packaged app and key.
      - action: Enable automatic updates, quit through the app menu or Cmd-Q, and
          reopen.
        reason: Cocoa's predefined Quit can bypass ExitRequested; the native menu must
          enter owned shutdown before installing verified bytes.
      - action: Compare the installed version, login state, saved settings, timetable
          and course records with the rollback copy.
        reason: A real bundle replacement must preserve the same app-data and Keychain
          access; an isolated parser test cannot verify that.
    observe: Settings > About, the application bundle version,
      updater-install-result.json in app data, and the retained workspace.
    expected: |
      Tampered content is rejected, the valid bundle installs through Cmd-Q,
      the new version reopens and saved data and login credentials remain.
      A source repository with no stable release is reported as unpublished.
    why_manual: Requires Developer ID signing, real macOS menu dispatch, Keychain
      access and native app-bundle replacement.
    covers:
      - apps/desktop/src-tauri/src/desktop_updates.rs
      - apps/desktop/src-tauri/src/lib.rs
      - apps/desktop/src-tauri/tauri.conf.json
    verified:
      version: 1.0.1-dev.1
      date: 2026-10-16
      commit: af4f026b552d2e36e830966df9b74dad96eb8fb2
      by: agent
      result: pass
      notes: Developer-ID-signed local 1.0.0 to 1.0.1-dev.1; tampered archive
        rejected; Cmd-Q automatic install and reopen succeeded; original IDs,
        settings and both logins retained.
      evidence: docs/verification/desktop-updater.md

