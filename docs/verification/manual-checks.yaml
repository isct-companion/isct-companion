  - id: DESKTOP-FINDER-IME-KANA
    area: desktop
    title: Kana composition searches once it is confirmed (macOS WebKit)
    persona: undergraduate-first-term
    preconditions: |
      A macOS desktop build started with ISCT_TRACE_READS=1 from a terminal,
      the Japanese input method on, the year's catalog stored.
    steps:
      - action: |
          In the course search type ぶつり and convert it to 物理 without
          confirming, watching the terminal.
        reason: |
          Each search prints one [native-data] line whose op names
          finder_query. Lines while the text is still underlined mean every
          keystroke of the composition was searched, which stalls typing.
      - action: |
          Confirm the conversion with Enter.
        reason: |
          The confirming Enter belongs to the IME: exactly one search must
          follow with 物理, and no condition pill may appear.
    observe: |
      The terminal's [native-data] finder_query lines and the results count.
    expected: |
      No search while composing, one search after confirming, results for
      物理 and no new pill.
    why_manual: |
      Real IME event order differs between WebKit and WebView2 and a DOM
      test can only replay one order; this needs the real input method.
    covers:
      - apps/desktop/src/pages/courses/CourseFinder.tsx
      - apps/desktop/src/pages/courses/useFinder.ts
    verified: null

