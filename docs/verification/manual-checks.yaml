# Manual acceptance checks.
#
# Source of truth for the behaviour CI cannot reach: real school credentials,
# provider consent screens, signed bundles, hardware and the native shells.
# These checks are written to be executed by a person or by an agent driving
# the real GUI (computer use). `docs/verification/manual-acceptance.md` is
# rendered from this file.
#
#   yarn verify:manual render            regenerate the rendered table
#   yarn verify:manual validate          check this file's structure
#   yarn verify:manual stale             which checks a pending change invalidates
#   yarn verify:manual sheet <ID>        a run sheet for one check and its persona
#   yarn verify:manual record <ID> ...   record a result
#
# Rules that keep this file honest:
#
# 1. Every step states its `reason`. A step without a reason is either
#    redundant or its author did not know what it was looking for; the check is
#    rejected. The reason names the failure the step would expose, so a
#    transcript can be reviewed for understanding rather than compliance.
# 2. Every check names a `persona` and says where to `observe` the result.
#    Behaviour is only meaningful relative to who is using the app, and a
#    result nobody can point at is not evidence.
# 3. Every check justifies itself in `why_manual`. If the flow could be driven
#    from `tests/`, it belongs there instead: a check whose `covers` paths are
#    all already exercised by automated suites is rejected.
# 4. `result` is `pass`, `fail` or `unreached`. `unreached` is for a flow that
#    could not be attempted at all (no account, no device); it is recorded with
#    `blocked_by` rather than left blank, because a silently missing row is how
#    an unverified area becomes an assumed-good one.
#
# Evidence: every recorded result points at something a reviewer can open — a
# transcript, screenshots or a note under the ignored `artifacts/` directory.
#
# 医歯学系 (Dream Campus, Web Class) is deliberately outside this file. Those
# hosts are allowlisted so a school page can hand off to them, but there is no
# adapter, no site mapping and no account, so nothing about them is verified.
# The allowlist entry itself is pinned by
# `apps/desktop/tests/unit/school-sites.test.ts`.

version: 1

# ---------------------------------------------------------------------------
# Personas
#
# A persona fixes the identity, the language, the device and the habits of the
# simulated user. An agent running a check adopts the persona entirely: it
# knows only what that person would know, reads only what that person could
# read, and makes that person's mistakes. The identity personas follow the
# study stages the app itself models, because the eligibility rules differ by
# stage and those rules are what most of these checks are about.
# ---------------------------------------------------------------------------

personas:
  - id: undergraduate-first-term
    label: 理工学系 1年生・初学期
    identity: undergraduate
    context: |
      First quarter of the first year. Has never used this app; signed in once
      during orientation and does not remember which systems exist. Japanese
      UI and Japanese school content. Uses a trackpad, not the keyboard.
    behaviour: |
      Reads every label before clicking. Tries to add a course that is
      obviously above their year. Expects the app to explain refusals rather
      than only disabling a control. Abandons a flow that offers no obvious
      next step.
    language: ja
    device: macos-arm64

  - id: undergraduate-senior
    label: 理工学系 3年生・履修計画期
    identity: undergraduate
    context: |
      Third year, planning next quarter. Knows the syllabus site and the
      timetable well. Japanese UI, mixes Japanese and English course content.
      Works fast and expects the keyboard to work.
    behaviour: |
      Types course codes from memory instead of browsing. Opens details in
      quick succession. Adds a course that clashes with an existing one and
      expects to be told which one. Uses Undo immediately after a mistake.
    language: ja
    device: macos-arm64

  - id: masters-student
    label: 修士課程 1年・前期課程
    identity: masters
    context: |
      First year of a master's programme, first semester. Has an undergraduate
      record from the same institution that is already in the workspace.
      Japanese UI. Cares about credit requirements and about 500-level rules.
    behaviour: |
      Checks the grade and GPA panels first. Looks for requirements that apply
      only after the first semester. Notices when an undergraduate-only count
      or table is assumed.
    language: ja
    device: macos-arm64

  - id: doctoral-student
    label: 博士後期課程
    identity: doctoral
    context: |
      Doctoral programme, several years in. Reads the app mostly for research
      scheduling and for the few courses that require doctoral registration.
      Japanese UI.
    behaviour: |
      Ignores the timetable and goes straight to the requirement and
      registration panels. Expects doctoral-specific approval rules to be
      stated rather than silently enforced.
    language: ja
    device: macos-arm64

  - id: transfer-student
    label: 編入生
    identity: transfer
    context: |
      Transferred into the third year from another institution. Admission year
      differs from the cohort year of the courses being planned.
    behaviour: |
      Looks for their own admission cohort's guidance. Notices when a guide or
      requirement set from the wrong admission year is applied.
    language: ja
    device: macos-arm64

  - id: international-student
    label: International student
    identity: undergraduate
    context: |
      Reads English better than Japanese. Sets the UI to English and the
      school content to English where a translation exists. Signs in from a
      laptop on the campus network.
    behaviour: |
      Never switches to Japanese to decode a message. Reads error text
      literally. Notices untranslated strings, Japanese leaking into an
      English page, and dates that are ambiguous because the format is not
      stated.
    language: en
    device: macos-x64

  - id: careless-multidevice
    label: Two devices, interrupted work
    identity: masters
    context: |
      Uses the desktop app on two machines with cloud backup enabled. Quits
      mid-operation, sleeps the laptop, and lets the network drop.
    behaviour: |
      Closes the window while something is still running. Reopens and expects
      to see the result. Edits the same record on both machines on purpose.
    language: ja
    device: macos-arm64

  - id: narrow-window-keyboard
    label: Narrow window, keyboard only
    identity: undergraduate
    context: |
      Uses a small window on a laptop with an external monitor. Navigates by
      keyboard and never touches the mouse.
    behaviour: |
      Resizes the window until the layout changes. Uses the number shortcuts
      and Escape. Tabs through a form and expects focus to stay visible.
    language: en
    device: macos-arm64

# ---------------------------------------------------------------------------
# Checks
# ---------------------------------------------------------------------------

checks:
  - id: SCHOOL-SIGNIN-SCIENCE
    area: school
    title: Real sign-in to the Science Tokyo portal and LMS
    persona: undergraduate-first-term
    preconditions: |
      Signed desktop bundle, campus network or VPN, a live student id and the
      current OTP factor.
    steps:
      - action: |
          Cold-launch the bundle and wait for the first screen.
        reason: |
          Cold launch is where a stale keychain entry or a launch-order bug
          shows up; a warm relaunch hides both.
      - action: |
          Open Settings → Accounts and connect the Science Tokyo account.
          Enter the student id, then the OTP when asked.
        reason: |
          The identity provider is tried first by design. Asking for a
          password before the id would mean the identity-first order regressed.
      - action: |
          Wait for the badge, then open the LMS from the site list.
        reason: |
          Distinguishes "signed in" from "the session reaches the LMS". A badge
          that settles while the LMS still shows a login form is the failure
          this step exists to catch.
      - action: |
          Look over the whole screen and the logs for the student id, the
          password or any OTP value.
        reason: |
          Credential material must never be rendered. A run that passes while
          leaking a value into the UI or a log is a failure.
    observe: |
      Settings → Accounts badge; the LMS page body; the app window and any
      console output.
    expected: |
      The account reaches Signed in without a second prompt, the LMS page
      loads authenticated, and no credential material appears anywhere.
    why_manual: |
      Needs a real student id, a live OTP factor and the campus network. The
      identity provider cannot be replayed offline and the OTP window makes a
      recorded flow expire immediately.
    covers:
      - crates/isct-core/src/school_auth.rs
      - crates/isct-core/src/school_browser/engine/**
      - crates/isct-core/src/school_service.rs
    verified:
      version: 1.0.0-rc.1
      date: 2026-10-14
      commit: 7fdf1b6
      by: human
      result: pass
      notes: Recorded in docs/verification/core-consolidation.md.
      evidence: docs/verification/core-consolidation.md#live-macos-acceptance

  - id: SCHOOL-LMS-PULL
    area: school
    title: Full LMS pull against a real account
    persona: undergraduate-senior
    preconditions: |
      The account from SCHOOL-SIGNIN-SCIENCE is Signed in.
    steps:
      - action: |
          In a fresh disposable workspace, sign in and let the initial automatic
          full LMS pull finish. Then use Pull from LMS and verify it defaults
          to all courses, including quarters outside the current semester.
        reason: |
          The uninterrupted path establishes the baseline the interrupted path
          is compared against.
      - action: |
          Compare courses and assignments with the authenticated LMS. Select
          Pull current quarter only, then reopen a previously cached lecture.
          Keep reading while the later partial background refresh finishes.
        reason: |
          A pull that "succeeds" with silently dropped courses is the failure
          this step catches; matching counts alone would not.
      - action: |
          Open a visible school page in the middle of a second pull.
        reason: |
          Hidden work must yield to the visible page and resume afterwards.
          Without this step the preemption contract is only asserted by tests.
    observe: |
      The LMS page course and assignment lists, the refresh timestamp, and the
      visible school page that interrupted the second pull.
    expected: |
      The first pull matches the LMS course list and advances its timestamp;
      current-only reads the actual current quarter. Cached lecture content
      remains usable during refresh and changed content produces one quiet,
      short in-app update notice. Interrupted work retains old rows and resumes.
    why_manual: |
      Depends on the authenticated Moodle session above. The AJAX surface is
      read-only but account-scoped, so no fixture can stand in for a real
      enrolment.
    covers:
      - crates/isct-core/src/lms_ingest.rs
      - crates/isct-core/src/lms_session.rs
      - crates/isct-core/src/school_parser/lms.rs
    verified:
      version: 1.0.0-rc.1
      date: 2026-10-14
      commit: 7fdf1b6
      by: human
      result: pass
      notes: 7 matched courses, no differences.
      evidence: docs/verification/core-consolidation.md#live-macos-acceptance

  - id: IDENTITY-FIRST-YEAR-GATE
    area: identity
    title: A first-year student is refused an upper-level course with a reason
    persona: undergraduate-first-term
    preconditions: |
      A study profile with the undergraduate stage and the current admission
      year. A course placed at a level above that stage.
    steps:
      - action: |
          Open the planner and search for a course only open to later years.
        reason: |
          Establishes what the app shows before any action: a row that is
          offered at all is the precondition for testing the refusal.
      - action: |
          Try to add it, by clicking and by pasting its course code.
        reason: |
          Both paths must be gated. A refusal on one path and a silent accept
          on the other is the classic version of this bug.
      - action: |
          Read the text of the refusal.
        reason: |
          "Cannot add" with no reason is a failure for this persona: the check
          is about whether the app explains the rule, not whether it blocks.
    observe: |
      The planner result row, the add buttons and their tooltips, and the
      notification or inline message the refusal produces.
    expected: |
      Every add path is refused or disabled, and the message names the rule
      (the study stage or year the course requires) rather than only failing.
    why_manual: |
      The rule itself is unit-tested, but whether a student understands the
      refusal is a judgement about wording and placement that only a rendered
      screen can show.
    covers:
      - crates/isct-core/src/study_profile.rs
      - crates/isct-core/src/course_query/mod.rs
      - apps/desktop/src/pages/courses/**
    verified: null

  - id: IDENTITY-MASTERS-CREDITS
    area: identity
    title: Master's requirements and 500-level rules after the first semester
    persona: masters-student
    preconditions: |
      A master's study profile with an undergraduate record already imported.
    steps:
      - action: |
          Open the grades and GPA panels and compare them with 教務Web.
        reason: |
          The master's panels must not be computed from the undergraduate
          table; a plausible-looking number from the wrong table is the
          failure here.
      - action: |
          Try to register a 500-level course before and after the first
          semester boundary (or with the profile set to each state).
        reason: |
          The rule is semester-dependent, so a single-point test cannot tell
          "allowed" from "allowed too early".
      - action: |
          Open the requirement panels and read which requirements apply.
        reason: |
          Requirements that apply only to a master's student must be visible
          as such; silently omitting them is the failure the automated rules
          cannot express.
    observe: |
      The grades, GPA and requirements panels for the master's profile, and
      the registration outcome for the 500-level course.
    expected: |
      Credits and GPA come from the master's record, the 500-level rule
      applies from the correct semester, and the applicable requirements are
      named.
    why_manual: |
      Needs a real master's account so the 教務Web tables and the requirement
      set are the ones a master's student actually receives.
    covers:
      - crates/isct-core/src/study_profile.rs
      - crates/isct-core/src/kyomu_ingest.rs
      - apps/desktop/src/pages/courses/**
    verified: null

  - id: IDENTITY-DOCTORAL-RULES
    area: identity
    title: Doctoral registration and approval rules are stated
    persona: doctoral-student
    preconditions: |
      A doctoral study profile.
    steps:
      - action: |
          Open the registration and requirement panels.
        reason: |
          Doctoral students reach a different panel than master's students; a
          wrong panel means the identity is not driving the view.
      - action: |
          Attempt a course whose registration requires doctoral approval.
        reason: |
          The rule is an approval, not a hard block, so the check is whether
          the app says so rather than refusing silently.
    observe: |
      The requirement and registration panels, and the message shown for the
      approval-gated course.
    expected: |
      The doctoral-specific requirement is visible, and an approval-gated
      course explains that approval is needed.
    why_manual: |
      Needs a real doctoral account; the rule set is account-specific and the
      current fixtures do not represent it.
    covers:
      - crates/isct-core/src/study_profile.rs
      - apps/desktop/src/pages/courses/**
    verified: null

  - id: IDENTITY-TRANSFER-COHORT
    area: identity
    title: A transfer student sees their own admission cohort's guidance
    persona: transfer-student
    preconditions: |
      A transfer study profile whose admission year differs from the cohort
      year of the courses being planned.
    steps:
      - action: |
          Open the recommended-courses and guidance panel.
        reason: |
          The panel is keyed by admission cohort; the wrong key silently
          produces a plausible list from another cohort's guide.
      - action: |
          Confirm the guide PDF and the recommended list match the transfer
          admission year, not the course year.
        reason: |
          This is the exact confusion the cohort namespacing exists to
          prevent, and it is invisible without reading the guide.
      - action: |
          Edit the admission year and reopen the panel.
        reason: |
          Confirms the key is read from the profile rather than cached from
          the first open.
    observe: |
      The recommended-courses panel, the cited guide PDF name and path, and
      the admission year shown in the study profile.
    expected: |
      The guidance and recommendations come from the transfer admission
      cohort's dataset, and changing the admission year changes them.
    why_manual: |
      Requires a real transfer record; the bundled cohort datasets are real
      but which one applies is only knowable from the account.
    covers:
      - crates/isct-core/src/subscriptions.rs
      - crates/isct-core/src/course_query/mod.rs
      - apps/desktop/src/lib/departments.ts
    verified: null

  - id: SCHOOL-KYOMU-GRADUATE-TABLES
    area: school
    title: Graduate 教務Web tables against a real graduate account
    persona: masters-student
    preconditions: |
      A graduate account, Signed in, with a real grade history.
    steps:
      - action: |
          Refresh 教務Web and open the grades, GPA and requirements panels.
        reason: |
          Confirms the graduate tables are read at all, before anything is
          compared.
      - action: |
          Compare each panel with 教務Web in another browser.
        reason: |
          The extractor must not assume an undergraduate shape. A panel that
          looks plausible but omits a graduate table is the failure here.
      - action: |
          Interrupt a second refresh by opening a visible school page, then
          return and look at the rows again.
        reason: |
          A failed or partial import must never delete the last valid rows;
          this is the one guarantee that silently destroys data when it breaks.
    observe: |
      The grades, GPA and requirements panels, and 教務Web itself in another
      browser window.
    expected: |
      Graduate grades, GPA and requirements import with no layout warning, and
      an interrupted refresh leaves the previous rows untouched.
    why_manual: |
      The committed graduate fixture was transcribed from a public student
      manual published in 2017, so it exercises the documented shape but not
      the current live DOM. No graduate account was available at the last
      checkpoint; a borrowed account is the intended verification.
    covers:
      - crates/isct-core/src/kyomu_ingest.rs
      - crates/isct-core/src/school_parser/kyomu.rs
      - crates/isct-core/src/study_profile.rs
    verified:
      version: 1.0.0-rc.3
      date: 2026-10-16
      commit: b598ae6
      by: human
      result: unreached
      blocked_by: No graduate account available; a borrowed account is pending.
      notes: The 2017 manual fixture covers the documented shape only.
      evidence: docs/verification/native-sdk.md

  - id: SCHOOL-KYOMU-REGISTRATION-REQUIREMENTS
    area: school
    title: 教務Web registration and requirements pages import or report unavailable
    persona: undergraduate-senior
    preconditions: |
      Signed desktop bundle, Tokyo Tech account Signed in, campus network or
      VPN. Run once inside a 科目申告 window and once outside it. Outside the
      window was observed passing on 2026-10-17 (state 本登録済); the window
      itself, where courses are still being edited, is not yet observed.
    steps:
      - action: |
          Quit the app, then start it from a terminal so stderr is kept:
          `/Applications/IsctCompanion.app/Contents/MacOS/isct-companion 2>&1 | tee artifacts/kyomu-pull.log`
        reason: |
          Partial page failures are only reported to stderr, which a bundle
          launched from Finder discards. Without this the run gives no reason
          for the failure, as happened on 2026-10-17.
      - action: |
          Use the manual 教務Web refresh and wait until the footer settles.
        reason: |
          Manual refresh bypasses the retry backoff, so the run reaches the
          registration (PID1_0) and requirements (PID2_6) pages now.
      - action: |
          Find the `[school-pull] Kyomu/registrations:` and
          `[school-pull] Kyomu/requirements:` lines in the log and copy the
          text after `kyomu extraction was incomplete:`.
        reason: |
          That text is the extractor check that rejected the page. On
          2026-10-17 it was a header-less empty unit GridView
          (`kamokuUnit_-2_gvKamoku`) and a requirement table whose header has
          no <thead>; both are now read. A new reason names the next shape.
      - action: |
          Open both pages in the visible 教務Web view. Read the page's notice,
          if any, and inspect the element that holds it (its id or class).
          Check whether the elements named in the log line exist.
        reason: |
          Decides the fix. If the page shows a notice such as "outside the
          申告 period", the extractor's unavailable pattern must learn that
          notice and its element. If the data is visible but the selector
          does not match, the selector is broken.
      - action: |
          Run `sqlite3 -readonly "$HOME/Library/Application Support/app.isctcompanion/school.db" "SELECT scope,state,max(finished_at) FROM import_runs WHERE provider='kyomu' GROUP BY scope,state"`.
        reason: |
          Freshness counts only `complete` or `unavailable` runs. A page with
          neither keeps 教務Web due for an automatic refresh indefinitely.
    observe: |
      artifacts/kyomu-pull.log, the two 教務Web pages in the visible view, and
      the import_runs query output.
    expected: |
      `registrations` and `requirements` each have a `complete` or an
      `unavailable` run, the log has no `school-pull` line for either page,
      and the footer no longer shows a 教務Web failure after a refresh.
    why_manual: |
      The live registration and requirement DOM is account-scoped and changes
      with the 申告 window. The extractor tests reproduce only the two shapes
      observed outside the window, with placeholder values; no committed
      fixture is a capture. Only a real session shows what the portal serves
      while registration is open.
    covers:
      - crates/isct-core/src/school_browser/assets/kyomu-extract.js
      - crates/isct-core/src/school_parser/kyomu.rs
      - crates/isct-core/src/kyomu_ingest.rs
    verified: null

  - id: IDENTITY-LANGUAGE-SWITCH
    area: identity
    title: English UI and English content stay English
    persona: international-student
    preconditions: |
      The UI language set to English and the school-content language set to
      English.
    steps:
      - action: |
          Walk the main screens: today, courses, a syllabus page, the LMS, and
          settings.
        reason: |
          Untranslated strings cluster on the screens nobody visits during a
          happy-path demo, so the walk has to be broad rather than deep.
      - action: |
          Open a syllabus page that has an English page and read every date.
        reason: |
          The failure mode is not a Japanese word but a date whose format is
          unstated, which reads as correct to whoever wrote it.
      - action: |
          Trigger a refusal or an error on purpose.
        reason: |
          Error text is where translations are most often missing, and it is
          exactly where this persona cannot afford to guess.
    observe: |
      Every screen text, the syllabus page in English, and the error or refusal
      message.
    expected: |
      No Japanese appears in the English UI or in English content, dates state
      or unambiguously imply their format, and error messages are translated.
    why_manual: |
      Needs the real school content in English; the shipped English content
      only exists for courses that publish it, so completeness can only be
      judged against the live catalogue.
    covers:
      - resources/locales/**
      - apps/desktop/src/i18n/**
      - apps/desktop/src/lib/model.ts
    verified: null

  - id: SCHOOL-LMS-YEAR-ROLLOVER
    area: school
    title: LMS pull after the academic year moves
    persona: undergraduate-senior
    preconditions: |
      The school has moved the LMS to a new academic-year path.
    steps:
      - action: |
          Run `yarn test:live` and read the LMS year it reports.
        reason: |
          The pinned year must come from the site, not from memory. This step
          is the trigger for the rest of the check.
      - action: |
          If it differs from the pinned year, update LMS_HOME in
          crates/isct-core/src/lms_session.rs and the path literals in
          crates/isct-core/src/lms_ingest.rs.
        reason: |
          A stale literal does not fail loudly; it silently extracts nothing.
          The edit is mechanical, which is exactly why it must be paired with
          the real pull below rather than trusted.
      - action: |
          Sign in again and repeat SCHOOL-LMS-PULL.
        reason: |
          Only a real account proves the new path is the right one; a fixture
          cannot tell a moved site from a removed one.
    observe: |
      The `yarn test:live` output and the course list after the repeated pull.
    expected: |
      The live suite reports one year for both the redirect and every path
      literal, and the repeated pull matches the LMS again.
    why_manual: |
      The school has served the LMS under a fixed 2025 path since the merger,
      so the path is pinned rather than derived. When it moves, the automated
      suite fails but only a real account can confirm the new path works.
    covers:
      - crates/isct-core/src/lms_session.rs
      - crates/isct-core/src/lms_ingest.rs
    verified:
      version: 1.0.0-rc.3
      date: 2026-10-16
      commit: b598ae6
      by: agent
      result: pass
      notes: The LMS root still redirects to /2025/ and every pinned literal agrees.
      evidence: apps/desktop/tests/live/school-site.test.ts

  - id: CLOUD-DRIVE-WRITE
    area: cloud
    title: Google Drive upload, pull and restore through the consent screen
    persona: careless-multidevice
    preconditions: |
      A real Google account; a workspace with at least one editable record.
    steps:
      - action: |
          Enable Google Drive in Settings → Backup and complete the consent
          screen in the real browser.
        reason: |
          The consent hand-off is the part no test can drive. A failure here
          is a redirect or scope problem, not a sync problem.
      - action: |
          Upload, edit a record, then pull.
        reason: |
          Confirms the document round-trips through the provider's private app
          folder rather than a general folder.
      - action: |
          Restore from the uploaded document and confirm the replacement.
        reason: |
          Restore is the only operation that can destroy local data; it must
          be confirmed and must replace exactly what it claims.
      - action: |
          Drop the network mid-upload and restore it.
        reason: |
          A delivery that silently gives up looks identical to one that
          succeeded until the next device pulls stale content.
    observe: |
      The consent screen, the provider's app folder listing, the local record
      after restore, and the delivery state after the network returns.
    expected: |
      The consent screen returns to the app, IsctCompanion.json appears in the
      private app folder, pull and restore change only what they claim, and
      the interrupted upload retries without duplicating the document.
    why_manual: |
      Requires a real Google account and an interactive OAuth consent screen
      that cannot be automated without live credentials.
    covers:
      - crates/isct-core/src/cloud_sync/**
      - apps/desktop/src-tauri/src/cloud.rs
    verified: null

  - id: CLOUD-ONEDRIVE-WRITE
    area: cloud
    title: OneDrive upload, pull and restore
    persona: careless-multidevice
    preconditions: |
      A real Microsoft account.
    steps:
      - action: |
          Enable OneDrive in Settings → Backup and complete the consent
          screen.
