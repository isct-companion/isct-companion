          card shows the account as connected (`normal`) whatever the
          snapshot's trust, and nothing is verified until a page needs it.
      - action: |
          Open an assignment from the timetable and press its LMS link.
        reason: |
          An App link is a web operation: Core verifies the identity with one
          SSO from its snapshot, writes it, and only then opens the page. The
          LMS sign-in page, or `web cookies not written` in the log, means the
          write or the order failed.
      - action: |
          Copy the log.
