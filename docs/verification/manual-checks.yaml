  - id: CLOUD-PROVIDER-COMBINATIONS
    area: cloud
    title: Devices started apart on iCloud and Drive join and relay through a Mac with both
    persona: careless-multidevice
    preconditions: |
      One Apple Account and one Google account. A signed Mac app (iCloud and
      Drive), an iPhone app with only iCloud on, and an Android phone with only
      Drive on. Each device starts with its own data: before any device has
      both providers, add a different weekly event on the iPhone (Upload to iCloud)
      and on the Android phone (Upload to Drive). Import a backup file on the
      Android phone first: a restore uploads at once and must then merge with
      the other copies like any edit.
    steps:
      - action: |
          On the Mac, add a third weekly event, turn on iCloud and Google Drive in
          Settings → Backup (Drive through the browser consent), then Upload.
        reason: |
          The two clouds hold copies started apart. An old build refused the
          second provider with "a different workspace"; any error here, or a
          missing weekly event, means the copies were not merged.
      - action: |
          Pull on the iPhone and on the Android phone.
        reason: |
          Each must show all three weekly events. A phone that loses its own weekly event means
          the merged copy replaced its data instead of merging record by record.
      - action: |
          Turn on Sync automatically on the Mac and leave it open. Add a weekly event
          on the iPhone and Upload; do nothing on the Mac for an hour, then
          Pull on the Android phone.
        reason: |
          The Mac must relay iCloud's change to Drive from its hourly remote
          check, with no local edit. The weekly event missing on Android after the hour
          means the relay still waits for an edit or a relaunch.
      - action: |
          On the Mac turn Drive off, add a weekly event, Upload, then turn Drive on
          again.
        reason: |
          Turning a provider back on must merge its old copy and upload the
          merged data at once, not wait out the hourly limit or report a
          conflict.
    observe: |
      The weekly events on each device, each device's Backup page (provider lines,
      errors) and the version lists of both providers.
    expected: |
      No device reports a workspace error; every device ends with every weekly event;
      the iPhone's weekly event reaches Android through the Mac within about two hours
      without touching the Mac; re-enabling Drive brings it up to date at once.
    why_manual: |
      It needs real iCloud and Google accounts on three devices and an hour of
      wall-clock time. The merge, the restore upload and the relay logic
      are covered by
      `copies_started_separately_merge_across_providers_and_every_device_converges`
      and `a_device_with_both_providers_relays_on_its_remote_checks_without_a_local_edit`.
    covers:
      - crates/app-core/src/cloud_sync/mod.rs
      - crates/app-core/src/data/cloud_merge.rs
      - crates/app-core/src/data/backup_store.rs
    verified: null

