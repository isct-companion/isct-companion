  - id: DESKTOP-WRITES-PUBLISH-THEMSELVES
    area: desktop
    title: Every database write reaches the window and the cloud on its own
    persona: careless-multidevice
    preconditions: |
      macOS desktop app signed in to Science Tokyo, Google Drive backup
      enabled with automatic sync on, AI agent access enabled with a real MCP
      client connected, and a second device signed in to the same Drive.
    steps:
      - action: |
          Open the Web tab, browse to an LMS course page with an assignment
          that is not yet in the app, then switch to the Assignments page
          without pressing refresh.
        reason: |
          A page opened by the person is ingested by Core, not by a pull. That
          ingest used to commit without publishing, so the window kept the old
          list until something else reloaded it.
      - action: |
          From the MCP client, create a plan event for tomorrow, then look at
          the Calendar in the app window.
        reason: |
          The desktop agent server no longer emits the change itself; Core's
          commit path must publish it with source mcp.
      - action: |
          Edit a plan in the app, save a course note, then watch the cloud
          sync status and open the other device about ten seconds later.
        reason: |
          The shell no longer captures right after a mutation or note save.
          Core brings the next capture forward and the one-second wake runs
          it; a missing request would leave the edit unsynced for the whole
          interval or until the next foreground.
      - action: |
          Import a local backup from Settings, then reset the workspace and
          import it again.
        reason: |
          Restore and reset replace many rows in one commit and used to rely
          on the shell's capture; the window must show the result and the
          cloud must receive it without a manual sync.
      - action: |
          Clear the school cache in Settings, open Today and leave the window
          alone while the first pull refills it; then open Courses, Grades and
          the course finder.
        reason: |
          A background commit now patches only the records its change names
          feed, read against real LMS and 教務 rows. A table mapped to the
          wrong name would leave one of these pages on the old data until the
          app restarts, which no fixture shows.
    observe: |
      The Assignments list, the Calendar, Today, Courses, Grades, the finder,
      the Settings cloud sync status and the second device's copy of the
      edited plan and note.
    expected: |
      The new assignment and the MCP event appear without a refresh, the
      edited plan and the note reach the second device within a few seconds,
      both the import and the reset show in the window and upload without
      pressing Sync, and after the refill every page shows the pulled data
      without navigating away and back.
    why_manual: |
      The visible-page ingest needs a signed-in LMS page in the real WebView,
      the MCP step needs a real client, and the capture timing needs a real
      cloud provider and a second device. Core tests prove that each commit is
      published and brings capture forward; only the built app shows that the
      shell, which no longer does either, still gets there.
    covers:
      - apps/desktop/src-tauri/src/commands/workspace.rs
      - apps/desktop/src-tauri/src/lms_files.rs
      - apps/desktop/src-tauri/src/agent_server.rs
      - crates/isct-core/src/data/mod.rs
      - crates/isct-core/src/facade.rs
      - crates/isct-core/src/runtime.rs
      - crates/isct-core/src/notes.rs
      - crates/isct-core/src/school_browser/engine/pull.rs
      - crates/isct-core/src/workspace_changes.rs
      - apps/desktop/src/store/workspace.ts
      - apps/desktop/src/platform/view-query.ts
    verified: null

  - id: DESKTOP-STORAGE-SPLIT
    area: desktop
    title: The first launch after the split keeps the person's data and re-syncs the caches
    persona: careless-multidevice
    preconditions: |
      macOS desktop app data folder from a build before the split, with a
      real `school.db` holding plans, assignment marks, course overrides,
      subscriptions, scheduled tasks and settings, and cloud backup on. Copy
      the whole folder aside first.
    steps:
      - action: |
          Note the device id, a few plans, a hidden assignment and a renamed
          course in the old build, then quit it and launch the new build.
        reason: |
          The split copies every user table out of the real file once; a
          column or table the fixture does not have would lose data here and
          nowhere in the tests.
      - action: |
          Run `ls "$HOME/Library/Application Support/app.isctcompanion"`.
        reason: |
          `school.db.pre-split` must exist next to `user.db` and `cache.db`,
          and `school.db` must be gone; a leftover `user.db.migrating` means
          the split stopped halfway.
      - action: |
          Watch the sync status for a few minutes, then quit and launch again.
        reason: |
          cache.db starts empty, so every key must read as missing and be
          fetched; the second launch must not split or re-sync again.
    observe: |
      The Calendar, Assignments and course pages, Settings (device and
      backup), the sync status and the data folder listing.
    expected: |
      Plans, the hidden assignment, the renamed course, subscriptions,
      scheduled tasks and settings look as before, cloud backup still names
      the same device, school data refills from the sync, and the second
      launch is an ordinary start.
    why_manual: |
      Tests split a fixture built from the current schema; only the person's
      real file, written by older builds over months, shows that nothing in
      it is left behind.
    covers:
      - crates/isct-core/src/data/migrations.rs
      - crates/isct-core/src/data/connection.rs
      - apps/desktop/src-tauri/src/lib.rs
    verified: null

  - id: DESKTOP-CALENDAR-MARK-LATENCY
    area: desktop
    title: A session mark shows at once, also while the school sync runs
    persona: undergraduate-senior
    preconditions: |
      macOS desktop build with signed-in school accounts, a quarter with
      classes on the calendar, and the data folder of a build from before
      sync.db (its `cache.db` still holds `dataset_state`). Copy the folder
      aside first.
    steps:
      - action: |
          Launch the new build, run `ls "$HOME/Library/Application
          Support/app.isctcompanion"` and open the sync status.
        reason: |
          The first launch moves freshness and run records out of cache.db
          into a new `sync.db`. A lost move shows as every key fetching again
          and the status's last-read times reset to never.
      - action: |
          On the calendar, right-click a class and mark it 休講, then 試験,
          then back to the class, a few seconds apart.
        reason: |
          A mark now answers only the calendar fields; a block that keeps
          its old state, or updates only after a second, means the patch
          was not merged or the view did not query again.
      - action: |
          Press Refresh in the sync status so LMS and 教務 reads run, and
          mark sessions again while they run and right after they finish.
        reason: |
          A read that finds nothing new now commits only its freshness. The
          delay this check exists for came back exactly while a sync ran.
      - action: |
          Switch to the timetable, Today and the course finder, then back.
        reason: |
          Those pages read the mark through other change names; one still
          showing the old state means a view missed its change name.
    observe: |
      The data folder listing, the sync status times, the marked block on
      the calendar, and the same class on the timetable, Today and finder.
    expected: |
      `sync.db` sits beside `user.db` and `cache.db`, the sync status keeps
      its last-read times and does not refetch everything, each mark shows
      on the calendar with no visible delay with or without a running sync,
      and every other page shows the same state.
    why_manual: |
      The delay is a felt latency in the real app over the person's own data
      while the real sync engine runs; a scripted host has neither the 4 MB
      snapshot nor the school reads, and "no visible delay" is a glance.
    covers:
      - apps/desktop/src/store/workspace.ts
      - apps/desktop/src-tauri/src/commands/workspace.rs
      - crates/isct-core/src/data/snapshot.rs
      - crates/isct-core/src/data/migrations.rs
      - crates/isct-core/src/lms_ingest.rs
    verified: null

  - id: IOS-TIMETABLE-WEEK-AND-MARKS
    area: native
    title: iPhone timetable header, fitted blocks, session marks and the now line
    persona: undergraduate-first-term
    preconditions: |
      The iPhone app with the current quarter pulled, opened on a weekday
      between the first period's start and the last period's end (Tokyo time).
    steps:
      - action: |
          Open 時間割 and read the title block: the quarter and week label is
          an accent capsule with a calendar symbol on its own row, on one
          line, and tapping it or the date range opens the week picker.
        reason: |
          The capsule used to share a column with the range and a share
          button, so it wrapped onto two lines; on its own row it may take the
          full width.
      - action: |
          Swipe the grid left twice, then tap 今日.
        reason: |
          Swiping is now the only way to step weeks; the range figures must
          roll in place. 今日 is dimmed on the current week and active
          elsewhere, so a dimmed 今日 on another week or an active one on this
          week is wrong.
      - action: |
          Find a two-period class with a long English title and one whose
          room field lists several rooms.
        reason: |
          The title fills the block's height instead of stopping at three
          lines over empty space, and only the first room shows; a cut title
          over blank space or a room list ending in … is the old layout.
      - action: |
          Long press a class and choose 試験にする, then 休講にする, then
          通常の授業に戻す, reopening the menu each time.
        reason: |
          Each mark is Core's MarkSession and must redraw at once: a warn
          border with 試験 before the room, then a faded struck-through title
          with 休講, then the plain block; the tick must follow the state.
          Plan blocks must offer no menu.
      - action: |
          Look at today's column during a teaching hour.
        reason: |
          The red now line with its dot sits at the current time and moves
          every half minute; outside the axis, and on weekends when the grid
          shows the coming week, there is no line by design.
      - action: |
          Swipe quickly through the next three weeks and back.
        reason: |
          One read covers four weeks either side, so each step draws its
          blocks with the header; blocks that arrive after the date range
          changed mean the window cache was skipped.
      - action: |
          Long-press the 時間割 tab, slide to 授業のみ and lift; save the file
          to Files, then open it from Files.
        reason: |
          The .ics is Core's quarterIcs for the shown week's quarter, as the
          desktop's ICSを書き出す. Calendar must offer to add this quarter's
          classes with their rooms; another quarter or an empty file is wrong.
    observe: The 時間割 tab on the device.
    expected: |
      The header reads and steps as described, blocks use their height, marks
      redraw immediately with the right styling and tick, and the now line
      tracks the clock in today's column.
    why_manual: |
      Layout, the capsule cue, the context menu and the moving line are read
      at a glance on a phone; the axis maths is covered by Core's timing tests
      and the desktop `nowPercent` unit tests.
    covers:
      - apps/ios/IsctCompanion/Features/Timetable/TimetableScreen.swift
      - apps/ios/IsctCompanion/Design/TabItemPress.swift
      - apps/ios/IsctCompanion/App/IsctCompanionApp.swift
      - apps/ios/IsctCompanion/Features/Timetable/TimetableBlock.swift
      - apps/ios/IsctCompanion/Design/TimetableAxis+Layout.swift
      - apps/ios/IsctCompanion/Core/AppModel.swift
    verified: null

