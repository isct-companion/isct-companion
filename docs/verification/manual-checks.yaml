  - id: ANDROID-DRIVE-SIGNIN
    area: cloud
    title: Android signs in to Google Drive through the account prompt
    persona: careless-multidevice
    preconditions: |
      The release-signed APK from the Android release workflow, with its package
      and certificate SHA-1 registered on the Android release OAuth client,
      installed on a phone with Play services. The OAuth app is in production;
      use a Google account outside its test-user list. A desktop app has Drive
      on and at least one plan uploaded.
    steps:
      - action: |
          設定 › バックアップ: turn on Google Drive and decline Google's
          prompt.
        reason: |
          The switch must stay off with the reason under it. A crash or a
          switch left on means the consent result was not read.
      - action: |
          Turn it on again, allow the prompt, then Pull.
        reason: |
          The desktop's plan must arrive. If Google does not know the build
          (UNREGISTERED_ON_API_CONSOLE), the Drive row says so and names the
          SHA-1 to register on the Android client; each signing key (each
          machine's debug key, the release key) needs its own entry. A
          closed account chooser leaves the switch off without an error.
      - action: |
          Swipe the app away, reopen it, edit a record and Upload; Pull on the
          desktop.
        reason: |
          A relaunch must get a token without showing the prompt again; a
          prompt or an authorization error means the remembered connection or
          the silent authorization failed.
      - action: |
          Export a backup file to Files and import it again.
        reason: |
          Android had no backup page before; export and import must go through
          the system document picker and the import must leave a recovery file.
      - action: |
          Turn Google Drive off, swipe the app away, reopen it and turn Drive
          on again.
        reason: |
          Turning off is the port's sign-out, which revokes the grant, so
          Google's prompt must show again. Reconnecting silently means only
          the cached token was cleared.
      - action: |
          With Drive on, 設定 › リセット › 完全リセット: choose
          クラウドから復元する, acknowledge and reset; repeat once with
          新しい端末として始める.
        reason: |
          Restore turns the providers that were on back on and pulls, as on
          desktop, so the desktop's plan returns; a new start leaves Drive off
          and the device empty. The choice only appears while a provider is
          on, and クラウドのコピーとほかの端末 is listed under what stays.
    observe: |
      Google's prompt, the Drive row and recovery files on the Backup page,
      and the records on both devices.
    expected: |
      Decline leaves Drive off with its reason; allow connects it and the
      desktop's data arrives; a relaunch stays connected silently; export and
      import work and the import keeps a recovery file; off then on asks
      again; a full reset restores from Drive only when asked to.
    why_manual: |
      Google Identity's authorization needs Play services, a registered signing
      certificate and a real account on a device. The Core side of the token
      port is covered by
      `drive_signs_in_through_the_token_port_and_stays_authorized_after_restart`.
    covers:
      - apps/android/app/src/main/java/app/isctcompanion/core/DriveTokens.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/settings/BackupPage.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/settings/ResetPage.kt
      - crates/isct-ffi/src/ports.rs
    verified: null

