  - id: DESKTOP-MCP-LMS-WRITE
    area: desktop
    title: An AI agent hands in and removes an assignment through MCP
    persona: careless-multidevice
    preconditions: |
      A built desktop app signed in to a real LMS account, Claude Code
      connected through Settings → AI agent access, and an open individual
      file assignment the person chooses, with an empty LMS submission, that
      they may hand test files in to and withdraw (no cut-off passed).
    steps:
      - action: |
          With Allow AI agents to write to LMS off, ask the agent to create
          the workspace, put a small PDF into submit/, prepare a save and run
          submission_save.
        reason: |
          The switch is the person's standing consent to LMS writes. The save
          must come back as lms-writes-disabled with nothing on the LMS, while
          preparing alone sends nothing.
      - action: |
          Turn the switch on, restart Claude Code in bypass mode
          (--dangerously-skip-permissions) and ask it to save again. Read the
          confirmation prompt before allowing it.
        reason: |
          requiresUserInteraction must make Claude Code ask even in bypass
          mode, and the prompt must show the echoed summary (title, file
          names, sizes, SHA-256 prefixes, effect, reversibility). A prompt
          that hides it has the person confirm blind.
      - action: |
          Allow it, open the assignment's LMS page in the app and compare the
          file, its size and the status; then ask the agent to run the same
          submission_save again.
        reason: |
          The read-back must match the real LMS. The repeated call must answer
          with the same operation id and upload nothing: the LMS page's last
          modified time must not move.
      - action: |
          Ask the agent to prepare and run submission_remove, confirm the
          prompt, then check the LMS page.
        reason: |
          Removal deletes handed-in work. The prompt must appear in bypass
          mode too and say it cannot be undone, and the LMS must show no
          submission afterwards.
      - action: |
          Prepare a save of a file of tens of MB, allow it and turn Wi-Fi off
          while it is saving. Turn it on after a minute, ask for another save
          of other content, then call submission_status a few times over ten
          minutes.
        reason: |
          A dropped connection is what Core must settle by reading only, and
          no longer by the clock. The other save must be refused while the
          first is outcome_unknown; submission_status must answer at once
          from Core's record (no LMS request per call in the log), and the
          first write must end succeeded only once Core downloaded the LMS's
          file and its SHA-256 matched, or failed with one upload at most (one
          file on the LMS page).
      - action: |
          After a save that succeeded, watch the assignment's row in the app
          and the application log for a minute.
        reason: |
          The settled write queues its assignment to be read again: the row
          must show the new submission state without a refresh press, and a
          course refresh that started before the save must not overwrite it
          with the state from before.
      - action: |
          With a save prepared, sign out of Science Tokyo in Settings and
          sign in again (or with another account), then run submission_save.
        reason: |
          The write is bound to the account and its generation it was
          prepared with; it must be refused as submission-identity-changed
          with nothing sent.
      - action: |
          Remove the test submission so the assignment is as it was.
        reason: |
          The assignment belongs to a real course; the check must leave no
          test files handed in.
    observe: |
      Claude Code's confirmation prompts and tool results, the assignment's
      LMS page in the app (status, file names, sizes, last modified).
    expected: |
      With the switch off the save is refused as lms-writes-disabled. With it
      on, Claude Code asks before submission_save and submission_remove even
      in bypass mode and shows the summary; the LMS matches every result; a
      repeated save returns the same operation; the cut connection settles as
      succeeded or failed with at most one upload; the assignment ends with
      no submission.
    why_manual: |
      Needs a real LMS account and assignment, Moodle's live write endpoints,
      a real MCP client's confirmation UI and a real network drop. The Core
      tests drive the same paths only over a test transport.
    covers:
      - crates/app-core/src/net/moodle/submission.rs
      - crates/app-core/src/submissions.rs
      - crates/app-core/src/submissions/**
      - crates/app-core/src/agent/submissions.rs
      - crates/app-core/src/deadlines.rs
      - apps/desktop/src-tauri/src/agent_server.rs
      - apps/desktop/src/pages/settings/AgentSettings.tsx
    verified: null

  - id: DESKTOP-LEGACY-STORE-CUTOVER
    area: desktop
    title: The first start after 1.2.x moves the data folder into one store
    persona: careless-multidevice
    preconditions: |
      A Mac with IsctCompanion 1.2.7 installed and used (courses, a personal
      event, a reminder setting, Allow local agents on), a copy of
      `~/Library/Application Support/app.isctcompanion/` saved elsewhere, and
      a build of this commit (`yarn desktop:build --debug --bundles app`).
      `pgrep -lf IsctCompanion` shows nothing running. For the Windows step, a
      Windows PC with 1.2.7 installed and used, and an installer of this commit.
    steps:
      - action: |
          On the Windows PC, install this commit over 1.2.7 and start it. Then
          uninstall, remove the data folder and install it fresh.
        reason: |
          Windows refuses file operations that Unix allows, and the Core tests
          do not run the installed app's own folder. 1.3.0 passed on a Mac and
          stopped on Windows with "The data folder could not be opened" (os
          error 5) while building the first store.
      - action: |
          Start the new build once, quit it, and list the data folder.
        reason: |
          The user tables of the flat user.db are copied into
          `store/<generation>/store.db` and the folder gains `core.lock`,
          `store-index.db` and `local/reminders-fired.json`. The flat files
          stay (retired, not deleted), so the old release's data remains as
          recovery material.
      - action: |
          Start the new build again and check Today, the personal event, the
          reminder setting and Settings → AI agent access.
        reason: |
          User data must be the 1.2.7 data, unchanged; school data is read
          again, since the flat caches are not carried over, and the MCP
          listener comes back on its own.
      - action: |
          With the new build running, start `yarn desktop:dev` (or a second
          copy of the .app).
        reason: |
          One Core per data folder: the second process must stop at once with
          the "another copy is using this data folder" message, before it
          opens a database or reads the school.
      - action: |
          Quit everything, start 1.2.7 again, then the new build.
        reason: |
          1.2.7 does not know the lock or the generations: it works on the
          retired flat files, and nothing it writes reaches the new build.
          The new build must still open its own generations unharmed. Restore
          the saved copy of the folder afterwards if 1.2.7 is needed again.
    observe: |
      Finder or `ls -R` on the data folder, the app's Today and Settings, the
      dialog of the second process.
    expected: |
      The first start of the new build keeps all user data in a new store
      generation, fetches school data again, retires the flat files without
      deleting them, and a second
      process is refused with its message; after 1.2.7 ran again the new
      build still opens its own data.
    why_manual: |
      Needs a real installation of the released 1.2.7 with its real data
      folder and two real processes on one Mac. The cut-over, the lock and
      the generations are covered by the Core tests over scratch folders.
    covers:
      - crates/app-core/src/data/root.rs
      - crates/app-core/src/data/connection.rs
      - crates/app-core/src/data/migrations.rs
      - crates/app-core/src/storage.rs
      - apps/desktop/src-tauri/src/lib.rs
      - apps/desktop/src-tauri/src/native_dialog.rs
    verified: null

  - id: DESKTOP-STORE-POWER-LOSS
    area: desktop
    title: Cutting the power during school reads leaves the store whole
    persona: careless-multidevice
    preconditions: |
      A MacBook you can force off (hold the power button for 10 seconds), and
      a build of this commit with signed-in school accounts. Note the personal
      events and plan marks you have. Save nothing else open on that Mac.
    steps:
      - action: |
          Press Refresh in the sync status, mark a class 休講 and add a personal
          event while LMS and 教務 reads run. Wait until the event shows, then
          force the Mac off straight away.
        reason: |
          The Core tests kill the process, not the machine. Only a real power
          cut shows whether a commit the app reported survives with
          `F_FULLFSYNC` and whether the log recovers.
      - action: |
          Start the Mac and the app, then run `sqlite3 "$HOME/Library/Application
          Support/app.isctcompanion"/store/*/store.db "PRAGMA integrity_check;"`
          with the app closed.
        reason: |
          A damaged page in the one file would take user data with the caches.
      - action: |
          Compare the event and the mark, and read the sync status.
        reason: |
          Every commit is whole: the event and mark are there or the app had
          not reported them, and a course never appears under two ids.
      - action: |
          Repeat the sequence on a Windows laptop and note the result beside
          the Mac's.
        reason: |
          Windows flushes through its own sync path, which no test here reaches.
    observe: |
      `PRAGMA integrity_check`, the event and the marked class in the app, and
      the sync status.
    expected: |
      The app opens without a recovery message, the check prints `ok`, the event
      and mark that were showing are still there, and school pages show the same
      courses as before, reading again what was not finished.
    why_manual: |
      It needs real hardware losing power: a killed process keeps the drive's
      cache, which is what `F_FULLFSYNC` is there for, so no test can reach it.
    covers:
      - crates/app-core/src/data/connection.rs
      - crates/app-core/src/data/migrations.rs
      - crates/app-core/src/data/root.rs
    verified: null

