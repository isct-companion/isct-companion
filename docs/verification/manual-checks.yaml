  - id: NATIVE-DEVICE-FLOWS
    area: native
    title: Native shells on physical devices
    persona: undergraduate-first-term
    preconditions: |
      A signed build, provisioning, and physical iOS and Android devices.
    steps:
      - action: |
          Install the build on each device and complete first-run.
        reason: |
          Installation and the OS authorization prompts are outside anything
          the repository can simulate.
      - action: |
          On an iPhone signed in to the same Apple ID as a Mac whose desktop
          app is already connected, open 設定 → 学校アカウント before typing
          anything.
        reason: |
          School logins are synchronized iCloud Keychain items named by Core
          (`vault_item`). Showing 未接続 here means the iOS item identity or
          access group drifted from the desktop's.
      - action: |
          Walk sign-in, pull to refresh on 今日, the ウェブ tab, a course's
          LMS link, hiding an assignment, and turning on reminders.
        reason: |
          The native shells render independently of the desktop frontend, so
          desktop acceptance says nothing about them. Pulls run through the
          WKWebView browser port, which only a real identity provider and OTP
          exercise.
      - action: |
          On Android, sign in from 設定, pull to refresh on 今日, open the
          ウェブ tab and a course's LMS link, swipe an assignment to hide
          it, then turn on reminders and wait for one to arrive.
        reason: |
          Pulls run through the WebView browser port and Core's injected
          scripts, which only a real identity provider and OTP exercise;
          reminders depend on the notification permission and alarm delivery
          of a real device.
      - action: |
          On iOS, pull down on 今日 and watch the ring beside the settings
          button, then tap it.
        reason: |
          The ring and the sheet render Core's sync snapshot
          (`sync_engine`), the same value as the desktop footer. A ring shown
          for a run without a total, or a sheet whose LMS and 教務Web rows
          disagree with the desktop footer, means the shell stopped following
          Core.
      - action: |
          On an iPhone with a working LMS token, let the LMS browser session
          expire while retaining the school portal sign-in. Reopen the app
          and refresh 今日 without first visiting LMS in the ウェブ tab.
        reason: |
          Token reads can still update assignments while the course list's
          timetable read needs a fresh Moodle session. Recovery must enter
          LMS after the portal check; the LMS source must finish without a
          persistent "Could not update LMS" retry even though other reads
          succeeded. Real SSO redirects and WebKit cookies need a signed phone.
      - action: |
          On iOS, open a course from a timetable block, switch to 資料 and open
          a PDF; then tap the timetable title, pick another quarter's chip and
          a week in the list.
        reason: |
          Files download with the resident web view's sign-in (the cookie
          port) into the folder desktop uses; a Safari hand-off or a login
          prompt means the port or the folder name drifted. The picker labels
          come from Core's `TimetableYear`; a quarter chip that lands on a
          week outside that quarter means the jump target is wrong.
      - action: |
          On an iPad, hold it upright, then turn it to landscape, open 授業 and
          pick two courses.
        reason: |
          Upright keeps the tab bar with 授業 added; landscape switches to the
          workstation's rail and the course list beside the course page, by
          the desktop's width rule. A course page that does not change, or a back stack that
          survives choosing another course, means the split lost its owner.
      - action: |
          On each device, after a pull, turn two reminder switches on in quick
          succession, force-quit the app, reopen it and open 設定.
        reason: |
          Each account row's 更新 time comes from Core's school status; a time
          that disappears after the restart means the shell went back to its
          own clock. Both switches staying on shows settings edits are applied
          one after another, as on desktop, instead of the second copying
          stale settings.
    observe: |
      Each device's screens, its authorization prompts, and the notifications
      it delivers.
    expected: |
      The flows work with the platform's own UI, authorization prompts and
      notification delivery; school pages open inside the app, never in
      Safari, and a pull fills 今日 and 課題.
    why_manual: |
      Needs a real student id and OTP, iCloud Keychain on two devices, signing
      and provisioning for physical hardware.
    covers:
      - apps/android/**
      - apps/ios/**
      - bindings/**
      - crates/isct-ffi/**
    verified:
      version: 1.0.0-rc.3
      date: 2026-10-16
      commit: b598ae6
      by: human
      result: unreached
      blocked_by: The SwiftUI and Compose shells do not exist yet.
      notes: Recorded so the boundary stays visible.
      evidence: docs/verification/native-sdk.md

  - id: RELEASE-SIGNING
    area: release
    title: Signed and notarized macOS installers
    persona: narrow-window-keyboard
    preconditions: |
      The seven Apple secrets configured on the release runner.
    steps:
      - action: |
          Dispatch the Desktop release workflow with sign_macos enabled.
        reason: |
          The signing path only runs when asked; a default build would pass
          while the signed path is broken.
      - action: |
          Read the workflow log for codesign verification, the notarization
          result and the stapled ticket.
        reason: |
          Notarization acceptance and stapling are separate outcomes; a build
          that notarizes but does not staple fails on a fresh machine.
      - action: |
          Remove one Apple secret and dispatch again.
        reason: |
          A signed build must fail rather than silently fall back to unsigned;
          this is the only step that proves the failure mode.
    observe: |
      The workflow log, the notarization report, and the stapler validation
      output.
    expected: |
      All seven secrets are required, the identity is a Developer ID
      Application identity, and signature, notarization and stapling all pass
      before publication.
    why_manual: |
      Needs Apple credentials and the notarization service.
    covers:
      - scripts/desktop/macos-signing.mjs
      - .github/workflows/desktop-release.yml
      - .github/workflows/apple-signing-check.yml
    verified: null

