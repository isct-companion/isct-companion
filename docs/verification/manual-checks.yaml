  - id: DESKTOP-NATIVE-CHROME
    area: desktop
    title: Desktop controls take the arrow cursor, show hover and pressed states, and the frame's text cannot be selected
    persona: windows-snap-user
    preconditions: |
      The desktop app with a workspace on Today, Timetable and Settings.
    steps:
      - action: |
          Hover the sidebar, toolbar buttons, tabs, menu items and the
