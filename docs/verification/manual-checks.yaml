  - id: SCHOOL-OTP-QR
    area: school
    title: Visible automatic OTP enrollment and authenticator QR import
    persona: undergraduate-first-term
    preconditions: A packaged desktop app, a physical camera, and a disposable test TOTP QR on another display. School-side registration or rotation additionally requires a test school account whose owner explicitly authorizes the automatic credential change.
    steps:
      - action: Start signed out with no OTP saved locally, keep アプリに設定してもらう (Let the app set it up) chosen and press Open the school site. Complete sign-in manually in the visible school browser using an available method; confirm saved App OTP does not take over. After login, confirm the browser automatically continues to OTP settings without returning to click again. For Unset, confirm App Authentication Settings opens; for Already Set, cancel the reset dialog once, then retry and continue, checking the warning about updating every authenticator. Exit the web page mid-login once and confirm no later redirect or reset dialog appears. Do not remove a real registration just to inspect the flow.
        reason: Confirms the live server markup and school WebView cookies work together; missing local OTP must not be treated as an unset school registration. The native browser must retain the settings draft and provide a way back. Scripted-host tests cover cancellation but cannot establish these real session and navigation facts.
      - action: On an authorized test account, let the visible school browser read the new setup, fill Token and submit Setup automatically. Confirm it returns to Settings with a success message and a saved OTP without pressing Connect. Press Show QR code, scan it with another authenticator app on a phone, confirm the entry reads Science Tokyo with the account name and its code works, then close the dialog. Cancel or reject school verification once and confirm no success is reported. Confirm the account card then shows one saved line (codes filled in at sign-in, Copy setup, Show QR code, Change) instead of the chooser. Press Change, pick From an authenticator app, import only the school account from an existing export and press Connect without changing school registration.
        reason: Only the live school and native vault can establish successful registration and cross-authenticator agreement, and only a real phone camera and authenticator show that the rendered QR is scannable and labelled. People reported not knowing which of four equal buttons to press; the three radio cards with one recommended path, each hint shown only when chosen, need a human read. Offline tests protect promotion and rejection logic.
      - action: Open school accounts, scan the test QR with the camera, deny access once, then allow access and retry.
        reason: Native WebView camera permission and recovery cannot be supplied by headless DOM tests.
      - action: Move the QR into and out of view, then close the dialog and background the app during a second scan.
        reason: Optical decoding and the real camera indicator must be checked on physical hardware, independently of mocked scanner controls.
      - action: Copy the test OTP setup from the draft, then save it, clear the draft and copy again. Paste each into a local scratch field and compare with the original setup.
        reason: Confirms OS clipboard delivery and vault export without returning the saved secret through the WebView; scripted-host tests only observe the copy intent.
    observe: Settings > School accounts, the camera preview, the input draft, and the OS camera indicator.
    expected: Automatic enrollment saves only after school registration succeeds and returns to Settings; reset requires confirmation and replacement in other authenticators, and the QR code adds a working entry to any authenticator. The three paths read as one choice with the school path recommended. Clear scans fill the draft, permission errors offer image import, and closing or backgrounding stops the camera without changing saved credentials.
    why_manual: Requires native camera permissions, optical input and an OS camera indicator in a packaged shell, plus the system clipboard and credential vault. Registration and rotation also depend on the live school account and the owner's authenticator.
    covers:
      - apps/desktop/src/components/OtpSetupInput.tsx
      - crates/isct-core/src/school_auth/otp_setup.rs
      - crates/isct-core/src/school_auth/otp_enrollment.rs
