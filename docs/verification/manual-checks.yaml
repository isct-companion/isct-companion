  - id: IOS-SCHOOL-POPUPS
    area: native
    title: iOS school popups cover their opener and close back to it
    persona: undergraduate-senior
    preconditions: |
      An iPhone and an iPad build of this commit, signed in to 教務Web and
      the LMS, with a course whose material includes a PDF.
    steps:
      - action: |
          On 教務Web, open a page with a picker button (for example the 申告
          page's 科目 search, during a 申告 period). Press the button, look at
          the page that opens, then close it with its own 閉じる button;
          open it again and close it with the app's Close window.
        reason: |
          教務Web's showDialog opens a named window that answers through
          `window.opener` and closes itself. Before, the popup's page replaced
          the opener and was reported closed at once. Now it is a real
          WKWebView built from WebKit's configuration over the opener, and
          `window.close()` (webViewDidClose) and the close bar must both bring
          the opener back unchanged. Choosing would post back to the 申告
          form, so the check stops before it.
      - action: |
          On 教務Web's top page, open 「マニュアル」, use Back and Forward and
          Share while it is open, then Close window.
        reason: |
          A `target=_blank` PDF opens as a popup now; the toolbar and the page
          menu act on the popup in front, and the page behind must still be
          there after closing.
      - action: |
          On an LMS course page, open a PDF material that opens in a new
          window, close the preview, and look at the web screen. If the
          course offers a Word or other file, open it the same way.
        reason: |
          The LMS sends files as attachments, which the iOS host saves and
          previews. The popup opened for the file never commits a page, so
          it used to stay empty over the course page until closed. The host
          now reports the download for the popup it happened in, Core closes
          that empty popup, and the transfer must still finish after the
          popup is gone.
      - action: |
          On the iPad, open a page with a file input in a popup (an LMS
          assignment's edit page reached from a link that opens a new
          window), and drag a file from Files in Split View onto its file
          area without submitting. Switch to another tab and back, rotate
          the iPad, and drag again.
        reason: |
          A popup used to be a subview of its opener's web view, and WebKit
          answers a drag at the outermost web view under it, so the file
          went to the page underneath. Popups are siblings of their view
          now, and must stay over it, at its size, after the view is parked
          and taken back or resized.
    observe: |
      The web screen while the popup is open, the Popup window bar under the
      navigation bar, the opener page after closing, the file preview, and
      the popup's file area after each drag.
    expected: |
      Each popup fills the web screen under a Popup window bar with Close
      window; Back, Forward and Share act on the popup; closing either way
      returns to the opener exactly as it was, with no reload. An LMS file
      opens in the preview with its content, and after the preview closes
      the course page shows with no empty popup and no Popup window bar. On
      the iPad a file dragged onto the popup's file area lands there, also
      after switching tabs and rotating, and the popup still covers the
      whole web screen.
    why_manual: |
      Needs a 教務Web account and WebKit's own windows on a device; where
      the popup sits and that the opener survives is a glance. The
      child-window lifecycle is Core's and tested there.
    covers:
      - apps/ios/IsctCompanion/Core/SchoolBrowserHost.swift
      - apps/ios/IsctCompanion/Core/WebRouter.swift
      - apps/ios/IsctCompanion/Features/Web/WebScreens.swift
    verified: null

  - id: IOS-SCHOOL-NO-RESUBMIT
    area: native
    title: iOS reload and history never send a postback form again
    persona: undergraduate-senior
    preconditions: |
      An iPhone and an iPad build of this commit, signed in to 教務Web.
    steps:
      - action: |
          On the 成績 list, switch the 学期 (a postback that changes nothing
          on the school's side), then choose Reload in the page menu, and once
          pull down to refresh.
        reason: |
          WebKit's own reload of a POST result sends the form again,
          silently. On a 申告 page that repeats an action; here it is
          harmless, which is why this page is used. Both the menu and the
          pull are the app's Reload, which Core turns into a GET of the last
          page on every platform, so WebKit never reloads and no notice is
          needed.
      - action: |
          Switch the 学期 twice more, open another page, go to a third site
          in the picker and back, then press Back repeatedly.
        reason: |
          Switching sites lets WebKit drop the cached postback pages. Going
          back to one would resend its form; the host must cancel that and
          step past the entry instead. This rests on WebKit having moved its
          history to the target when it asks, which was probed on macOS only.
    observe: |
      The line under the navigation bar after Reload, the 成績 page, and
      where each Back lands.
    expected: |
      Reload and the pull open the page in its initial state, without the
      教務Web error page and with no line under the navigation bar. Back
      either shows a cached page as it was or skips
      past a postback page to the one before it; it never shows the 教務Web
      error page and never stalls on the same page.
    why_manual: |
      Needs real WebForms postbacks inside WebKit on a device, and WebKit's
      cache eviction. Which page Reload opens and the resubmission rule for
      history are Core's and tested there.
    covers:
      - apps/ios/IsctCompanion/Core/SchoolBrowserHost.swift
      - apps/ios/IsctCompanion/Features/Web/WebScreens.swift
    verified: null

