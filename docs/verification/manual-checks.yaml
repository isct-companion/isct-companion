          Untranslated strings cluster on the screens nobody visits during a
          happy-path demo, so the walk has to be broad rather than deep.
      - action: |
          Open a syllabus page that has an English page and read every date.
        reason: |
          The failure mode is not a Japanese word but a date whose format is
          unstated, which reads as correct to whoever wrote it.
      - action: |
          Trigger a refusal or an error on purpose.
