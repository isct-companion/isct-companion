  - id: SCHOOL-COURSE-AFTER-ENROLMENT
    area: school
    title: An open course page fills right after the course list when school caches are cleared
    persona: undergraduate-senior
    preconditions: |
      The desktop app signed in to the LMS, on Wi-Fi, with a current-quarter
      course that has materials and assignments open in Lectures.
    steps:
      - action: |
          Settings → Reset → Clear school caches and resync, leave the
          sign-out and download options off, and confirm; go straight back
          to the open course page.
        reason: |
          This is the order that failed on 2026-10-25: the open page asked for
          its course in the same second as the course list, the course was
          refused as not enrolled and backed off five minutes, so its page
          stayed empty while exams (from the reference feed) were already
          there.
      - action: |
          Watch the footer status line and the course page until the course
          list has landed (Lectures lists your courses again).
        reason: |
          The course must wait for the list ("Waiting for the data it depends
          on", never a failure) and be read the moment the list lands; a
          "Could not update" line or a retry time means the old ordering or
          the old error class is back.
      - action: |
          Run `sqlite3 -readonly "$HOME/Library/Application Support/app.isctcompanion/sync.db" "SELECT dataset,key,outcome,error_kind,started_at,finished_at FROM sync_runs WHERE dataset IN ('lms.enrolment','lms.course') ORDER BY started_at DESC LIMIT 12"`.
        reason: |
          Shows the order on record: the open course's `lms.course` row must
          start after `lms.enrolment/all` finished, with outcome `complete`
          and no `parse` or `not-enrolled` row.
    observe: |
      The open course page in Lectures, the footer status line and the
      `sync_runs` rows of sync.db.
    expected: |
      Within seconds of the course list returning, the open course shows its
      materials and assignments; no failure or "retries at" appears for it,
      and its `lms.course` run starts after the enrolment run and completes
      on the first try.
    why_manual: |
      Needs a real LMS account and the shell's open-page hints racing a real
      enrolment read. The planner order and the not-enrolled outcome are
      covered by Core's sync_engine and lms_ingest tests.
    covers:
      - crates/isct-core/src/sync_engine/planner.rs
      - crates/isct-core/src/sync_engine/runner.rs
      - crates/isct-core/src/school_browser/engine/pull.rs
      - apps/desktop/src/app/sync-text.ts
    verified: null

  - id: IOS-SIGNIN-REASON-AND-RETRY
    area: native
    title: iPad names why sign-in failed, and a corrected OTP signs in without the web tab
    persona: undergraduate-first-term
    preconditions: |
      The iPad app built from this commit on a physical iPad, a live Science
      Tokyo account whose password and authenticator are at hand, and a second
      valid-looking TOTP secret that is not registered with the school (any
      authenticator test secret). No school web session: sign out of the
      school in the ウェブ tab or wait for the session to expire.
    steps:
      - action: |
          Open 設定 → 学校アカウント → Science Tokyo, keep the student ID and
          password, replace the OTP setup with the unregistered secret and tap
          保存して接続.
        reason: |
          The page must wait for Core's sign-in and stay open with the reason
          (ワンタイムパスワードが受け付けられませんでした plus the school's own
          words), not close and leave only ログインに失敗しました. Closing at
          once means the shell still saves and hopes instead of connecting.
      - action: |
          Go back to 設定 and read the Science Tokyo row, then reopen the
          account page.
        reason: |
          The row shows ログインに失敗しました：<reason>, and the page shows the
          same reason with whether automatic sign-in retries shortly or waits.
          A bare "Sign-in failed" means the snapshot's problem never reached
          the shell.
      - action: |
          Paste the real OTP setup, tap 保存して接続, then open ウェブ → LMS
          without signing in by hand.
        reason: |
          The connect must lift the pause the bad code left: before, one
          failure blocked automatic sign-in until the app quit, and only a
          manual sign-in on the web tab got in.
      - action: |
          Background the app until the school session expires (or sign out on
          the school page), return to it, and open LMS again.
        reason: |
          The hidden session check must sign in again on its own with the
          corrected credentials, which is where the old block resurfaced.
    observe: |
      The Science Tokyo account page and its row in 設定, and the LMS page in
      the ウェブ tab.
    expected: |
      A wrong code keeps the page open with a named reason; the row shows the
      reason. After the corrected code the account signs in from 設定, and LMS
      opens signed in, now and after the session expires, without ever typing
      on a school page.
    why_manual: |
      Needs the live Extic identity provider, a real account and OTP window,
      and the iPad's WKWebView. The retry policy and the lifting of a pause
      are covered by Core's school_browser tests; what remains is the live
      school's answer and the native page a person reads.
    covers:
