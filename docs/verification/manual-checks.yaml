          今日 has no gear button. An iPad adds 授業.
      - action: |
          Before the first class, read the card under the date, then swipe up
          on it twice and down once.
        reason: |
          Core's upcoming list leads with the next class (次の授業, countdown
          chip) and the two after it peek behind; each swipe turns one card,
          the label above follows the front card's day and the counter reads
          1 / 3 to 3 / 3. The stack never changes height, so nothing below
          moves.
      - action: |
          On the first card swipe down, and on the last card swipe up.
        reason: |
          Past either end the swipe scrolls the page instead; a stuck page
          means the stack claims gestures it cannot use.
      - action: Tap the front card, then a card behind it after turning to it.
        reason: |
          The whole card opens that card's course; only the front card takes
          the tap.
      - action: |
          Scroll to 課題: read the header and the groups, then tap すべて.
