      - apps/android/app/src/main/java/app/isctcompanion/core/AppModel.kt
      - crates/app-ffi/src/session.rs
    verified: null

  - id: DESKTOP-BACKUP-IMPORT-REQUERIES
    area: desktop
    title: Importing a backup refreshes every page without a restart
    persona: undergraduate-senior
    preconditions: |
      macOS desktop build of this commit with a quarter of classes and a
      backup exported earlier (Settings → Backup) after which a weekly event and a
      session mark were added.
    steps:
      - action: |
          Open the calendar and the planner, then import the earlier backup
          from Settings → Backup.
        reason: |
          The import answers nothing now; the pages hear the restore's
          commit by name. A page still showing the later weekly event or mark means
          the restore's changes did not reach its query.
      - action: |
          Mark a session 休講 right after the import.
        reason: |
          The store reads the revision again after an import; a conflict
          error here means the next intent was made against the revision
          from before the restore.
    observe: |
      The planner's weekly events, the calendar's marks, and any error toast after
      the mark.
    expected: |
      Without restarting, the later weekly event and mark are gone, everything from
      the backup shows, and the new mark saves without an error.
    why_manual: |
      A real backup restore goes through cloud sync's restore path and the
      native file picker; the repository's command forwarding is in the
      workspace-store suite, but not the whole round trip in the app.
    covers:
      - apps/desktop/src-tauri/src/commands/backup.rs
      - apps/desktop/src/storage/repository.ts
      - apps/desktop/src/store/workspace.ts
    verified: null

  - id: ANDROID-START-FAILURE-COPY
    area: native
    title: Android names why Core could not open, in words
    persona: careless-multidevice
    preconditions: |
      An Android emulator build of this commit whose app data holds a
      single-file files/core/school.db from an install before the store split.
    steps:
      - action: |
          Open the app over that data.
        reason: |
          The session fails before it can report settings.locale, so nothing
          but the application start loads a language; a screen of raw keys
          means the catalogs are again waiting for the first snapshot.
    observe: |
      The screen shown in place of the tabs.
    expected: |
