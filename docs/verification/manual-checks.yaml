  - id: ANDROID-APP-UPDATE
    area: native
    title: Android prompts for a newer GitHub release, installs it through the system installer, and honours skip and turn-off
    persona: undergraduate-senior
    preconditions: |
      An Android build older than the latest published GitHub release, whose
      APK is attached to that release, signed with the release key; automatic
      update checks on in 設定 › 情報 (the default).
    steps:
      - action: Open the app (or bring it to the front).
        reason: |
          Core finds the newer release with its APK and offers it: a dialog
          「アップデートがあります」 with 「アップデート」「このバージョンをスキップ」
          「自動で確認しない」. No dialog while the release still lacks its APK
          means Core waits for it, as it should.
      - action: |
          Tap 「アップデート」; allow installing from this app if the system asks,
          then tap 設定 › 情報's update row.
