  - id: DESKTOP-EXAM-MARKS
    area: desktop
    title: Marked exams and quizzes stand out on the calendar and appear in every exam list
    persona: undergraduate-senior
    preconditions: |
      The desktop app with this week's classes on the Calendar, in light and
      then dark appearance.
    steps:
      - action: |
          Right-click a class, choose Mark as exam; right-click another, choose
          Mark as quiz; right-click the exam again and choose Mark as exam.
        reason: |
          The menu has three exclusive checkable items and no "normal class";
          choosing the checked one must return the session to a plain class.
          A stale check mark or a session that stays an exam is the bug.
      - action: |
          Compare the exam and quiz blocks with the plain classes around them.
        reason: |
          The exam was drawn lighter than a class (17% against 22%) and could
          not be told apart; it now takes the stronger fill, a ring in the
          course colour and a solid tag. The quiz is a little weaker, with an
          outlined tag, and never striped, since stripes mean cancelled.
      - action: |
          Open Lectures → Exams, then the marked course's panel and Today's
          upcoming exams.
        reason: |
          A marked session used to change only the calendar block. It must be
          listed under Exams as "Marked on the calendar", in the course's
          exams and on Today; clicking the calendar block must open it there.
      - action: |
          Settings → Notifications, turn off Count quizzes as exams, look at
          Today, then turn it back on.
        reason: |
          The switch decides whether quizzes count on Today and in exam
          reminders; a quiz that stays listed with it off means the setting is
          not read.
      - action: |
          In Lectures → Exams open the quiz, click Delete, then Undo in the
          notice. Delete it again and look at the calendar. Then Delete a
          published exam, search for it and link its course again.
        reason: |
          Deleting replaced "Hide from my schedule", which on a marked session
          hid the class itself with no way back. Delete must drop only the
          mark (the class stays on the calendar), Undo must bring the quiz
          back as a quiz, and a deleted published exam must leave My exams
          and Today yet stay findable by search.
    observe: |
      The calendar blocks, the Exams list and editor in Lectures, the notice
      at the bottom, the course panel and Today's upcoming exams.
    expected: |
      The exam block is clearly darker and ringed with a solid Exam tag, the
      quiz a step lighter, unstriped, with an outlined Quiz tag, both readable
      in dark mode;
      both sessions are listed in Exams (the quiz labelled Quiz), the course
      panel and Today, and the quiz leaves Today while the switch is off;
      Delete leaves a plain class on the calendar, Undo restores the quiz,
      and the published exam returns once its course is linked again.
    why_manual: |
      How strongly a block stands out is a glance check in the real window.
      Which sessions become exams, the toggle and the lists are covered by
      Core's schedule tests and the lecture-desk e2e suite.
    covers:
      - apps/desktop/src/pages/today/CalendarView.tsx
      - apps/desktop/src/components/timetable/timetable.tsx
      - apps/desktop/src/components/exams/ExamEditor.tsx
      - apps/desktop/src/app/notify.ts
      - apps/desktop/src/styles.css
      - design/tokens/course.json
