  - id: ANDROID-SCHOOL-POPUPS
    area: native
    title: Android school popups open over their opener, and school files save through Core
    persona: undergraduate-senior
    preconditions: |
      The Android debug build of this commit on a phone, signed in to
      教務Web.
    steps:
      - action: |
          On 教務Web, open a page with a picker button (for example the 申告
          page's 科目 search, during a 申告 period). Press the button, look at
          the window that opens, then close it with its own 閉じる button
          without choosing anything. Open it twice more and close it with ×
          in the ポップアップウィンドウ bar, then with the system back gesture.
        reason: |
          教務Web's showDialog opens a named window that answers through
          `window.opener` and closes itself. It used to load in the opener's
          view, losing the opener; now it is a real WebView handed to
          WebViewTransport, shown in place of the page with a
          ポップアップウィンドウ bar, and `window.close()` (onCloseWindow),
          × and back (when the popup has no page of its own to go back to)
          must each bring the opener back unchanged. Choosing would post back
          to the 申告 form, so the check stops before it.
      - action: |
          On 教務Web, open the menu (≡) → 「マニュアル」 and wait for the
          「…を保存しました」 toast. Open Files → Downloads.
        reason: |
          The manual is a `target=_blank` PDF, which WebView cannot show, so
          it opens a popup whose only navigation becomes a download. The
          host reports `becameDownload` (no page, saved) and Core closes the
          empty popup at once, while Core downloads the file with the
          session cookies and Android's platform TLS verifier.
      - action: |
          Open https://www.isct.ac.jp/ja/025/about/disclosure/environment/index.html
          in the address bar and tap 「環境報告書2026（PDF）」.
        reason: |
          A public school host outside the adapter sites, which serves the
          PDF `inline; filename="環境報告書2026.pdf"` from a PHP script, in
          raw UTF-8. Core reads the name from the response itself, whatever
          the disposition type.
      - action: |
          From 時間割, open a course with LMS slides and open one Slides row.
        reason: |
          Course files share the downloader the school files now go
          through; an LMS file must still open.
    observe: |
      The web screen while the picker popup is open, the bar above it, the
      opener page after closing; for each file, the web screen, the toast
      and Files → Downloads; for the slides, the viewer that opens.
    expected: |
      The picker fills the page area under a ポップアップウィンドウ bar with
      ×; closing it by its own button, by × or by back shows the opener
      exactly as it was, with no reload, and the bar goes. For the manual no
      blank popup or bar stays on screen, the toast says it was saved, and
      Downloads holds the manual as a PDF that opens (not an HTML sign-in
      page). The environment report is saved as `環境報告書2026.pdf`, not
      after the script that served it (`…download_file.php`). The slides
      open in a PDF viewer.
    why_manual: |
      Needs a 教務Web account, Android WebView's own windows, kyomu0's real
      certificate chain and MediaStore; whether the popup shows, the opener
      survives and the file arrives is seen at a glance. The child-window
      lifecycle, the close on `becameDownload`, the host allowlist and the
      file naming are Core's and tested there.
    covers:
      - apps/android/app/src/main/java/app/isctcompanion/core/SchoolBrowserHost.kt
      - apps/android/app/src/main/java/app/isctcompanion/core/SchoolDownloads.kt
      - apps/android/app/src/main/java/app/isctcompanion/core/WebRouter.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/web/WebScreens.kt
    verified: null

  - id: ANDROID-SCHOOL-NO-RESUBMIT
    area: native
    title: Android reload and back on a postback page never send its form again
    persona: undergraduate-senior
    preconditions: |
      The Android debug build of this commit on a phone, signed in to
      教務Web.
    steps:
      - action: |
          On the 成績 list, switch the 学期 (a postback that changes nothing
          on the school's side), then pick 再読み込み in the page menu.
        reason: |
          The app's Reload is Core's GET of the last page, as on the desktop
          and iOS: WebView's own reload is never used, so it never gets to
          resend the POST result and no notice is needed. On a 申告 page a
          resend repeats an action; here it is harmless, which is why this
          page is used.
      - action: |
          From that 成績 page, follow a link to another page, then press ‹
          (or system back).
        reason: |
          WebView never resends on back: a form result that is not cached
          fails with ERR_CACHE_MISS. Its own error page must not show; the
          app's notice covers it and offers このページを開き直す and 戻る.
      - action: |
          Press このページを開き直す.
        reason: |
          It loads the failed entry's address with a GET, as Retry does on
          iOS, so the form is not sent. It must not be the app's Reload,
          which would open the last page that arrived, the one Back left.
    observe: |
      The line under the bar after 再読み込み, the page area after ‹, and the
      成績 page after reopening.
    expected: |
      After 再読み込み the page opens in its initial state (the 学期 resets)
      with no 教務Web error page and no line under the bar. After ‹, the
      app's notice replaces WebView's "Webpage not available";
      このページを開き直す opens 成績 in its initial state.
    why_manual: |
      Needs a real WebForms postback inside Android WebView; the notice and
      the page are a glance. Which page Reload opens is Core's and tested
      there.
    covers:
      - apps/android/app/src/main/java/app/isctcompanion/core/SchoolBrowserHost.kt
      - apps/android/app/src/main/java/app/isctcompanion/core/WebRouter.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/web/WebScreens.kt
    verified: null

