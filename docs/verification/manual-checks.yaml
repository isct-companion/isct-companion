  - id: DESKTOP-MCP-LIVE
    area: desktop
    title: Desktop MCP endpoint against a real client
    persona: narrow-window-keyboard
    preconditions: |
      A built desktop app and a real MCP client.
    steps:
      - action: |
          Enable AI agent access, choose the client under Connect an agent,
          copy its setup and paste it unchanged (Claude Code: run it; Codex:
          ~/.codex/config.toml; Claude Desktop or Cursor: their JSON file).
        reason: |
          Initialization and the tool list are negotiated by the client, not
          by our tests; a real client is the only way to see that handshake.
          People could not get from a bare URL and token to a working client,
          so the copied text must work without editing. Every tool declares
          an output schema and hints; a client that rejects one drops or
          refuses that tool, so every tool in Core's registry must be listed
          and callable.
      - action: |
          Read today and the schedule through the client and compare with the
          app window.
        reason: |
          The point of the endpoint is parity with the UI. A read that differs
          from the window would go unnoticed by a protocol-only test.
      - action: |
          Retry with a wrong token and with a hostile Origin header, then
          check the token file's permissions.
        reason: |
          Authorization and file mode are the security boundary; 401, 403 and
          mode 0600 must all hold together.
    observe: |
      The client's initialization and tool list, the values it reads beside
      the app window, the HTTP status of each retry, and the token file mode.
    expected: |
      Initialization and the tool list succeed, the reads match the app, the
      wrong token returns 401, the hostile Origin returns 403, and the token
      file stays mode 0600.
