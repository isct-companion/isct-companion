# Manual acceptance checks.
#
# Source of truth for the behaviour CI cannot reach: real school credentials,
# provider consent screens, signed bundles, hardware and the native shells.
# These checks are written to be executed by a person or by an agent driving
# the real GUI (computer use). `docs/verification/manual-acceptance.md` is
# rendered from this file.
#
#   yarn verify:manual render            regenerate the rendered table
#   yarn verify:manual validate          check this file's structure
#   yarn verify:manual stale             which checks a pending change invalidates
#   yarn verify:manual sheet <ID>        a run sheet for one check and its persona
#   yarn verify:manual record <ID> ...   record a result
#
# Rules that keep this file honest:
#
# 1. Every step states its `reason`. A step without a reason is either
#    redundant or its author did not know what it was looking for; the check is
#    rejected. The reason names the failure the step would expose, so a
#    transcript can be reviewed for understanding rather than compliance.
# 2. Every check names a `persona` and says where to `observe` the result.
#    Behaviour is only meaningful relative to who is using the app, and a
#    result nobody can point at is not evidence.
# 3. Every check justifies itself in `why_manual`. If the flow could be driven
#    from `tests/`, it belongs there instead: a check whose `covers` paths are
#    all already exercised by automated suites is rejected. The exception is a
#    result a person sees at a glance in the real app (a layout, a label, where
#    a click lands): a short check here beats an e2e script that rebuilds the
#    screen over a fake host, and its `why_manual` says so.
# 4. `result` is `pass`, `fail` or `unreached`. `unreached` is for a flow that
#    could not be attempted at all (no account, no device); it is recorded with
#    `blocked_by` rather than left blank, because a silently missing row is how
#    an unverified area becomes an assumed-good one.
#
# Evidence: every recorded result points at something a reviewer can open — a
# transcript, screenshots or a note under the ignored `artifacts/` directory.
#
# 医歯学系 (Dream Campus, Web Class) is deliberately outside this file. A
# school page may link there and the person may browse it like any HTTPS site,
# but there is no adapter, no site mapping and no account, so Core's hidden
# work never goes there and nothing about it is verified. Which pages a view
# may load is Core's rule table, tested in
# `crates/app-core/src/tests/school_browser*.rs`.

version: 1

# ---------------------------------------------------------------------------
# Personas
#
# A persona fixes the identity, the language, the device and the habits of the
# simulated user. An agent running a check adopts the persona entirely: it
# knows only what that person would know, reads only what that person could
# read, and makes that person's mistakes. The identity personas follow the
# study stages the app itself models, because the eligibility rules differ by
# stage and those rules are what most of these checks are about.
# ---------------------------------------------------------------------------

personas:
  - id: undergraduate-first-term
    label: 理工学系 1年生・初学期
    identity: undergraduate
    context: |
      First quarter of the first year. Has never used this app; signed in once
      during orientation and does not remember which systems exist. Japanese
      UI and Japanese school content. Uses a trackpad, not the keyboard.
    behaviour: |
      Reads every label before clicking. Tries to add a course that is
      obviously above their year. Expects the app to explain refusals rather
      than only disabling a control. Abandons a flow that offers no obvious
      next step.
    language: ja
    device: macos-arm64

  - id: undergraduate-senior
    label: 理工学系 3年生・履修計画期
    identity: undergraduate
    context: |
      Third year, planning next quarter. Knows the syllabus site and the
      timetable well. Japanese UI, mixes Japanese and English course content.
      Works fast and expects the keyboard to work.
    behaviour: |
      Types course codes from memory instead of browsing. Opens details in
      quick succession. Adds a course that clashes with an existing one and
      expects to be told which one. Uses Undo immediately after a mistake.
    language: ja
    device: macos-arm64

  - id: masters-student
    label: 修士課程 1年・前期課程
    identity: masters
    context: |
      First year of a master's programme, first semester. Has an undergraduate
      record from the same institution that is already in the workspace.
      Japanese UI. Cares about credit requirements and about 500-level rules.
    behaviour: |
      Checks the grade and GPA panels first. Looks for requirements that apply
      only after the first semester. Notices when an undergraduate-only count
      or table is assumed.
    language: ja
    device: macos-arm64

  - id: doctoral-student
    label: 博士後期課程
    identity: doctoral
    context: |
      Doctoral programme, several years in. Reads the app mostly for research
      scheduling and for the few courses that require doctoral registration.
      Japanese UI.
    behaviour: |
      Ignores the timetable and goes straight to the requirement and
      registration panels. Expects doctoral-specific approval rules to be
      stated rather than silently enforced.
    language: ja
    device: macos-arm64

  - id: transfer-student
    label: 編入生
    identity: transfer
    context: |
      Transferred into the third year from another institution. Admission year
      differs from the cohort year of the courses being planned.
    behaviour: |
      Looks for their own admission cohort's guidance. Notices when a guide or
      requirement set from the wrong admission year is applied.
    language: ja
    device: macos-arm64

  - id: international-student
    label: International student
    identity: undergraduate
    context: |
      Reads English better than Japanese. Sets the UI to English and the
      school content to English where a translation exists. Signs in from a
      laptop on the campus network.
    behaviour: |
      Never switches to Japanese to decode a message. Reads error text
      literally. Notices untranslated strings, Japanese leaking into an
      English page, and dates that are ambiguous because the format is not
      stated.
    language: en
    device: macos-x64

  - id: careless-multidevice
    label: Two devices, interrupted work
    identity: masters
    context: |
      Uses the desktop app on two machines with cloud backup enabled. Quits
      mid-operation, sleeps the laptop, and lets the network drop.
    behaviour: |
      Closes the window while something is still running. Reopens and expects
      to see the result. Edits the same record on both machines on purpose.
    language: ja
    device: macos-arm64

  - id: narrow-window-keyboard
    label: Narrow window, keyboard only
    identity: undergraduate
    context: |
      Uses a small window on a laptop with an external monitor. Navigates by
      keyboard and never touches the mouse.
    behaviour: |
      Shrinks the window to its minimum size. Uses the number shortcuts and
      Escape. Tabs through a form and expects focus to stay visible.
    language: en
    device: macos-arm64

  - id: windows-snap-user
    label: Windows user snapping the desktop app
    identity: undergraduate
    context: |
      Uses the Windows desktop build on a laptop and keeps the app beside a
      browser or course document using Windows Snap.
    behaviour: |
      Expects the desktop navigation and the open course reader to stay usable
      as the app moves between full-size, half-screen and quarter-screen sizes.
    language: zh
    device: windows-x64

# ---------------------------------------------------------------------------
# Checks
# ---------------------------------------------------------------------------

checks:
  - id: SCHOOL-SIGNIN-SCIENCE
    area: school
    title: Core signs in to Science Tokyo over HTTP and the LMS page opens signed in
    persona: undergraduate-first-term
    preconditions: |
      A desktop build from this source, a live Science Tokyo student id,
      password and App OTP setup, and no saved Science Tokyo account (Forget
      it first if one is saved).
    steps:
      - action: |
          Open Settings → School accounts → Science Tokyo, enter the student
          id, password and OTP setup, and press Connect.
        reason: |
          Connect is one sign-in by Core over HTTP (Extic ID and password,
          TOTP, SAML to the LMS). The card must end on Signed in from that
          answer alone; a card that waits for a school page, or opens one,
          means a shell is still driving the sign-in.
      - action: |
          Without touching anything else, open the LMS from the site list.
        reason: |
          The page must open signed in from the identity Core wrote into the
          web store before the view navigated. Landing on Extic's sign-in page
          means the cookies were not written, or were written host-only.
      - action: |
          Forget the account, connect again with one wrong character in the
          password, then read the form and the card.
        reason: |
          A Connect the school refuses saves nothing: the form names the
          reason and says nothing was saved, keeps what was typed, and the
          card stays Not connected. A card that changes, or a draft that
          empties, means the refused input was kept somewhere.
      - action: |
          Connect with the right password. Look over the window and the log
          for the student id, the password or any code.
        reason: |
          Credential material must never be rendered or logged; the log names
          hosts and paths only.
    observe: |
      The Science Tokyo card in Settings, the LMS page in the Web page, and the
      log in Settings → Diagnostics.
    expected: |
      Connect ends on Signed in without any school page shown, and the LMS
      opens on the dashboard. The wrong password is refused once and only the
      form says so; nothing is saved. No credential value appears anywhere.
    why_manual: |
      Needs a real account, a live TOTP window and the platform web view's
      cookie store. The sign-in flow itself runs in the ignored real-account
      tests (`school_session::login`); only the app shows the card and the
      web view landing signed in.
    covers:
      - crates/app-core/src/school_session/**
      - crates/adpt-isct/src/login.rs
      - apps/desktop/src-tauri/src/school_cookies.rs
      - apps/desktop/src/pages/settings/SchoolAccounts.tsx
    verified: null

  - id: SCHOOL-SESSION-WINDOWS-VAULT
    area: school
    title: A long school session saves to Credential Manager and survives a relaunch
    persona: windows-snap-user
    preconditions: |
      A Windows desktop build of this commit with a real Tokyo Tech account
      saved, a network reaching 教務Web, and no other instance of the app
      running. Look at item names and sizes only, never at an item's value.
    steps:
      - action: |
          Start the app and use it until the log in Settings → Diagnostics
          shows "Kyomu session ready". Opening a school page alone may not do
          it: the web view keeps its own cookies, and only Core's read fills
          the jar that is saved.
        reason: |
          An identity alone fits one Credential Manager item. Only the site
          jars push the record past 2560 bytes, so a run that never reached a
          site proves nothing.
      - action: |
          Open Settings → Diagnostics and search the log for "session not
          saved". Run `cmdkey /list` and look for items named
          `school-session-tokyo-tech.part-0` and so on.
        reason: |
          The log alone cannot tell a save that fit from one that was spread;
          the part items show the long path really ran against the real vault.
      - action: |
          Quit the app from the tray, start it again and open 教務Web. Read
          the log from this launch.
        reason: |
          A relaunch is what the saved session is for. Without it a person
          signs in on every launch, which a save that only appeared to work
          would still do.
      - action: |
          Sign the account out in Settings, then run `cmdkey /list` again.
        reason: |
          A leftover part would keep session cookies in the vault after the
          person asked for them to go.
    observe: |
      Settings → Diagnostics, `cmdkey /list`, and 教務Web in the Web page.
    expected: |
      No "session not saved" line in any run. After the relaunch the log has
      "restored the saved session profile=TokyoTech" and no "signing in
      profile=TokyoTech", and 教務Web opens signed in. After the sign-out no
      `school-session-tokyo-tech` item is left, parts included.
    why_manual: |
      Needs a real account's cookies and the real Credential Manager, whose
      item limit no test vault can stand in for. Core's tests drive the same
      spreading over a vault that enforces the limit, but only the app shows
      whether a real session fits the bound and comes back signed in.
    covers:
      - apps/desktop/src-tauri/src/secrets.rs
      - crates/app-core/src/secret_parts.rs
      - crates/app-core/src/school_session/store.rs
    verified: null


  - id: SCHOOL-LMS-TOKEN-HTTP
    area: school
    title: Token-backed native reads and resource bytes
    persona: undergraduate-senior
    preconditions: |
      An authenticated Science Tokyo student account, explicit authorization
      for the official mobile token flow, and a network reaching the LMS.
      Follow docs/lms-api/README.md; never put real credentials in the evidence.
    steps:
      - action: |
          Obtain a token through the official browser launch flow. From a
          cookie-free reqwest client using the app download User-Agent and TLS
          validation, POST each of the eight documented read functions. Compare
          response structure with openapi.yaml and sample the current user's
          actual courses and assignment states.
        reason: |
          Proves native authentication and PHP form encoding work against the
          live school service; a signed-in browser or a JSON fixture cannot
          establish that the token works without browser cookies.
      - action: |
          Download a returned resource PDF with the same client. Check its
          byte count and file markers, then request bytes 0-1023 and compare
          Content-Range and the downloaded prefix. Repeat API and file reads
          with an invalid token, recording only status, type and error code.
        reason: |
          Exposes an HTML or JSON authentication response mistaken for a file,
          and protects partial-download consumers from accepting the wrong
          range or treating HTTP 200 alone as proof of success.
      - action: |
          Read the mobile logout policies. Record whether token creation and
          expiry times are actually exposed, and distinguish those facts from
          upstream defaults. Do not infer a TTL from inactive logout settings.
        reason: |
          Prevents promising a long-lived token based on the 86400-second
          disabled policy or assuming the school's token duration is the
          upstream default. Long-term expiry remains separate from this run.
      - action: |
          Using an existing token and no cookies, POST
          core_block_get_dashboard_blocks with returncontents=1. Feed the
          tttimetable content to Core's existing timetable parser and compare
          its day/period and unscheduled-course sets with a successful phone
          sync. Probe another quarter using the block's filter fields, record
          API rejection separately, then re-read the default dashboard.
        reason: |
          A generic block API may expose a school timetable even without a
          timetable-specific function. Parsing and comparing the real rows
          distinguishes complete data from a successful empty response;
          cross-quarter checks prevent promising all-quarter token access
          from a single default grid.
    observe: |
      Native response statuses, decoded read models, byte and range checks,
      and the sanitized evidence at docs/lms-api/verification.json.
    expected: |
      All eight sampled native POST reads succeed without cookies. A real
      PDF and its byte-range prefix match metadata and each other. Invalid
      tokens are rejected in the response body even when HTTP status is 200.
      Any unknown expiry is explicitly recorded, not presented as verified.
    why_manual: |
      Requires live student credentials, explicit token authorization, the
      school's gateway policy and real enrolled-course files. Offline tests
      cannot establish these account-scoped transport or lifecycle facts.
    covers:
      - crates/app-core/src/downloads.rs
    verified:
      version: 1.1.3
      date: 2026-10-20
      commit: 07bc59244f6bf1b050d4dcb9dd3952ce41074037
      by: codex
      result: pass
      notes: Eight native POST reads, complete PDF and Range, invalid-token controls
        passed. Exact expiry unknown; no natural expiration or revocation test.
        Supplemental 2026-10-22 probe used cookie-free native curl and the real
        Core parser; default 2026-3Q matched the phone exactly. Quarter 1/2/4
        filter requests returned invalidparameter; the original eight-function
        and file checks above retain their 2026-10-20 verification date.
      evidence: docs/lms-api/verification.json

  - id: SCHOOL-LMS-PULL
    area: school
    title: Full LMS pull against a real account
    persona: undergraduate-senior
    preconditions: |
      The account from SCHOOL-SIGNIN-SCIENCE is Signed in.
    steps:
      - action: |
          In a fresh disposable workspace, sign in and let the initial automatic
          full LMS pull finish. Then use Refresh now in the footer and verify
          it reads all courses, including quarters outside the current semester.
        reason: |
          The uninterrupted path establishes the baseline the interrupted path
          is compared against.
      - action: |
          Compare courses and assignments with the authenticated LMS. Then
          reopen a previously cached lecture and press its Pull from LMS; keep
          reading while Core refreshes that course.
        reason: |
          A pull that "succeeds" with silently dropped courses is the failure
          this step catches; matching counts alone would not.
      - action: |
          Open a visible school page in the middle of a second refresh.
        reason: |
          Sync reads go over HTTP and must neither stop nor wait for the
          visible page; a run that stalls until the page closes means a
          WebView dependency came back.
      - action: |
          After a successful fresh pull, browse each available quarter and search
          its actual course codes in Lecture Desk and Today's cross-quarter
          course finder. Select a result, switch tabs, and use Filter's clear
          button. Open a Calendar course and a real linked subscription exam.
        reason: |
          Real LMS shortnames and syllabus details must retain searchable class
          codes and restore room metadata after setup. Calendar navigation must
          select the exact course or exam in its quarter without stale filters;
          do not manufacture an exam association when this account has no match.
    observe: |
      The LMS page course and assignment lists, the refresh timestamp, and the
      visible school page that interrupted the second pull.
    expected: |
      The first pull matches the LMS course list and advances its timestamp;
      the lecture refresh reads that course only. Cached lecture content
      remains usable during refresh and changed content produces one quiet,
      short in-app update notice. Browsing a school page does not pause the
      refresh.
    why_manual: |
      Depends on the authenticated Moodle session above. The AJAX surface is
      read-only but account-scoped, so no fixture can stand in for a real
      enrolment.
    covers:
      - crates/app-core/src/lms_ingest.rs
      - crates/app-core/src/school_session/site.rs
      - crates/adpt-isct/src/lms.rs
      - crates/adpt-isct/src/lms/pages.rs
      - crates/app-core/src/net/moodle/reader.rs
      - crates/app-core/src/net/moodle/ajax.rs
      - crates/app-core/src/catalog.rs
      - crates/app-core/src/data/school_projection.rs
      - crates/app-core/src/schedule/search.rs
      - apps/desktop/src/pages/lectures/LectureDesk.tsx
    verified:
      version: 1.0.0-rc.1
      date: 2026-10-14
      commit: 7fdf1b6
      by: human
      result: pass
      notes: 7 matched courses, no differences.
      evidence: docs/verification/core-consolidation.md#live-macos-acceptance

  - id: SCHOOL-LMS-TOKEN-PULL
    area: school
    title: LMS pull over the mobile token, and its fallback to the session cookie
    persona: undergraduate-senior
    preconditions: |
      The account from SCHOOL-SIGNIN-SCIENCE is Signed in, with at least one
      course that has an assignment, a quiz and an announcement forum. A debug
      desktop build with the app log visible.
    steps:
      - action: |
          With no LMS token in the vault (fresh profile, or after forgetting
          and re-adding the school account), run a full LMS pull.
        reason: |
          The token comes from one cookie-authenticated launch.php GET answered
          by a 302 to moodlemobile://; only the real site proves the redirect,
          the base64 layout and the md5(wwwroot + passport) signature agree
          with the parser.
      - action: |
          Search the exported app log and the database file for the token's
          first characters (read them from the OS keychain item
          "lms-token-science" yourself; never paste the token anywhere).
        reason: |
          The token cannot be revoked by a student. A leak into a log, a row or
          an error message is the failure this step exists to catch.
      - action: |
          Compare courses, assignment states (submitted, graded with grade,
          late-allowed), quiz states and announcement bodies with the LMS
          pages and with the previous cookie-based pull.
        reason: |
          Several REST functions (`mod_quiz_*`, `mod_forum_get_forums_by_courses`,
          the module getters, the calendar views, the timeline course list) are
          listed by the site but their answers were never probed. A silently
          empty mapping looks like "nothing to do" in Today.
      - action: |
          On a fresh profile let the first automatic pull finish, then open the
          timetable's other quarters (an earlier and a later one). Wait for a
          later automatic pull, then press Refresh now.
        reason: |
          The token dashboard shows only the current quarter. The key's first
          read and the refresh button take every quarter's grid over the
          session cookie; an automatic read takes only the current one and
          keeps the others. Courses of a non-current quarter falling into
          集中・時間未定 is the failure this exposes.
      - action: |
          Quit and restart the app, then pull courses, the default timetable
          and deadlines before opening any school page. Repeat a background
          wake with Cookie/browser ports unavailable, and compare cached
          historical quarters before and after the default-grid update.
        reason: |
          The token survives independently of the web session. Daily course
          and timetable reads must reach the dashboard-block API without a
          WebView sign-in, and a default-grid update must preserve historical
          quarter data.
      - action: |
          Replace the keychain item's token with a random 32-character value and
          pull again.
        reason: |
          A refused token arrives as HTTP 200 with errorcode invalidtoken; the
          client must drop it, sign in once and launch a new one rather than
          loop or fall back silently forever.
      - action: |
          Block `webservice/rest/server.php` (for example with a local proxy
          rule) and pull once more.
        reason: |
          The cookie transport must take over with the same results; the app
          log names the fallback reason without any credential.
    observe: |
      The LMS page lists, Today's assignment rows, the app log export and the
      keychain item.
    expected: |
      The first pull creates exactly one vault item and matches the LMS like
      SCHOOL-LMS-PULL. No log line, database row or error contains the token,
      sesskey or passport. After the restart the deadlines refresh before any
      school page opens. The forged token is replaced after one sign-in and
      the pull completes. Every quarter's courses sit at their times after the
      first pull and after Refresh now; the automatic pull keeps them. With
      REST blocked the pull completes through the
      cookie path with the same courses and states, and the log says the
      token transport was unavailable.
    why_manual: |
      Needs a real account's web session to launch a token, and the answers of
      account-scoped REST functions that no fixture can stand in for. The pure
      parsing and mapping are covered by the net::moodle unit tests.
    covers:
      - crates/app-core/src/net/moodle/mod.rs
      - crates/app-core/src/net/moodle/reader.rs
      - crates/app-core/src/net/moodle/mapping.rs
      - crates/app-core/src/net/moodle/token.rs
      - crates/app-core/src/net/moodle/rest.rs
      - crates/app-core/src/net/moodle/ajax.rs
      - crates/app-core/src/school_auth.rs
      - crates/app-core/src/plan/school.rs
      - crates/app-core/src/plan/planner.rs
      - docs/lms-api/README.md
    verified: null

  - id: SCHOOL-SYNC-REFUSED-PASSWORD-TOKEN
    area: school
    title: After a refused password, deadlines still update over the token while the full timetable refresh asks to reconnect
    persona: undergraduate-senior
    preconditions: |
      The account from SCHOOL-SIGNIN-SCIENCE is Signed in on a desktop build
      from this source, a first LMS pull has finished (so the keychain holds
      "lms-token-science"), and the person can change their Science Tokyo
      password on the school's own site and change it back afterwards. The
      app log is visible.
    steps:
      - action: |
          Quit the app. On the school's site, change the Science Tokyo
          password. In the OS keychain, delete only the item
          "school-session-science" (keep "lms-token-science").
        reason: |
          This leaves exactly the state the change is about: the saved
          password now refused by the school, no saved LMS session or
          identity, and a token that still works. Deleting the token too
          would test the other branch (nothing on the path can serve).
      - action: |
          Start the app and press the timetable's Refresh now.
        reason: |
          A refresh reads the enrolment list in full, whose other quarters
          come only from the signed-in dashboard: the session is needed, a
          sign-in with the saved password is refused, and the card must turn
          to Refused while the status bar says it waits for the person
          (設定での操作を待っています) without a failure or retry time.
      - action: |
          Without reconnecting, press Refresh now on Assignments and wait
          about a minute. Then read the latest runs in the store (read-only):
          sqlite3 -readonly "$HOME/Library/Application Support/app.isctcompanion"/store/*/store.db
          "select dataset,key,finished_at,outcome from sync_runs order by finished_at desc limit 40;"
        reason: |
          Deadlines, course outlines and assignment states read over the
          token alone. The defect fixed here held every key of the account
          after one refusal, so these keys would stop updating. A successful
          read logs nothing at INFO level, so its run record is the evidence:
          lms.deadlines, lms.course and lms.assign must end complete after
          the timetable's sign-in-required run, with no second password
          POST in the log. No new LMS data is needed (students may not be
          able to add calendar events on the school's LMS).
      - action: |
          Watch the app log for two minutes without touching anything.
        reason: |
          A key that ended waiting must not be leased again while nothing
          changed: repeated "ended waiting" lines for the timetable, or
          repeated sign-in attempts with the refused password, mean the
          planner spins or ignores the refusal on record.
      - action: |
          Change the password back on the school's site (or connect with the
          new one) and press Connect in Settings.
        reason: |
          Connect is a credential fact change: the timetable refresh that was
          waiting must start on its own, without another press.
    observe: |
      The Science Tokyo card in Settings, the status bar, the sync_runs
      table of the store, and the app log.
    expected: |
      With the refused password the card says Refused and the timetable
      refresh waits for the person, while lms.deadlines, lms.course and
      lms.assign runs still complete over the token. The log shows one
      refused password POST and no repeated sign-in, and sync_runs shows no
      new run of the waiting key while nothing changes. After Connect the
      timetable refresh runs by itself and completes.
    why_manual: |
      Needs a real account whose password the school refuses while its LMS
      token still works, which no fixture reproduces (the session suite does
      not simulate the school, `approach/school-sign-in-verification`). The
      planner rule behind it, which keys wait for which credential facts, is
      covered by the plan unit tests; this check proves the facts the
      real school produces lead there.
    covers:
      - crates/app-core/src/plan/planner.rs
      - crates/app-core/src/plan/runner.rs
      - crates/app-core/src/plan/school.rs
      - crates/app-core/src/plan/snapshot.rs
