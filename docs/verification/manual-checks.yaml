  - id: MOBILE-NOTIFICATION-PERMISSION
    area: native
    title: A phone asks for notifications when synced reminders need them, and sends a test
    persona: careless-multidevice
    preconditions: |
      Class or assignment reminders turned on in the desktop app, cloud sync
      on, and the iPhone and Android apps freshly installed (never asked for
      notifications) in the same workspace.
    steps:
      - action: |
          Open each phone app and let it sync, without touching 設定 › 通知.
        reason: |
          The reminder switches arrive on through sync, so no switch-on ever
          asks on this device. The phone must ask the first time Core has a
          reminder for it; without the prompt nothing is scheduled and the
          person is never told, as happened on desktop.
      - action: |
          With the app open, tap 設定 › 通知 › 通知のテスト › 送信.
        reason: |
          The test arrives while the app is in front. iOS hides such a
          notification unless the app presents it, so a missing banner here
          also means every reminder that fires while the app is open is lost.
      - action: |
          Deny notifications in the system settings, return, and tap 送信
          again, then 設定を開く.
        reason: |
          The page must show the system's real answer and lead to this app's
          notification settings rather than claim the test was sent.
      - action: |
          Leave 設定 › 通知, swipe the app away and reopen it, then open the
          page again; allow notifications in the system settings and return.
        reason: |
          A refusal outlives the visit: the page still says so and offers
          設定を開く, and a relaunch does not prompt again (Android asks only
          until refused, as iOS does). Allowing in the system settings
          schedules the waiting reminders on return. On Android the page
          re-reads the answer itself, since Android cannot tell "never
          asked" from "refused" without the shell's record.
      - action: |
          Android: with reminders scheduled (`adb shell dumpsys alarm` lists
          app.isctcompanion.REMIND alarms), restart the phone without opening
          the app, and read the list again after boot.
        reason: |
          Android clears alarms on a reboot or an update, which iOS's
          scheduled notifications survive; the app must put Core's reminders
          back on its own within a minute of boot.
    observe: The system prompts, the banner, and 設定 › 通知 on both phones.
    expected: |
      Each phone asks once after the first sync; the test shows a banner with
      the app in front; after denying, the page says notifications are not
      allowed and 設定を開く opens the app's notification settings, also on
      a later visit, with no new prompt; Android's reminders are back after a
      reboot without opening the app.
    why_manual: |
      The permission prompt, banners and system settings exist only on real
      devices with a signed app; which reminders are due is Core's
      notification plan, covered by its tests.
    covers:
      - apps/ios/IsctCompanion/Core/NotificationScheduler.swift
      - apps/ios/IsctCompanion/Features/Settings/NotificationSettings.swift
      - apps/ios/IsctCompanion/App/IsctCompanionApp.swift
      - apps/android/app/src/main/java/app/isctcompanion/core/NotificationScheduler.kt
      - apps/android/app/src/main/java/app/isctcompanion/features/settings/SettingsPages.kt
      - apps/android/app/src/main/java/app/isctcompanion/App.kt
      - apps/android/app/src/main/java/app/isctcompanion/BackgroundWake.kt
      - apps/android/app/src/main/AndroidManifest.xml
    verified: null

