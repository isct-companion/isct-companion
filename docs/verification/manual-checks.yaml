  - id: DESKTOP-SCHOOL-POPUPS
    area: desktop
    title: School popups open over their opener and close back to it
    persona: undergraduate-senior
    preconditions: |
      macOS desktop build of this commit, signed in to 教務Web and the LMS,
      with a course whose material includes a PDF.
    steps:
      - action: |
          On 教務Web, open a page with a picker button (for example the 申告
          page's 科目 search, during a 申告 period). Press the button, look at
          the window that opens, then close it with its own 閉じる button or
          the app's Close window, without choosing anything.
        reason: |
          教務Web's showDialog opens a named window that answers through
          `window.opener` and closes itself. It used to be faked inside the
          page; now it is a real WebKit window over the opener, so it must
          appear inside the web pane, and `window.close()` must bring the
          opener back unchanged. Choosing would post back to the 申告 form,
          so the check stops before it.
      - action: |
          On 教務Web's top page, open 「マニュアル」.
        reason: |
          A `target=_blank` PDF used to replace the page; it now opens as a
          popup, and the page behind it must still be there after Close
          window.
      - action: |
          On an LMS course page, open a PDF material that opens in a new
          window, then Close window. If the course offers a Word or other
          file that is not shown, open it the same way. Then open a
          notebook (.ipynb), HTML or plain-text attachment, for example an
          assignment's attached notebook.
        reason: |
          The LMS sends PDFs as attachments, which the app fetches and shows.
          The popup's download used to be shown in the course page behind
          it, leaving the popup blank until it was closed. A file that is
          only saved leaves its popup empty, so Core closes that popup.
          Every attachment WebKit could display used to be shown in place:
          a notebook appeared as raw, garbled JSON with no way to save it,
          and an HTML or SVG file would have run as a page of the LMS. Only
          PDFs, images and media are shown now; the rest are saved.
      - action: |
          Set the Web page's zoom to 120%, open the 教務Web picker or an LMS
          PDF popup, then change the zoom to 90% while it is open.
        reason: |
          A popup is a web view of its own; it used to stay at 100% whatever
          the app's zoom said.
      - action: |
          In a popup, select some text and press ⌘C, then paste it into another
          app. Copy text from another app, click a text field in a popup, press
          ⌘V, then ⌘A. Do the same on a school page without a popup. In the
          LMS text editor, press ⌘B on a selection and leave without saving.
          Do not submit any form.
        reason: |
          A popup's command keys used to stop inside WKWebView, so ⌘C and ⌘V
          did nothing there while its context menu's Copy worked, and a main
          view's never reached the page. Now the focused view asks the Edit
          menu first and the page gets the rest, which only the native window
          can show.
      - action: |
          In Lectures, open an assignment you have submitted a PDF to with
          View in LMS, and click the submitted PDF in the reader pane.
        reason: |
          Moodle opens a submitted file in a new window. The reader pane had
          no popup line, so the PDF covered the assignment with no way out.
          Every surface that shows the view now shows the popup line.
      - action: |
          Press the reader's Back (‹).
        reason: |
          The PDF window starts with no history; Back used to go to that
          empty history and do nothing. Back on a window at the start of its
          history closes it, as a browser closes a tab a page opened.
      - action: |
          Open the PDF again. Switch to Today and back to Lectures: the PDF
          is still in front. Then close the assignment, open the course
          again and choose View in LMS.
        reason: |
          Coming back to the same reader keeps the page as it was, window
          included. Entering the course again is an app link, which closes
          the windows over the view; it used to navigate the covered view
          and leave the person on the PDF.
      - action: |
          With the reader on the assignment, turn Wi-Fi off and press the
          reader's Reload. Then open the Web page on LMS, and come back to
          the reader. Turn Wi-Fi on and press Retry.
        reason: |
          A failed load is part of the page Core keeps, not a one-time
          event, so the failure line and its Retry must still be there on
          the other surface and after switching back, and must clear once
          the page loads.
    observe: |
      The web pane while the window is open, the address and the Close
      window line above the page (in the Web page and in the reader pane),
      the opener page after closing, the Downloads folder for a saved file,
      the popup's text size, and the failure line with Retry.
    expected: |
      Each window covers the page inside the web pane with its own address,
      a Close window line appears, and closing returns to the opener exactly
      as it was, with no reload. The LMS PDF shows in the popup and the
      course page underneath is unchanged; a saved file, the notebook, HTML
      or text attachment included, lands in Downloads under its own name and
      no empty window stays open. A popup opens at the app's zoom and
      follows a change. ⌘C, ⌘V and ⌘A work in popups and on school pages, and
      the LMS editor's ⌘B makes the selection bold. In the reader pane the PDF shows with a Close window
      line and the PDF's address; Back closes it and the assignment is in
      front; switching away and back keeps the PDF, while entering the
      course again shows the assignment with no window over it. The failure
      line shows on both surfaces until Retry loads the page.
    why_manual: |
      Needs a 教務Web account, a submitted LMS assignment and WebKit's own
      windows; whether the popup sits in the pane, which page is in front
      and which line shows is seen at a glance. The entry rules (resume,
      return, go), the back rule, which attachment types are shown in place
      and the failure's lifetime are Core's and tested there; the reader
      reading them from the snapshot is tested in the desktop suite.
    covers:
      - apps/desktop/src-tauri/src/school_webkit.rs
      - apps/desktop/src-tauri/src/school_browser_native.rs
      - apps/desktop/src/pages/web/WebPage.tsx
      - apps/desktop/src/features/lms/OfficialLmsView.tsx
      - apps/desktop/src/features/school-web/**
    verified: null

  - id: DESKTOP-SCHOOL-NO-RESUBMIT
    area: desktop
    title: Reload on a postback page reopens it with a GET and sends no form
    persona: undergraduate-senior
    preconditions: |
