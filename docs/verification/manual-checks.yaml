  - id: DESKTOP-FINDER-CATALOG-DOWNLOAD
    area: desktop
    title: Course search on a year whose catalog is not stored yet
    persona: undergraduate-first-term
    preconditions: |
      A desktop build with a fresh workspace (or after clearing the school
      cache), signed in to TokyoTech.
    steps:
      - action: |
          Open the timetable and click into the course search before the
          catalog has been downloaded.
        reason: |
          With nothing stored the finder must say "Downloading the {year}
          course catalog" rather than "No matching courses", which would read
          as a real empty result.
      - action: |
          Type a course code and wait without typing further.
        reason: |
          Results must appear on their own when Core commits the catalog. A
          search that needs another keystroke means the finder stopped
          following the snapshot.
      - action: |
          Clear the field and watch the stored count in the finder header
          while the download is still running.
        reason: |
          Core commits one department at a time and tells the finder each
          year that changed. The count and the rows must grow in steps,
          several times before the download ends; rows that appear only once
          it finishes mean the catalog-changed event does not reach the
          finder. The rows must not flicker or jump back to the top more than
          about four times a second.
      - action: |
          Search several conditions in a row with the network off.
        reason: |
          Search is local only; a spinner or error while offline means a
          remote search path came back.
    observe: |
      The course finder header and empty state, and the app log for network
      requests while typing.
    expected: |
      The download notice, then results that fill in department by
      department without retyping, and instant results offline.
    why_manual: |
      The first-download timing needs a real empty cache and the real 教務Web
      catalog. The switch on a catalog-changed event is covered in
      tests/e2e/planner.test.tsx, the event's per-year coalescing in
      Core's facade tests and the shown year's first-read priority in the
      sync planner tests; how a real download fills the list is a glance
      check.
    covers:
      - apps/desktop/src/pages/courses/CourseFinder.tsx
      - apps/desktop/src/pages/courses/useFinder.ts
      - crates/app-core/src/catalog.rs
