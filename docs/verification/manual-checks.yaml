  - id: IOS-TIMETABLE-WEEK-AND-MARKS
    area: native
    title: iPhone timetable header, fitted blocks, session marks and the now line
    persona: undergraduate-first-term
    preconditions: |
      The iPhone app with the current quarter pulled, opened on a weekday
      between the first period's start and the last period's end (Tokyo time).
    steps:
      - action: |
          Open 時間割 and read the title block: the quarter and week label is
          an accent capsule with a calendar symbol on its own row, on one
          line, and tapping it or the date range opens the week picker.
        reason: |
          The capsule used to share a column with the range and a share
          button, so it wrapped onto two lines; on its own row it may take the
          full width.
      - action: |
          Swipe the grid left twice, then tap 今日.
        reason: |
          Swiping is now the only way to step weeks; the range figures must
          roll in place. 今日 is dimmed on the current week and active
          elsewhere, so a dimmed 今日 on another week or an active one on this
          week is wrong.
      - action: |
          Find a two-period class with a long English title and one whose
          room field lists several rooms.
        reason: |
          The title fills the block's height instead of stopping at three
          lines over empty space, and only the first room shows; a cut title
          over blank space or a room list ending in … is the old layout.
      - action: |
          Long press a class and choose 試験にする, then 休講にする, then
          通常の授業に戻す, reopening the menu each time.
        reason: |
          Each mark is Core's MarkSession and must redraw at once: a deeper
          fill with a solid 試験 tag above the title and no ring, then a grey
          striped block with a struck-through title and 休講, then the plain
          block; the tick must follow the state. Plan blocks must offer no
          menu.
      - action: |
          Look at today's column during a teaching hour.
        reason: |
          The red now line with its dot sits at the current time and moves
          every half minute; outside the axis, and on weekends when the grid
          shows the coming week, there is no line by design.
      - action: |
          Swipe quickly through the next three weeks and back.
        reason: |
          One read covers four weeks either side, so each step draws its
          blocks with the header; blocks that arrive after the date range
          changed mean the window cache was skipped.
      - action: |
