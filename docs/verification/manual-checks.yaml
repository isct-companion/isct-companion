  - id: ANDROID-DRIVE-SIGNIN
    area: cloud
    title: Android signs in to Google Drive through the account prompt
    persona: careless-multidevice
    preconditions: |
      The release-signed APK from the Android release workflow, with its package
      and certificate SHA-1 registered on the Android release OAuth client,
      installed on a phone with Play services. The OAuth app is in production;
      use a Google account outside its test-user list. A desktop app has Drive
      on and at least one weekly event uploaded.
    steps:
      - action: |
          設定 › バックアップ: turn on Google Drive and decline Google's
          prompt.
        reason: |
          The switch must stay off with the reason under it. A crash or a
          switch left on means the consent result was not read.
      - action: |
          Turn it on again, allow the prompt, then Pull.
        reason: |
          The desktop's weekly event must arrive. If Google does not know the build
          (UNREGISTERED_ON_API_CONSOLE), the Drive row says so and names the
          SHA-1 to register on the Android client; each signing key (each
          machine's debug key, the release key) needs its own entry. A
          closed account chooser leaves the switch off without an error.
      - action: |
          Swipe the app away, reopen it, edit a record and Upload; Pull on the
          desktop.
        reason: |
          A relaunch must get a token without showing the prompt again; a
          prompt or an authorization error means the remembered connection or
          the silent authorization failed.
      - action: |
          Export a backup file to Files and import it again.
        reason: |
          Android had no backup page before; export and import must go through
          the system document picker, and the import must reach Drive at once
          as a new version.
      - action: |
          Turn Google Drive off, then Upload and Pull on the desktop. Swipe the
          app away, reopen it and turn Drive on again.
        reason: |
          Turning off forgets only this phone: Google revokes a grant for
          every client of the project, so a revoke here would sign the desktop
          out of Drive too. The desktop must keep syncing without an
          authorization error, and turning Drive on again reconnects without
          a prompt because the grant was kept.
      - action: |
          With Drive on, 設定 › リセット › 完全リセット: choose
          クラウドから復元する, acknowledge and reset; repeat once with
          新しい端末として始める.
        reason: |
          Restore turns the providers that were on back on and pulls, as on
