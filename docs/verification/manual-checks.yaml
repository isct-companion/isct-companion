          The page must wait for Core's sign-in and stay open with the reason
          (ワンタイムパスワードが受け付けられませんでした plus the school's own
          words), not close and leave only ログインに失敗しました. Closing at
          once means the shell still saves and hopes instead of connecting.
      - action: |
          Go back to 設定 and read the Science Tokyo row, then reopen the
          account page.
        reason: |
          The row shows ログインに失敗しました：<reason>, and the page shows the
