  - id: IOS-ICLOUD-BACKUP
    area: cloud
    title: iPhone and Mac load each other's data through one iCloud record
    persona: careless-multidevice
    preconditions: |
      The released (Developer ID) Mac app and the iPhone app, both signed with
      the team that owns `iCloud.app.isctcompanion`, on one Apple Account. Both
      builds carry the Production container environment, so both read the same
      CloudKit database; `codesign -d --entitlements - <app>` on each shows it.
    steps:
      - action: |
          On the Mac, Settings → Backup: turn on iCloud and Upload. On the
          iPhone, 設定 › バックアップ: turn on iCloud and Pull.
        reason: |
          The phone must load the Mac's plans, notes and hidden assignments.
          Nothing arriving usually means the two builds use different CloudKit
          environments or containers, not a merge bug.
      - action: |
          On the iPhone hide an assignment and Upload; on the Mac Pull.
        reason: |
          The reverse direction goes through the phone's CloudKitStore write;
          a refused or partial write shows as an iCloud error on the phone.
      - action: |
          Without pulling first, edit a different record on each device, then
          Upload on both.
        reason: |
          The second upload must lose CloudKit's conditional save, re-read and
          merge. Losing either edit means a write replaced a record it had not
          read.
      - action: |
          Turn on Sync automatically on both. Add a plan on the Mac and Upload,
          then force-quit the iPhone app and open it again without pressing
          Pull.
        reason: |
          Automatic mode pulls at launch and when the app comes to the front; a
          phone that is only read never uploads, so this is the only way it
          sees the Mac's edits. The plan missing after the relaunch means the
          launch pull did not run or read another database.
      - action: |
          Sign out of iCloud on the iPhone (Settings › Apple Account), reopen
          バックアップ, then sign back in.
        reason: |
          The provider line must name the reason under the generic failure
          text. Only the generic text means the error is being hidden again,
          which is what made sync failures impossible to tell apart.
      - action: |
          On the iPhone, open 以前のバージョン and restore one; then export a
          backup file on the Mac and import it on the phone with 読み込む….
        reason: |
          Restore and import both start a new generation on every device and
          leave a local recovery file; the Mac must follow on its next Pull.
    observe: |
      The Backup pages on both devices (provider line, versions, recovery
      files) and the records themselves on each.
    expected: |
      Each device shows the other's changes after a Pull, and the phone after a
      relaunch in automatic mode; both concurrent edits survive, a failure names
      its reason, the version list names both devices, and a restore or import
      on the phone reaches the Mac with a recovery file kept on each.
    why_manual: |
      CloudKit needs a signed build, an iCloud account and a device; the
      merge, tag-conditional write and journal behind it are covered by
      `sessions_sharing_one_cloud_record_load_each_others_data` and
      `tagged_writes_carry_the_tag_read_with_the_expected_revision`.
    covers:
      - apps/ios/IsctCompanion/Core/CloudKitStore.swift
      - apps/ios/IsctCompanion/Features/Settings/BackupScreen.swift
      - apps/desktop/src-tauri/src/icloud.rs
      - apps/desktop/src-tauri/Entitlements.plist
      - apps/desktop/src/pages/settings/BackupSettings.tsx
    verified: null

  - id: DESKTOP-DEBUG-ICLOUD
    area: cloud
    title: A debug bundle has iCloud exactly when this Mac can sign it
    persona: careless-multidevice
    preconditions: |
      A Mac whose keychain holds an Apple Development identity of team
      FB7AL944GK and whose Xcode has downloaded that team's Mac profile for
      `app.isctcompanion` listing this Mac (Xcode › Settings › Accounts ›
      Download Manual Profiles).
    steps:
      - action: |
          Run `yarn tauri build --debug` and read the line that starts with
          "Debug bundle:".
        reason: |
          It must say the bundle is signed with the Apple Development profile.
          "ad-hoc" on this Mac means the profile or identity was not matched,
          and the build would have no iCloud.
      - action: |
          Open target/debug/bundle/macos/IsctCompanion.app, then Settings →
          Backup.
        reason: |
          The iCloud row must be there and sync without a crash. A launch that
          dies with SIGILL means iCloud was compiled in but the bundle lacks
          the entitlement, so build.rs and the signing step disagree.
      - action: |
          Move the profile out of ~/Library/Developer/Xcode/UserData/Provisioning
          Profiles, build again, open the bundle, then put the profile back.
        reason: |
          Without a profile the line must say ad-hoc, Backup must show no
          iCloud row, and the app must still start: a debug build on a Mac
          without a developer account stays usable.
    observe: |
      The build output, the Backup page of each bundle, and
      `codesign -d --entitlements - target/debug/bundle/macos/IsctCompanion.app`.
    expected: |
      With the profile: signed by the Apple Development identity, entitlements
      include the Production iCloud environment, and iCloud syncs. Without it:
      ad-hoc, no iCloud row, no crash.
    why_manual: |
      It depends on this Mac's keychain identities, its downloaded profiles and
      a real codesign run, none of which exist on CI; that the iCloud switch
      and history survive a build without iCloud is unit-tested in
      `unsupported_provider_deliveries_do_not_replay_and_supported_provider_can_return`.
    covers:
      - scripts/desktop/macos-signing.mjs
      - scripts/desktop/tauri.mjs
      - apps/desktop/src-tauri/build.rs
    verified: null

  - id: CLOUD-PROVIDER-COMBINATIONS
    area: cloud
    title: Devices started apart on iCloud and Drive join and relay through a Mac with both
    persona: careless-multidevice
    preconditions: |
      One Apple Account and one Google account. A signed Mac app (iCloud and
      Drive), an iPhone app with only iCloud on, and an Android phone with only
      Drive on. Each device starts with its own data: before any device has
      both providers, add a different plan on the iPhone (Upload to iCloud)
      and on the Android phone (Upload to Drive). Import a backup file on the
      Android phone first, so its copy is a restore generation ahead.
    steps:
      - action: |
          On the Mac, add a third plan, turn on iCloud and Google Drive in
          Settings → Backup (Drive through the browser consent), then Upload.
        reason: |
          The two clouds hold copies with different workspace ids. The old
          build refused the second provider with "a different workspace"; any
          error here, or a missing plan, means the copies were not joined.
      - action: |
          Pull on the iPhone and on the Android phone.
        reason: |
          Each must show all three plans. A phone that loses its own plan means
          the joined copy replaced its data by generation instead of merging.
      - action: |
          Turn on Sync automatically on the Mac and leave it open. Add a plan
          on the iPhone and Upload; do nothing on the Mac for an hour, then
          Pull on the Android phone.
        reason: |
          The Mac must relay iCloud's change to Drive from its hourly remote
          check, with no local edit. The plan missing on Android after the hour
          means the relay still waits for an edit or a relaunch.
      - action: |
          On the Mac turn Drive off, add a plan, Upload, then turn Drive on
          again.
        reason: |
          Turning a provider back on must merge its old copy and upload the
          merged data at once, not wait out the hourly limit or report a
          conflict.
    observe: |
      The plans on each device, each device's Backup page (provider lines,
      errors) and the version lists of both providers.
    expected: |
      No device reports a workspace error; every device ends with every plan;
      the iPhone's plan reaches Android through the Mac within about two hours
      without touching the Mac; re-enabling Drive brings it up to date at once.
    why_manual: |
      It needs real iCloud and Google accounts on three devices and an hour of
      wall-clock time. The join, the generation handling and the relay logic
      are covered by
      `separately_started_workspaces_join_across_providers_and_every_device_converges`
      and `a_device_with_both_providers_relays_on_its_remote_checks_without_a_local_edit`.
    covers:
      - crates/isct-core/src/cloud_sync/mod.rs
      - crates/isct-core/src/data/cloud_merge.rs
      - crates/isct-core/src/data/backup_store.rs
    verified: null

